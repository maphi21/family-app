  }
  function chevronDownSvg(){
    return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
  }

  function closeSvg(){
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  }

  // dateKey the calendar is expanded to, per person — at most one open at a
  // time per card. Ephemeral, not persisted.
  const expandedCalendarDay = {};

  function calendarRingGradient(percent, color){
    if (percent <= 0) return '#eef0f3';
    if (percent >= 100) return color;
    return `conic-gradient(${color} 0% ${percent}%, #eef0f3 ${percent}% 100%)`;
  }

  function renderCalendar(p){
    const today = new Date();
    const todayKeyStr = dateKey(today);
    const gridStart = addDaysKey(mondayKey(today), -7 * CALENDAR_WEEKS_BACK);
    const totalDays = 7 * (CALENDAR_WEEKS_BACK + 1 + CALENDAR_WEEKS_FORWARD);
    // Only people with a weekly habit get the extra "WK" column — otherwise
    // it would be an always-empty ring on every row, pure clutter.
    const hasWeekly = habitDefsOf(p.id).some((h) => h.freq === 'weekly');
    const liveWeekAnchor = state.people[p.id].weekAnchor;

    // "Full days in a row" streak, walking back from yesterday (today's own
    // in-progress state is shown separately by the ring above) — bounded
    // only by how far back per-day records actually exist, not by the
    // visible 4-week grid, so it doesn't understate a longer real streak.
    let streak = 0;
    let cursor = addDaysKey(todayKeyStr, -1);
    while (true) {
      const c = dayCompletion(p.id, cursor);
      if (c.total === 0 || c.done === null || c.done !== c.total) break;
      streak++;
      cursor = addDaysKey(cursor, -1);
    }

    const dowHtml = ['M', 'T', 'W', 'T', 'F', 'S', 'S']
      .map((l) => `<div class="cal-dow-label">${l}</div>`).join('')
      + (hasWeekly ? `<div class="cal-week-divider"></div><div class="cal-dow-label">WK</div>` : '');

    let weeksHtml = '';
    for (let w = 0; w * 7 < totalDays; w++) {
      let rowHtml = '';
      for (let d = 0; d < 7; d++) {
        const off = w * 7 + d;
        const k = addDaysKey(gridStart, off);
        const date = parseDateKeyToDate(k);
        const isToday = k === todayKeyStr;
        const isFuture = k > todayKeyStr;
        const c = dayCompletion(p.id, k);
        const percent = c.total ? Math.round((c.done / c.total) * 100) : 0;
        const hasRecord = c.done !== null;
        // Today isn't editable here — it already has its own tap-to-toggle
        // checkboxes in the habit list above; this cell is display-only. A
        // past day with no record yet (app wasn't opened that day) is still
        // clickable — the day panel just starts every habit unchecked.
        const clickable = !isFuture && !isToday && c.total > 0;

        let ring = '#ffffff', border = 'none';
        if (isFuture) { border = '1.5px dashed #a8afb8'; }
        else if (!hasRecord) { border = '1.5px dotted #d8dbe0'; }
        else { ring = calendarRingGradient(percent, p.color); }

        const isMonthStart = date.getDate() === 1;
        const monthTag = isMonthStart
          ? `<div class="cal-month-tag">${date.toLocaleDateString('en-GB', { month:'short' })}</div>`
          : '';
        const todayShadow = isToday ? 'box-shadow:0 0 0 2px #22262b;' : '';
        const opacity = isFuture ? 'opacity:.55;' : '';

        rowHtml += `<div class="cal-cell-wrap">`
          + monthTag
          + `<div class="cal-cell ${clickable ? 'clickable' : ''}" data-person="${p.id}" data-date="${k}" style="${todayShadow}${opacity}">`
          +   `<div class="cal-cell-ring" style="background:${ring};border:${border};"></div>`
          +   `<div class="cal-cell-num">${date.getDate()}</div>`
          + `</div>`
          + `</div>`;
      }
      if (hasWeekly) {
        const weekAnchorKey = addDaysKey(gridStart, w * 7);
        const wc = weekCompletion(p.id, weekAnchorKey);
        const isFutureWeek = weekAnchorKey > liveWeekAnchor;
        const wHasRecord = wc.done !== null;
        const wPercent = wc.total ? Math.round((wc.done / wc.total) * 100) : 0;
        let wRing = '#ffffff', wBorder = 'none';
        if (isFutureWeek) { wBorder = '1.5px dashed #a8afb8'; }
        else if (!wHasRecord) { wBorder = '1.5px dotted #d8dbe0'; }
        else { wRing = calendarRingGradient(wPercent, p.color); }
        const wInner = (!isFutureWeek && wHasRecord)
          ? (wPercent >= 100 ? checkSvg() : `<span style="font-size:8px;">${wc.done}/${wc.total}</span>`)
          : '';
        const wOpacity = isFutureWeek ? 'opacity:.55;' : '';
        rowHtml += `<div class="cal-week-divider"></div>`
          + `<div class="cal-cell-wrap">`
          +   `<div class="cal-cell" style="${wOpacity}">`
          +     `<div class="cal-cell-ring" style="background:${wRing};border:${wBorder};"></div>`
          +     `<div class="cal-cell-num">${wInner}</div>`
          +   `</div>`
          + `</div>`;
      }
      weeksHtml += `<div class="cal-week${hasWeekly ? ' has-weekly' : ''}">${rowHtml}</div>`;
    }

    return `<div class="cal-head">`
      +   `<div class="cal-title">Last ${CALENDAR_WEEKS_BACK} weeks</div>`
      +   `<div class="cal-streak">${flameSvg()}${streak}d full</div>`
      + `</div>`
      + `<div class="cal-dow${hasWeekly ? ' has-weekly' : ''}">${dowHtml}</div>`
      + `<div class="cal-weeks">${weeksHtml}</div>`;
  }

  // Shows only while a past/today day is expanded for this person — lets
  // each daily habit be corrected for that specific day.
  function renderCalendarDayPanel(p){
    const dateKeyStr = expandedCalendarDay[p.id];
    if (!dateKeyStr) return '';
    const c = dayCompletion(p.id, dateKeyStr);
    const date = parseDateKeyToDate(dateKeyStr);
    const label = date.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
    const dailyDefs = habitDefsOf(p.id).filter((h) => h.freq === 'daily');
    const log = state.people[p.id].habitDayLog[dateKeyStr];

    const rows = dailyDefs.map((h) => {
      const done = log ? !!log[h.id] : false;
      return `<div class="cal-day-row" data-person="${p.id}" data-date="${dateKeyStr}" data-habit="${h.id}">`
        + `<div class="cal-day-check" style="background:${done ? p.color : 'transparent'};border-color:${done ? 'transparent' : '#a8afb8'};">${done ? checkSvg() : ''}</div>`
        + `<div class="cal-day-name">${escapeHtml(h.name)}</div>`
        + `</div>`;
    }).join('');

    return `<div class="cal-day-panel">`
      + `<div class="cal-day-panel-head">`
      +   `<div class="cal-day-panel-title">${label}</div>`
      +   `<button class="cal-day-panel-close" data-person="${p.id}">${closeSvg()}</button>`
      + `</div>`
      + (!c.editable ? `<div class="cal-day-note">From before this device tracked which habits &mdash; edit to set it.</div>` : '')
      + rows
      + `</div>`;
  }

  function renderHabitRow(p, h){
    const hs = habitStateOf(p.id, h.id);
    const isWeekly = h.freq === 'weekly';
    const filled = isWeekly ? hs.count >= h.target : hs.done;
    const indicator = isWeekly
      ? `<div class="habit-indicator habit-indicator--weekly" style="background:${filled ? p.color : '#eef0f3'};color:${filled ? '#ffffff' : '#3d434b'};">${hs.count}/${h.target}</div>`
      : `<div class="habit-indicator" style="background:${filled ? p.color : 'transparent'};border-color:${filled ? 'transparent' : '#a8afb8'};">${filled ? checkSvg() : ''}</div>`;
    return `<div class="habit-row" data-person="${p.id}" data-habit="${h.id}">`
      + indicator
      + `<div class="habit-name" style="text-decoration:${filled && !isWeekly ? 'line-through' : 'none'};opacity:${filled ? 0.6 : 1};">${escapeHtml(h.name)}</div>`
      + `<div class="habit-streak">${flameSvg()}${hs.streak}${isWeekly ? 'w' : 'd'}</div>`
      + `</div>`;
  }

  function renderCard(p){
    const totalPoints = computeTotalPoints(p.id);
    const spendablePoints = computeSpendablePoints(p.id);
    const lv = computeLevel(totalPoints);
    const levelTitle = LEVEL_TITLES[Math.min(lv.level, LEVEL_TITLES.length) - 1];
    const ranked = [...ROSTER].sort((a, b) => computeTotalPoints(b.id) - computeTotalPoints(a.id));
    const rank = ranked.findIndex((r) => r.id === p.id) + 1;

    const defs = habitDefsOf(p.id);
    const dailyDefs = defs.filter((h) => h.freq === 'daily');
    const weeklyDefs = defs.filter((h) => h.freq === 'weekly');
    const dailyDone = dailyDefs.filter((h) => habitStateOf(p.id, h.id).done).length;
    const dailyTotal = dailyDefs.length;
    const dailyPercent = dailyTotal ? Math.round((dailyDone / dailyTotal) * 100) : 0;
    // Weekly ring mirrors the daily one but sums count/target across every
    // weekly habit, since a single weekly habit isn't binary done/not-done.
    const weeklyDone = weeklyDefs.reduce((sum, h) => sum + habitStateOf(p.id, h.id).count, 0);
    const weeklyTotal = weeklyDefs.reduce((sum, h) => sum + h.target, 0);
    const weeklyPercent = weeklyTotal ? Math.round((weeklyDone / weeklyTotal) * 100) : 0;

    const bday = nextBirthdayInfo(p.birthday.month, p.birthday.day, new Date());
    const showBday = bday.today || bday.diffDays <= SHOW_BDAY_WITHIN_DAYS;
    const bdayBg = bday.today ? '#ffc93c' : '#e9f6fe';
    const bdayColor = bday.today ? '#22262b' : '#146590';

    const rankBg = rank === 1 ? '#ffc93c' : '#eef0f3';
    const rankColor = rank === 1 ? '#22262b' : '#3d434b';
    const levelBg = tint(p.color, 0.14);
    // Both chips always render — just invisible (not removed) when this
    // person doesn't have one — so every card reserves identical space here
    // and the level/ring rows below always start at the same height,
    // regardless of who actually has a birthday coming up.
    const bdayPlaceholder = showBday ? '' : ' chip-placeholder';

    // Today's pocket money: unlike the weekly-allowance estimate (banked at
    // rollover from daily habits only, see weeklyEstimate()), this is a
    // live "how much have I earned today" reading, points-weighted across
    // BOTH daily and weekly habits (a habit worth more points counts for
    // more, same as it does everywhere else in the app) and applied to the
    // daily share (weekly ÷ 7) of pocket money. Shown as a small value
    // sitting in the gap between the two habit rings, not its own ring —
    // it's a supporting figure, not another thing to visually compete with
    // "today" and "this week".
    const showMoney = pocketWeeklyOf(p.id) > 0;
    const dailyPointsEarned = dailyDefs.reduce((sum, h) => sum + (habitStateOf(p.id, h.id).done ? h.points : 0), 0);
    const dailyPointsPossible = dailyDefs.reduce((sum, h) => sum + h.points, 0);
    const weeklyPointsEarned = weeklyDefs.reduce((sum, h) => sum + habitStateOf(p.id, h.id).count * h.points, 0);
    const weeklyPointsPossible = weeklyDefs.reduce((sum, h) => sum + h.target * h.points, 0);
    const todayMoneyPointsEarned = dailyPointsEarned + weeklyPointsEarned;
    const todayMoneyPointsPossible = dailyPointsPossible + weeklyPointsPossible;
    const todayMoneyRatio = todayMoneyPointsPossible ? todayMoneyPointsEarned / todayMoneyPointsPossible : 0;
    const todayMoney = showMoney ? roundMoney((pocketWeeklyOf(p.id) / 7) * todayMoneyRatio) : 0;
    const moneyGapHtml = showMoney ? `<div class="ring-gap-money">&pound;${todayMoney.toFixed(2)}</div>` : '';

    const habitsHtml = (dailyDefs.length ? `<div class="habit-group-label">Daily</div>${dailyDefs.map((h) => renderHabitRow(p, h)).join('')}` : '')
      + (weeklyDefs.length ? `<div class="habit-group-label">Weekly</div>${weeklyDefs.map((h) => renderHabitRow(p, h)).join('')}` : '');

    return `<div class="card ${p.id === state.selectedId ? 'is-selected' : ''}" data-person="${p.id}">`
      + `<div class="card-header">`
      +   `<div class="card-header-left">`
      +     `<div class="avatar" style="background:${p.color};">${p.initial}</div>`
      +     `<div><div class="person-name">${escapeHtml(p.name)}</div><div class="person-role">${escapeHtml(p.role)}</div></div>`
      +   `</div>`
      +   `<div class="card-header-right">`
      +     `<div class="rank-badge" style="background:${rankBg};color:${rankColor};">#${rank}</div>`
      +     `<div class="points-stat">Total <b>${totalPoints}</b></div>`
      +     `<div class="points-stat">Now <b>${spendablePoints}</b></div>`
      +   `</div>`
      + `</div>`
      + `<div class="bday-row">`
      +   `<div class="bday-chip${bdayPlaceholder}" style="background:${bdayBg};color:${bdayColor};">${cakeSvg()}${formatBirthday(bday)}</div>`
      + `</div>`
      + `<div class="level-row">`
      +   `<div class="level-badge" style="background:${levelBg};color:${p.color};">${lv.level >= 3 ? medalSvg() : starSvg()}${escapeHtml(levelTitle)}</div>`
      +   `<div class="level-num">Lvl ${lv.level}</div>`
      + `</div>`
      + `<div class="level-block">`
      +   `<div class="level-bar-row">`
      +     `<div class="level-track"><div class="level-fill" style="width:${Math.round((lv.into / lv.span) * 100)}%;background:${p.color};"></div></div>`
      +     `<div class="level-caption">${lv.into}/${lv.span}</div>`
      +   `</div>`
      + `</div>`
      + `<div class="ring-holder">`
      +   `<div class="ring-wrap">`
      +     `<div class="ring-outer" style="background:${ringGradient(dailyPercent, p.color)};"></div>`
      +     `<div class="ring-inner"><div class="ring-value">${dailyDone}/${dailyTotal}</div><div class="ring-label">today</div></div>`
      +   `</div>`
      +   moneyGapHtml
      +   `<div class="ring-wrap">`
      +     `<div class="ring-outer" style="background:${ringGradient(weeklyPercent, p.color)};"></div>`
      +     `<div class="ring-inner"><div class="ring-value">${weeklyDone}/${weeklyTotal}</div><div class="ring-label">this week</div></div>`
      +   `</div>`
      + `</div>`
      + `<div class="habit-list">${habitsHtml}</div>`
      + `<div class="cal">${renderCalendar(p)}</div>`
      + renderCalendarDayPanel(p)
      + `</div>`;
  }

  function renderSwitcher(){
    return ROSTER.map((p) => {
      const active = state.currentPage === 'pageSettings' ? p.id === state.settingsFilterId : p.id === state.selectedId;
      return `<div class="switcher-pill" data-person="${p.id}">`
        + `<div class="switcher-avatar ${active ? 'is-active' : ''}" style="background:${p.color};--ring-color:${p.color};">${p.initial}</div>`
        + `<div class="switcher-label ${active ? 'is-active' : ''}">${escapeHtml(p.name)}</div>`
        + `</div>`;
    }).join('');
  }

  function renderRewardRow(reward){
    const points = computeSpendablePoints(state.selectedId);
    const affordable = points >= reward.cost;
    return `<div class="reward-row">`
      + `<div class="reward-row-info">`
      +   `<div class="reward-row-name">${escapeHtml(reward.name)}</div>`
      +   `<div class="reward-row-costs">`
      +     `<div class="reward-cost">${starSvg()}${reward.cost} pts</div>`
      +     (reward.cash ? `<div class="reward-cash">${banknoteSvg()}+&pound;${reward.cash}</div>` : '')
      +   `</div>`
      + `</div>`
      + `<button class="reward-row-btn" data-reward="${reward.id}" ${affordable ? '' : 'disabled'}>Redeem</button>`
      + `</div>`;
  }

  // "How much can I spend right now" — points for the shop below.
  function renderPageStats(){
    const personId = state.selectedId;
    const pts = computeSpendablePoints(personId);
    return `<div class="page-stats">`
      + `<div class="pts-available"><b>${pts}</b> pts to spend</div>`
      + `</div>`;
  }

  // Real money saved (weekly allowance + any cashed-out rewards), on the
  // Wallet tab. Earned total never drops even after a withdrawal; saved is
  // the live balance.
  function renderPiggyStats(){
    const personId = state.selectedId;
    if (!piggyEligible(personId)) return '';
    const p = ROSTER.find((r) => r.id === personId);
    const saved = piggyBalance(personId);
    const earned = piggyEarnedTotal(personId);
    // The live "building" estimate for the week in progress -- same figure
    // that used to sit on the habit card as a text chip, now shown here
    // instead since Wallet is the money-focused page. Only relevant to
    // someone with a weekly allowance set; someone piggyEligible purely
    // from a cashed-out reward has no ongoing weekly payout to expect.
    const showExpected = pocketWeeklyOf(personId) > 0;
    const expected = showExpected ? weeklyEstimate(personId) : 0;
    return `<div class="wallet-hero" style="background:${p.color};">`
      + `<div class="wallet-hero-icon">${piggyBankSvg(104)}</div>`
      + `<div class="wallet-hero-label">${escapeHtml(p.name)}&rsquo;s piggy bank</div>`
      + `<div class="wallet-hero-balance">&pound;${saved.toFixed(2)}</div>`
      + `<div class="wallet-hero-earned">&pound;${earned.toFixed(2)} earned total</div>`
      + `</div>`
      + (showExpected ? `<div class="wallet-expected">${piggyBankSvg(13)}&pound;${expected.toFixed(2)} expected this week</div>` : '');
  }

  // The action buttons + ledger appear as soon as someone's eligible for the
  // piggy bank at all — at £0.00 to start, not just after their first payout —
  // so the feature is discoverable instead of invisible.
  function renderPiggySection(){
    const personId = state.selectedId;
    if (!piggyEligible(personId)) return '';
    const balance = piggyBalance(personId);
    const ledger = (state.people[personId].piggyLedger || []).slice().sort((a, b) => b.at.localeCompare(a.at));
    const expanded = !!ledgerExpanded[personId];
    const cappedTotal = Math.min(ledger.length, LEDGER_MAX_ROWS);
    const visible = ledger.slice(0, expanded ? LEDGER_MAX_ROWS : LEDGER_DEFAULT_ROWS);
    const rows = visible.map((e) => {
      const isCredit = e.delta >= 0;
      const d = new Date(e.at);
      const dateStr = Number.isNaN(d.getTime()) ? '' : d.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
      return `<div class="ledger-row">`
        + `<div class="ledger-icon ${isCredit ? 'is-in' : 'is-out'}">${isCredit ? arrowUpSvg(15) : arrowDownSvg(15)}</div>`
        + `<div class="ledger-reason">${escapeHtml(e.reason)}<span class="ledger-date">${dateStr}</span></div>`
        + `<div class="ledger-amount ${isCredit ? 'ledger-in' : 'ledger-out'}">${isCredit ? '+' : '&minus;'}&pound;${Math.abs(e.delta).toFixed(2)}</div>`
        + `</div>`;
    }).join('');
    const toggleHtml = ledger.length > LEDGER_DEFAULT_ROWS
      ? `<button class="ledger-toggle-btn" data-person="${personId}">${expanded ? 'Show less' : `Show more (${cappedTotal - LEDGER_DEFAULT_ROWS})`}</button>`
      : '';
    const cappedNote = (expanded && ledger.length > LEDGER_MAX_ROWS)
      ? `<div class="ledger-capped-note">Showing the most recent ${LEDGER_MAX_ROWS} of ${ledger.length}.</div>`
      : '';

    // Only shown while this device hasn't unlocked the family PIN this
    // session — see openWalletAction/submitWalletPin.
    const addLocked = !!state.settingsPin && !settingsUnlocked;

    let actionPanelHtml = '';
    if (walletAction === 'withdraw') {
      actionPanelHtml = `<div class="wallet-form-card">`
        + `<div class="wallet-form-title">Withdraw<button class="wallet-form-close" data-action="close">${closeSvg()}</button></div>`
        + `<div class="withdraw-row">`
        +   `<input type="number" id="withdrawAmount" class="withdraw-input" placeholder="0.00" min="0.01" max="${balance}" step="0.01" autofocus>`
        +   `<input type="text" id="withdrawNote" class="withdraw-note" placeholder="What for? (optional)" maxlength="60">`
        +   `<button class="withdraw-btn" id="withdrawBtn">Withdraw</button>`
        + `</div>`
        + `</div>`;
    } else if (walletAction === 'addPin') {
      actionPanelHtml = `<div class="pin-gate-card">`
        + `<div class="pin-gate">`
        +   `<div class="pin-gate-icon">${lockSvg(20)}</div>`
        +   `<div class="pin-gate-title">Enter PIN to add money</div>`
        +   `<div class="pin-gate-sub">Same PIN that locks Settings.</div>`
        +   `<input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" class="pin-input" id="walletPinInput" placeholder="PIN" autocomplete="off" autofocus>`
        +   `<button class="pin-unlock-btn" id="walletPinBtn">Continue</button>`
        + `</div>`
        + `</div>`;
    } else if (walletAction === 'addForm') {
      actionPanelHtml = `<div class="wallet-form-card">`
        + `<div class="wallet-form-title is-money">${plusSvg(14)} Add money<button class="wallet-form-close" data-action="close">${closeSvg()}</button></div>`
        + `<div class="withdraw-row">`
        +   `<input type="number" id="addMoneyAmount" class="withdraw-input" placeholder="0.00" min="0.01" step="0.01" autofocus>`
        +   `<input type="text" id="addMoneyNote" class="withdraw-note" placeholder="What for? (optional)" maxlength="60">`
        +   `<button class="withdraw-btn" id="addMoneyBtn">Add</button>`
        + `</div>`
        + `</div>`;
    }

    return `<div class="piggy-section">`
      + `<div class="wallet-actions">`
      +   `<button class="wallet-action-btn is-withdraw" id="walletWithdrawTrigger" ${balance > 0 ? '' : 'disabled'}>Withdraw</button>`
      +   `<button class="wallet-action-btn is-add" id="walletAddTrigger">`
      +     plusSvg(14)
      +     `Add money`
      +     (addLocked ? `<span class="wallet-action-lock">${lockSvg(10)}</span>` : '')
      +   `</button>`
      + `</div>`
      + actionPanelHtml
      + `<div class="ledger-label">History</div>`
      + `<div class="ledger-list">${rows}</div>`
      + toggleHtml
      + cappedNote
      + `</div>`;
  }

  // Only appears once the selected person owns at least one un-used reward —
  // buying (Redeem, in the shop below) and claiming (Use, here) are separate
  // actions, so this stays empty most of the time instead of showing dead
  // controls for everything that hasn't been bought yet.
  function renderWalletStrip(){
    const inventory = state.people[state.selectedId].rewardInventory;
    const owned = REWARDS.filter((r) => (inventory[r.id] || 0) > 0);
    if (!owned.length) return '';
    const chips = owned.map((r) => `<div class="wallet-chip">`
      + `<div class="wallet-chip-name">${escapeHtml(r.name)} &times;${inventory[r.id]}</div>`
      + `<button class="wallet-use-btn" data-reward="${r.id}">Use 1</button>`
      + `</div>`).join('');
    return `<div class="wallet-strip">`
      + `<div class="wallet-label">Ready to use</div>`
      + `<div class="wallet-list">${chips}</div>`
      + `</div>`;
  }

  function renderLeaderboard(){
    const ranked = [...ROSTER].sort((a, b) => computeTotalPoints(b.id) - computeTotalPoints(a.id));
    const maxTotal = Math.max(1, ...ranked.map((p) => computeTotalPoints(p.id)));
    return ranked.map((p, i) => {
      const total = computeTotalPoints(p.id);
      const now = computeSpendablePoints(p.id);
      const rank = i + 1;
      const barPct = Math.round((total / maxTotal) * 100);
      const lv = computeLevel(total);
      const levelTitle = LEVEL_TITLES[Math.min(lv.level, LEVEL_TITLES.length) - 1];
      const levelBg = tint(p.color, 0.14);
      return `<div class="lb-row">`
        + `<div class="lb-rank ${rank === 1 ? 'first' : ''}">#${rank}</div>`
        + `<div class="avatar" style="background:${p.color};">${p.initial}</div>`
        + `<div class="lb-info">`
        +   `<div class="lb-name-row">`
        +     `<div class="lb-name">${escapeHtml(p.name)}</div>`
        +     `<div class="lb-level-num">Lvl ${lv.level}</div>`
        +   `</div>`
        +   `<div class="level-badge" style="background:${levelBg};color:${p.color};">${lv.level >= 3 ? medalSvg() : starSvg()}${escapeHtml(levelTitle)}</div>`
        +   `<div class="lb-bar-track"><div class="lb-bar-fill" style="width:${barPct}%;background:${p.color};"></div></div>`
        + `</div>`
        + `<div class="lb-points">`
        +   `<div class="lb-total">${total}</div>`
        +   `<div class="lb-now">${now} now</div>`
        + `</div>`
        + `</div>`;
    }).join('');
  }

  function formatActivityTime(iso){
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return '';
    const now = new Date();
    const dKey = dateKey(d), todayKeyStr = dateKey(now), yestKeyStr = addDaysKey(todayKeyStr, -1);
    const time = d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    if (dKey === todayKeyStr) return `Today, ${time}`;
    if (dKey === yestKeyStr) return `Yesterday, ${time}`;
    return `${d.toLocaleDateString('en-GB', { day:'numeric', month:'short' })}, ${time}`;
  }

  function renderHabitForm(){
    const draft = habitDraft || {};
    const isDaily = draft.freq === 'daily';
    return `<div class="habit-form">`
      + `<div>`
      +   `<div class="habit-form-label">Habit name</div>`
      +   `<input type="text" id="habitNameInput" class="habit-form-input" value="${escapeHtml(draft.name || '')}" placeholder="e.g. Read 20 minutes" maxlength="60">`
      + `</div>`
      + `<div>`
      +   `<div class="habit-form-label">Frequency</div>`
      +   `<div class="habit-form-toggle">`
      +     `<button class="habit-freq-btn ${isDaily ? 'active' : ''}" data-freq="daily">Daily</button>`
      +     `<button class="habit-freq-btn ${!isDaily ? 'active' : ''}" data-freq="weekly">Weekly</button>`
      +   `</div>`
      + `</div>`
      + (!isDaily
          ? `<div>`
            + `<div class="habit-form-label">Times per week</div>`
            + `<div class="habit-stepper">`
            +   `<button class="habit-step-btn" data-field="target" data-delta="-1">&minus;</button>`
            +   `<div class="habit-step-value">${draft.target || 1}</div>`
            +   `<button class="habit-step-btn" data-field="target" data-delta="1">+</button>`
            + `</div>`
            + `</div>`
          : '')
      + `<div>`
      +   `<div class="habit-form-label">Points</div>`
      +   `<div class="habit-stepper">`
      +     `<button class="habit-step-btn" data-field="points" data-delta="-5">&minus;</button>`
      +     `<div class="habit-step-value">${draft.points || 10}</div>`
      +     `<button class="habit-step-btn" data-field="points" data-delta="5">+</button>`
      +   `</div>`
      + `</div>`
      + `<div class="habit-form-actions">`
      +   `<button class="habit-cancel-btn" id="habitCancelBtn">Cancel</button>`
      +   `<button class="habit-save-btn" id="habitSaveBtn">Save</button>`
      + `</div>`
      + `</div>`;
  }

  // Only rendered once a specific person is focused via the switcher on
  // Settings — editing needs one person, so this section is skipped for
  // "everyone". Just the body — heading lives in the collapsible wrapper.
  function renderPocketEditorBody(personId){
    const current = pocketWeeklyOf(personId);
    return `<div class="pocket-editor">`
      + `<div class="withdraw-row">`
      +   `<input type="number" id="pocketWeeklyInput" class="withdraw-input" min="0" step="0.5" value="${current}">`
      +   `<button class="withdraw-btn" id="pocketWeeklySaveBtn">Save</button>`
      + `</div>`
      + `<div class="pocket-editor-note">Paid out at the end of each week, scaled by how many days&rsquo; habits were completed. &pound;0 turns the piggy bank off.</div>`
      + `</div>`;
  }

  function renderSettingsGate(){
    return `<div class="pin-gate">`
      + `<div class="pin-gate-icon">${lockSvg(24)}</div>`
      + `<div class="pin-gate-title">Settings locked</div>`
      + `<div class="pin-gate-sub">Enter the PIN to continue.</div>`
      + `<input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" class="pin-input" id="pinInput" placeholder="PIN" autocomplete="off" autofocus>`
      + `<button class="pin-unlock-btn" id="pinUnlockBtn">Unlock</button>`
      + `</div>`;
  }

  function renderSecuritySectionBody(){
    if (state.settingsPin) {
      return `<div class="security-row">`
        +   `<div class="security-note">This page is locked with a PIN.</div>`
        +   `<button class="security-btn" id="pinRemoveBtn">Remove PIN</button>`
        + `</div>`;
    }
    return `<div class="withdraw-row">`
      +   `<input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" id="pinNewInput" class="withdraw-input" placeholder="4+ digits">`
      +   `<button class="withdraw-btn" id="pinSetBtn">Lock with PIN</button>`
      + `</div>`;
  }

  function cloudSyncStatusInfo(){
    switch (cloudSyncStatus) {
      case 'connecting': return { dot: '', text: 'Cloud sync connecting&hellip;' };
      case 'connected': return { dot: 'is-good', text: 'Cloud sync live &mdash; changes appear on other devices instantly.' };
      case 'degraded': return { dot: 'is-warn', text: 'Cloud sync partially working &mdash; changes save, but only appear on other devices after a reload.' };
      case 'error': return { dot: 'is-warn', text: 'Cloud sync unavailable right now &mdash; saving to this device only.' };
      default: return { dot: '', text: 'Cloud sync not set up &mdash; this device only.' };
    }
  }

  function renderBackupSectionBody(){
    const sync = cloudSyncStatusInfo();
    const showDetail = (cloudSyncStatus === 'error' || cloudSyncStatus === 'degraded') && cloudSyncErrorDetail;
    return `<div class="backup-status">${lastExportLabel()}</div>`
      + `<div class="sync-status"><span class="sync-dot ${sync.dot}"></span>${sync.text}</div>`
      + (showDetail ? `<div class="sync-error-detail">${escapeHtml(cloudSyncErrorDetail)}</div>` : '')
      + `<div class="withdraw-row">`
      +   `<button class="withdraw-btn" id="exportBackupBtn">Export backup</button>`
      +   `<button class="security-btn" id="importBackupBtn">Import backup</button>`
      + `</div>`
      + `<input type="file" id="importFileInput" accept="application/json" style="display:none;">`
      + `<div class="pocket-editor-note">Downloads everything as a JSON file you can keep somewhere safe, then use Import to restore it later &mdash; on this device or a new one.</div>`
      + `<div class="security-row backup-reset-row">`
      +   `<div class="security-note">Done testing? Wipe everything and start from zero.</div>`
      +   `<button class="security-btn" id="resetDataBtn">Reset data</button>`
      + `</div>`;
  }

  function renderHabitEditorBody(personId){
    const defs = habitDefsOf(personId);

    const rows = defs.map((h, i) => {
      if (habitEditingId === h.id) return renderHabitForm();
      const freqLabel = h.freq === 'daily' ? 'Daily' : `Weekly &times;${h.target}`;
      return `<div class="habit-editor-row">`
        + `<div class="habit-editor-reorder">`
        +   `<button class="habit-move-btn" data-habit="${h.id}" data-dir="-1" ${i === 0 ? 'disabled' : ''}>${chevronUpSvg()}</button>`
        +   `<button class="habit-move-btn" data-habit="${h.id}" data-dir="1" ${i === defs.length - 1 ? 'disabled' : ''}>${chevronDownSvg()}</button>`
        + `</div>`
        + `<div class="habit-editor-info">`
        +   `<div class="habit-editor-name">${escapeHtml(h.name)}</div>`
        +   `<div class="habit-editor-meta">${freqLabel} &middot; ${h.points} pts</div>`
        + `</div>`
        + `<button class="habit-edit-btn" data-habit="${h.id}">${pencilSvg()}</button>`
        + `<button class="habit-delete-btn" data-habit="${h.id}">${trashSvg()}</button>`
        + `</div>`;
    }).join('');

    const addSection = habitEditingId === 'new' ? renderHabitForm() : `<button class="habit-add-btn" id="habitAddBtn">+ Add habit</button>`;

    return `<div class="habit-editor">`
      + `<div class="habit-editor-list">${rows}</div>`
      + addSection
      + `</div>`;
  }

  // Same 10-default/100-max cap as the piggy ledger, with its own toggle —
  // this list grows fast (every habit tick logs an entry) so it needs its
  // own limit rather than showing the family's entire history at once.
  function renderActivityLog(){
    const filterId = state.settingsFilterId;
    const entries = filterId ? state.activityLog.filter((e) => e.personId === filterId) : state.activityLog;
    if (!entries.length) {
      return filterId
        ? '<div class="activity-empty">Nothing from them yet.</div>'
        : '<div class="activity-empty">Nothing yet &mdash; habits, redemptions, and payouts will show up here.</div>';
    }
    const cappedTotal = Math.min(entries.length, LEDGER_MAX_ROWS);
    const visible = entries.slice(0, activityExpanded ? LEDGER_MAX_ROWS : LEDGER_DEFAULT_ROWS);
    const rows = visible.map((e) => {
      const p = ROSTER.find((r) => r.id === e.personId);
      if (!p) return '';
      return `<div class="activity-row">`
        + `<div class="avatar activity-avatar" style="background:${p.color};">${p.initial}</div>`
        + `<div class="activity-body">`
        +   `<div class="activity-msg"><b>${escapeHtml(p.name)}</b> ${e.msg}</div>`
        +   `<div class="activity-time">${formatActivityTime(e.at)}</div>`
        + `</div>`
        + `</div>`;
    }).join('');
    const toggleHtml = entries.length > LEDGER_DEFAULT_ROWS
      ? `<button class="activity-toggle-btn">${activityExpanded ? 'Show less' : `Show more (${cappedTotal - LEDGER_DEFAULT_ROWS})`}</button>`
      : '';
    const cappedNote = (activityExpanded && entries.length > LEDGER_MAX_ROWS)
      ? `<div class="ledger-capped-note">Showing the most recent ${LEDGER_MAX_ROWS} of ${entries.length}.</div>`
      : '';
    return rows + toggleHtml + cappedNote;
  }

  // Each Settings section keeps its heading always visible as a collapse/
  // expand toggle for its own body, rather than one big all-or-nothing
  // switch — the pocket-money/habit editors only exist for a focused person.
  function renderSettingsSection(key, iconHtml, headingHtml, bodyHtml, bodyClass){
    const expanded = !!settingsSectionOpen[key];
    return `<div class="settings-section">`
      + `<button class="settings-section-toggle" data-section="${key}">`
      +   `<span class="settings-section-heading-group">`
      +     `<span class="settings-section-icon">${iconHtml}</span>`
      +     `<span class="settings-section-heading">${headingHtml}</span>`
      +   `</span>`
      +   `<span class="settings-section-chevron">${expanded ? chevronUpSvg() : chevronDownSvg()}</span>`
      + `</button>`
      + `<div class="settings-section-body${bodyClass ? ' ' + bodyClass : ''}" style="${expanded ? '' : 'display:none;'}">${bodyHtml}</div>`
      + `</div>`;
  }

  // Each heading is prefixed with the icon of the tab it relates to: Pocket
  // money -> Wallet, Habit editor -> Habits. Activity log and Security have
  // no matching tab, so they borrow the Settings gear and the lock icon
  // already used for the locked state elsewhere in the app.
  function renderSettingsSections(){
    const personId = state.settingsFilterId;
    const activityName = personId ? ROSTER.find((r) => r.id === personId).name : 'Everyone';
    let html = '';
    if (personId) {
      const p = ROSTER.find((r) => r.id === personId);
      html += renderSettingsSection('pocket', piggyBankSvg(16), `${escapeHtml(p.name)}&rsquo;s weekly pocket money`, renderPocketEditorBody(personId));
      html += renderSettingsSection('habits', circleCheckSvg(16), `Editing ${escapeHtml(p.name)}&rsquo;s habits`, renderHabitEditorBody(personId));
    }
    html += renderSettingsSection('activity', settingsSvg(16), `${escapeHtml(activityName)}&rsquo;s recent activity`, renderActivityLog(), 'activity-list');
    html += renderSettingsSection('security', lockSvg(16), 'Security', renderSecuritySectionBody());
    html += renderSettingsSection('backup', downloadSvg(16), 'Backup', renderBackupSectionBody());
    return html;
  }

  // The mobile top bar (header + switcher) is fixed, so page content needs
  // padding-top matching its real rendered height — measured rather than
  // guessed, since it varies with font metrics and the safe-area inset.
  function syncTopBarHeight(){
    if (!window.matchMedia('(max-width:767px)').matches) return;
    const h = document.getElementById('topBar').offsetHeight;
    document.documentElement.style.setProperty('--mobile-top-h', h + 'px');
  }

  function render(){
    document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
    document.getElementById('appVersionLabel').textContent = `v${APP_VERSION}`;
    document.getElementById('topSyncDot').className = `sync-dot ${cloudSyncStatusInfo().dot}`;
    document.getElementById('switcher').innerHTML = renderSwitcher();
    document.getElementById('cards').innerHTML = ROSTER.map((p) => renderCard(p)).join('');
    document.getElementById('pageStats').innerHTML = renderPageStats();
    document.getElementById('walletSection').innerHTML = renderWalletStrip();
    document.getElementById('rewardList').innerHTML = REWARDS.map((r) => renderRewardRow(r)).join('');
    document.getElementById('piggyStats').innerHTML = renderPiggyStats();
    document.getElementById('piggySection').innerHTML = renderPiggySection();
    document.getElementById('lbList').innerHTML = renderLeaderboard();
    const settingsLocked = !!state.settingsPin && !settingsUnlocked;
    document.getElementById('settingsGateSection').innerHTML = settingsLocked ? renderSettingsGate() : '';
    document.getElementById('settingsContent').style.display = settingsLocked ? 'none' : '';
    if (!settingsLocked) {
      document.getElementById('settingsSections').innerHTML = renderSettingsSections();
    }
    document.getElementById('tabHabits').innerHTML = circleCheckSvg(18) + '<span>Habits</span>';
    document.getElementById('tabRewards').innerHTML = giftSvg(18) + '<span>Rewards</span>';
    document.getElementById('tabWallet').innerHTML = piggyBankSvg(18) + '<span>Wallet</span>';
    document.getElementById('tabLeaderboard').innerHTML = trophySvg(18) + '<span>Ranking</span>';
    const backupStale = !settingsLocked && backupIsStale();
    const settingsIcon = (settingsLocked || backupStale)
      ? `<span class="tab-icon-wrap">${settingsSvg(18)}`
        + (settingsLocked ? `<span class="tab-lock-badge">${lockSvg(9)}</span>` : '')
        + (backupStale ? `<span class="tab-backup-badge"></span>` : '')
        + `</span>`
      : settingsSvg(18);
    document.getElementById('tabSettings').innerHTML = settingsIcon + '<span>Settings</span>';
    syncTopBarHeight();
  }

  document.addEventListener('click', (e) => {
    const habitRow = e.target.closest('.habit-row');
    if (habitRow) { toggleHabit(habitRow.dataset.person, habitRow.dataset.habit); return; }
    const calCell = e.target.closest('.cal-cell.clickable');
    if (calCell) {
      const pid = calCell.dataset.person, dk = calCell.dataset.date;
      expandedCalendarDay[pid] = expandedCalendarDay[pid] === dk ? null : dk;
      render();
      return;
    }
    const calClose = e.target.closest('.cal-day-panel-close');
    if (calClose) { expandedCalendarDay[calClose.dataset.person] = null; render(); return; }
    const calDayRow = e.target.closest('.cal-day-row');
    if (calDayRow) {
      const { person, date, habit } = calDayRow.dataset;
      const log = state.people[person].habitDayLog[date];
      const current = log ? !!log[habit] : false;
      setHabitDoneOnDay(person, habit, date, !current);
      saveState();
      render();
      return;
    }
    const pill = e.target.closest('.switcher-pill');
    if (pill) {
      if (state.currentPage === 'pageSettings') toggleSettingsFilter(pill.dataset.person);
      else selectPerson(pill.dataset.person);
      return;
    }
    const redeemBtn = e.target.closest('.reward-row-btn');
    if (redeemBtn && !redeemBtn.disabled) { redeemReward(redeemBtn.dataset.reward); return; }
    const useBtn = e.target.closest('.wallet-use-btn');
    if (useBtn) { useReward(useBtn.dataset.reward); return; }
    const withdrawBtn = e.target.closest('#withdrawBtn');
    if (withdrawBtn && !withdrawBtn.disabled) {
      const amountEl = document.getElementById('withdrawAmount');
      const noteEl = document.getElementById('withdrawNote');
      drawDownPiggy(parseFloat(amountEl.value), noteEl.value);
      return;
    }
    const walletWithdrawTrigger = e.target.closest('#walletWithdrawTrigger');
    if (walletWithdrawTrigger && !walletWithdrawTrigger.disabled) { openWalletAction('withdraw'); return; }
    const walletAddTrigger = e.target.closest('#walletAddTrigger');
    if (walletAddTrigger) { openWalletAction('add'); return; }
    const walletFormClose = e.target.closest('.wallet-form-close');
    if (walletFormClose) { closeWalletAction(); return; }
    const walletPinBtn = e.target.closest('#walletPinBtn');
    if (walletPinBtn) { submitWalletPin(); return; }
    const addMoneyBtn = e.target.closest('#addMoneyBtn');
    if (addMoneyBtn) {
      const amountEl = document.getElementById('addMoneyAmount');
      const noteEl = document.getElementById('addMoneyNote');
      addMoneyToPiggy(parseFloat(amountEl.value), noteEl.value);
      return;
    }
    const ledgerToggleBtn = e.target.closest('.ledger-toggle-btn');
    if (ledgerToggleBtn) {
      const pid = ledgerToggleBtn.dataset.person;
      ledgerExpanded[pid] = !ledgerExpanded[pid];
      render();
      return;
    }
    const activityToggleBtn = e.target.closest('.activity-toggle-btn');
    if (activityToggleBtn) {
      activityExpanded = !activityExpanded;
      render();
      return;
    }
    const settingsSectionToggle = e.target.closest('.settings-section-toggle');
    if (settingsSectionToggle) {
      const key = settingsSectionToggle.dataset.section;
      settingsSectionOpen[key] = !settingsSectionOpen[key];
      render();
      return;
    }
    const moveBtn = e.target.closest('.habit-move-btn');
    if (moveBtn && !moveBtn.disabled) { moveHabitDef(moveBtn.dataset.habit, parseInt(moveBtn.dataset.dir, 10)); return; }
    const habitEditBtn = e.target.closest('.habit-edit-btn');
    if (habitEditBtn) { startHabitEdit(habitEditBtn.dataset.habit); return; }
    const habitDeleteBtn = e.target.closest('.habit-delete-btn');
    if (habitDeleteBtn) { deleteHabitDef(habitDeleteBtn.dataset.habit); return; }
    const habitAddBtn = e.target.closest('#habitAddBtn');
    if (habitAddBtn) { startHabitAdd(); return; }
    const habitFreqBtn = e.target.closest('.habit-freq-btn');
    if (habitFreqBtn) { setHabitDraftFreq(habitFreqBtn.dataset.freq); return; }
    const habitStepBtn = e.target.closest('.habit-step-btn');
    if (habitStepBtn) { stepHabitDraft(habitStepBtn.dataset.field, parseInt(habitStepBtn.dataset.delta, 10)); return; }
    const habitCancelBtn = e.target.closest('#habitCancelBtn');
    if (habitCancelBtn) { cancelHabitEdit(); return; }
    const habitSaveBtn = e.target.closest('#habitSaveBtn');
    if (habitSaveBtn) { saveHabitEdit(); return; }
    const tabBtn = e.target.closest('.tab-btn');
    if (tabBtn) { switchTab(tabBtn.dataset.page); return; }
    const appMeta = e.target.closest('#appMeta');
    if (appMeta) {
      switchTab('pageSettings');
      settingsSectionOpen.backup = true;
      render();
      return;
    }
    const pocketSaveBtn = e.target.closest('#pocketWeeklySaveBtn');
    if (pocketSaveBtn) { setPocketWeekly(); return; }
    const pinUnlockBtn = e.target.closest('#pinUnlockBtn');
    if (pinUnlockBtn) { submitSettingsPin(); return; }
    const pinSetBtn = e.target.closest('#pinSetBtn');
    if (pinSetBtn) { setSettingsPin(); return; }
    const pinRemoveBtn = e.target.closest('#pinRemoveBtn');
    if (pinRemoveBtn) { removeSettingsPin(); return; }
    const exportBackupBtn = e.target.closest('#exportBackupBtn');
    if (exportBackupBtn) { exportBackup(); return; }
    const importBackupBtn = e.target.closest('#importBackupBtn');
    if (importBackupBtn) { document.getElementById('importFileInput').click(); return; }
    const resetDataBtn = e.target.closest('#resetDataBtn');
    if (resetDataBtn) { resetAllData(); return; }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (e.target.id === 'pinInput') { submitSettingsPin(); }
    else if (e.target.id === 'pinNewInput') { setSettingsPin(); }
    else if (e.target.id === 'walletPinInput') { submitWalletPin(); }
  });

  document.addEventListener('change', (e) => {
    if (e.target.id === 'importFileInput' && e.target.files && e.target.files[0]) {
      importBackupFile(e.target.files[0]);
      e.target.value = '';
    }
  });

  // Kept separate from the click handler and deliberately does NOT call
  // render(): re-rendering on every keystroke would rebuild the input and
  // drop focus/cursor position mid-type.
  document.addEventListener('input', (e) => {
    if (e.target.id === 'habitNameInput' && habitDraft) {
      habitDraft = { ...habitDraft, name: e.target.value };
    }
  });

  let touchStartX = null;
  const cardsEl = document.getElementById('cards');
  cardsEl.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, { passive:true });
  cardsEl.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    touchStartX = null;
    if (Math.abs(dx) < 50) return;
    const idx = ROSTER.findIndex((p) => p.id === state.selectedId);
    const nextIdx = dx < 0 ? (idx + 1) % ROSTER.length : (idx - 1 + ROSTER.length) % ROSTER.length;
    selectPerson(ROSTER[nextIdx].id);
  }, { passive:true });

  // The page shell's HTML hardcodes Habits as the active tab; put the DOM
  // in sync with whatever tab this device was actually last on before
  // rendering, so a reload lands back where you left it.
  syncPageDom(state.currentPage);
  rolloverIfNeeded();
  render();
  // Renders instantly from this device's local copy first (above), then
  // upgrades to live cross-device sync in the background if configured —
  // never blocks the first paint on a network round trip.
  initSupabaseSync();

  window.addEventListener('resize', syncTopBarHeight);

  // Catch a midnight/Monday rollover if the page is left open across it.
  setInterval(() => { rolloverIfNeeded(); render(); }, 5 * 60 * 1000);
})();
</script>
</body>
</html>
