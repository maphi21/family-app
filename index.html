<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family HQ">
<meta name="theme-color" content="#ffc93c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffc93c'/%3E%3Cpath d='M32 14 L52 32 h-6 v18 H18 V32 h-6 Z' fill='%2322262b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Family HQ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');

  :root{
    --paper:#fffdf8;
    --ink:#22262b;
    --ink-secondary:#6b7280;
    --ink-faint:#a8afb8;
    --surface-card:#ffffff;
    --surface-sunken:#fef5e2;
    --track:#eef0f3;
    --shadow-card:0 2px 8px rgba(34,38,43,0.06), 0 8px 24px rgba(34,38,43,0.06);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ -webkit-touch-callout:none; }
  body{
    margin:0; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background:var(--paper); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;
    padding-bottom:88px; /* clears the fixed bottom tab bar */
  }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 20px 48px; }
  .page{ display:none; }
  .page.active{ display:block; }

  .top-bar{ max-width:1180px; margin:0 auto; padding:24px 20px 0; }
  header.top{ display:flex; flex-direction:column; gap:2px; margin-bottom:16px; }
  .eyebrow{ font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); }
  .today{ font-size:16px; font-weight:600; color:var(--ink-secondary); }

  .switcher{ display:none; gap:14px; overflow-x:auto; padding:10px 6px 14px; }
  .switcher-pill{ display:flex; flex-direction:column; align-items:center; gap:6px; flex-shrink:0; cursor:pointer; }
  .switcher-avatar{
    width:50px; height:50px; border-radius:999px; color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px;
    transition:all .15s;
  }
  .switcher-avatar.is-active{ width:60px; height:60px; font-size:22px; box-shadow:0 0 0 3px var(--paper), 0 0 0 6px var(--ring-color); }
  .switcher-label{ font-size:11px; font-weight:700; color:var(--ink-faint); }
  .switcher-label.is-active{ color:var(--ink); }

  .cards{ display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:18px; }
  .card{
    display:flex; flex-direction:column; gap:14px;
    background:var(--surface-card); border-radius:20px; padding:20px; box-shadow:var(--shadow-card);
  }

  .card-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .card-header-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .avatar{
    width:44px; height:44px; border-radius:999px; color:#fff; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px;
  }
  .person-name{ font-size:14.5px; font-weight:800; letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .person-role{ font-size:11px; font-weight:600; color:var(--ink-faint); }
  .card-header-right{ display:flex; flex-direction:column; align-items:flex-end; gap:2px; flex-shrink:0; }
  .rank-badge{
    display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:20px;
    padding:0 7px; border-radius:999px; font-size:11px; font-weight:800;
  }
  .points-stat{ font-size:9.5px; font-weight:600; color:var(--ink-faint); white-space:nowrap; }
  .points-stat b{ color:var(--ink-secondary); font-weight:800; }

  .bday-chip, .level-badge, .piggy-chip{
    display:inline-flex; align-items:center; gap:5px; align-self:flex-start;
    border-radius:999px; padding:4px 10px 4px 7px; font-size:10.5px; font-weight:700;
    max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .bday-chip svg, .level-badge svg, .piggy-chip svg{ flex-shrink:0; }
  .piggy-chip{ background:#eaf9ef; color:#1f7643; }

  .level-block{ display:flex; flex-direction:column; gap:5px; }
  .level-bar-row{ display:flex; align-items:center; gap:8px; }
  .level-track{ flex:1; height:6px; background:var(--track); border-radius:999px; overflow:hidden; }
  .level-fill{ height:100%; border-radius:999px; transition:width .3s ease; }
  .level-caption{ font-size:9px; font-weight:700; color:var(--ink-faint); flex-shrink:0; white-space:nowrap; }

  .ring-holder{ display:flex; justify-content:center; }
  .ring-wrap{ position:relative; width:92px; height:92px; }
  .ring-outer{ width:100%; height:100%; border-radius:999px; transform:rotate(-90deg); }
  .ring-inner{
    position:absolute; inset:8px; border-radius:999px; background:var(--surface-card);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .ring-value{ font-size:17px; font-weight:800; line-height:1; }
  .ring-label{ font-size:8px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); margin-top:2px; }

  .habit-list{ display:flex; flex-direction:column; gap:6px; }
  .habit-row{ display:flex; align-items:center; gap:8px; background:var(--surface-sunken); border-radius:11px; padding:7px 9px; cursor:pointer; }
  .habit-indicator{
    width:18px; height:18px; border-radius:6px; flex-shrink:0; border:2px solid transparent;
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .habit-indicator--weekly{ width:auto; min-width:18px; padding:0 5px; font-size:9px; font-weight:800; }
  .habit-name{ flex:1; min-width:0; font-size:11.5px; font-weight:600; line-height:1.3; }
  .habit-streak{ display:inline-flex; align-items:center; gap:2px; flex-shrink:0; font-size:9.5px; font-weight:700; color:#a67800; }

  .page-sub{ font-size:13.5px; color:var(--ink-secondary); margin:0 0 18px; }

  .page-stats{ margin-bottom:18px; }
  .pts-available{ font-size:14px; font-weight:700; color:var(--ink); }
  .pts-available b{ font-weight:800; }
  .piggy-saved{ font-size:12.5px; font-weight:700; color:#1f7643; margin-top:2px; }

  .wallet-strip{ display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
  .wallet-label{ font-size:11.5px; font-weight:700; color:var(--ink-secondary); text-transform:uppercase; letter-spacing:0.04em; }
  .wallet-list{ display:flex; flex-direction:column; gap:8px; }
  .wallet-chip{
    display:flex; align-items:center; gap:10px;
    background:#eaf9ef; border-radius:999px; padding:8px 8px 8px 16px;
  }
  .wallet-chip-name{ flex:1; min-width:0; font-size:13px; font-weight:700; color:#1f7643; }
  .wallet-use-btn{
    flex-shrink:0; font-family:inherit; font-size:12px; font-weight:800; color:#fff;
    background:#2a9c58; border:none; border-radius:999px; padding:8px 14px; cursor:pointer;
    transition:transform .12s ease;
  }
  .wallet-use-btn:active{ transform:scale(.96); }

  .reward-list{ display:flex; flex-direction:column; gap:8px; }
  .reward-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface-sunken); border-radius:14px; padding:12px 14px;
  }
  .reward-row-info{ display:flex; flex-direction:column; gap:5px; min-width:0; }
  .reward-row-name{ font-size:14px; font-weight:700; }
  .reward-row-costs{ display:flex; gap:6px; flex-wrap:wrap; }
  .reward-cost{
    display:inline-flex; align-items:center; gap:5px; background:var(--surface-card); color:#a67800;
    border-radius:999px; padding:4px 11px 4px 8px; font-size:12px; font-weight:700;
  }
  .reward-cash{
    display:inline-flex; align-items:center; gap:5px; background:#eaf9ef; color:#1f7643;
    border-radius:999px; padding:4px 11px 4px 8px; font-size:12px; font-weight:700;
  }

  .reward-row-btn{
    flex-shrink:0; font-family:inherit; font-size:12.5px; font-weight:700; color:var(--ink);
    background:#ffc93c; border:none; border-radius:999px; padding:10px 16px; cursor:pointer;
    transition:transform .12s ease;
  }
  .reward-row-btn:active{ transform:scale(.96); }
  .reward-row-btn:disabled{ opacity:.4; cursor:not-allowed; }

  .lb-list{ display:flex; flex-direction:column; gap:10px; }
  .lb-row{
    display:flex; align-items:center; gap:14px;
    background:var(--surface-card); border-radius:16px; padding:14px 16px; box-shadow:var(--shadow-card);
  }
  .lb-rank{
    width:28px; height:28px; border-radius:999px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800; background:var(--track); color:var(--ink-secondary);
  }
  .lb-rank.first{ background:#ffc93c; color:#22262b; }
  .lb-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .lb-info .level-badge{ white-space:normal; line-height:1.3; align-items:flex-start; }
  .lb-info .level-badge svg{ margin-top:2px; }
  .lb-name-row{ display:flex; align-items:baseline; gap:7px; }
  .lb-name{ font-size:14.5px; font-weight:800; letter-spacing:-0.01em; }
  .lb-level-num{ font-size:11px; font-weight:700; color:var(--ink-faint); }
  .lb-bar-track{ height:7px; background:var(--track); border-radius:999px; overflow:hidden; }
  .lb-bar-fill{ height:100%; border-radius:999px; transition:width .3s ease; }
  .lb-points{ display:flex; flex-direction:column; align-items:flex-end; gap:1px; flex-shrink:0; }
  .lb-total{ font-size:16px; font-weight:800; color:var(--ink); white-space:nowrap; }
  .lb-now{ font-size:10.5px; font-weight:600; color:var(--ink-faint); white-space:nowrap; }

  .tab-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:65; display:flex;
    background:#ffffff; border-top:1px solid var(--track); box-shadow:0 -2px 12px rgba(34,38,43,.06);
    padding:6px max(16px, env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));
  }
  .tab-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; padding:8px 4px; cursor:pointer;
    color:var(--ink-faint); font-family:inherit; font-size:11px; font-weight:700;
  }
  .tab-btn.active{ color:var(--ink); }

  .toast{
    position:fixed; bottom:76px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:12px 18px; border-radius:999px;
    font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; z-index:120;
    transition:opacity .2s ease, transform .2s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 6px 20px rgba(34,38,43,.18); max-width:calc(100% - 40px); text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.success{ background:#2a9c58; }
  .toast.danger{ background:#e84e3d; }

  footer.note{ max-width:1180px; margin:32px auto 0; padding:0 20px; font-size:11.5px; color:var(--ink-faint); text-align:center; }

  @media (max-width:767px){
    .top-bar{
      position:fixed; top:0; left:0; right:0; z-index:60;
      background:var(--paper); padding:calc(14px + env(safe-area-inset-top)) 20px 0;
      box-shadow:0 2px 10px rgba(34,38,43,.05);
    }
    .wrap{ padding-top:var(--mobile-top-h, 178px); }

    .switcher{ display:flex; }

    .cards{ display:block; }
    .card{ display:none; }
    .card.is-selected{ display:flex; }

    .avatar{ width:56px; height:56px; font-size:20px; }
    .person-name{ font-size:20px; }
    .person-role{ font-size:13px; }
    .bday-chip, .level-badge, .piggy-chip{ font-size:12.5px; padding:6px 14px 6px 10px; }
    .lb-info .level-badge{ font-size:10.5px; padding:4px 10px 4px 7px; }
    .ring-wrap{ width:150px; height:150px; margin:0 auto; }
    .ring-inner{ inset:12px; }
    .ring-value{ font-size:28px; }
    .ring-label{ font-size:10px; }
    .habit-row{ padding:13px 16px; border-radius:14px; }
    .habit-indicator{ width:24px; height:24px; }
    .habit-indicator--weekly{ min-width:24px; font-size:11px; }
    .habit-name{ font-size:15px; }
    .habit-streak{ font-size:12px; }

    .reward-row-btn{ padding-top:11px; padding-bottom:11px; }
  }
</style>
</head>
<body>

<div class="top-bar" id="topBar">
  <header class="top">
    <div class="eyebrow">Phipps House</div>
    <div class="today" id="todayLabel">&nbsp;</div>
  </header>
  <div class="switcher" id="switcher"></div>
</div>

<div class="wrap">
  <div class="page active" id="pageHabits">
    <div class="cards" id="cards"></div>
  </div>

  <div class="page" id="pageRewards">
    <p class="page-sub">Spend hard-earned points on real rewards.</p>
    <div id="pageStats"></div>
    <div id="walletSection"></div>
    <div class="reward-list" id="rewardList"></div>
  </div>

  <div class="page" id="pageLeaderboard">
    <p class="page-sub">Ranked by total points ever earned.</p>
    <div class="lb-list" id="lbList"></div>
  </div>
</div>

<footer class="note">Saved on this device only &mdash; each phone or iPad keeps its own copy. Add to your Home Screen for one-tap access.</footer>

<nav class="tab-bar" id="tabBar">
  <button class="tab-btn active" data-page="pageHabits" id="tabHabits"></button>
  <button class="tab-btn" data-page="pageRewards" id="tabRewards"></button>
  <button class="tab-btn" data-page="pageLeaderboard" id="tabLeaderboard"></button>
</nav>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  const STORAGE_KEY = 'familyHQ_profile_v1';
  const HABIT_POINTS = 10;
  const BIRTHDAY_BONUS = 100;
  const SHOW_BDAY_WITHIN_DAYS = 60;
  const LEVEL_BASE_PTS = 150;
  const LEVEL_GROWTH = 1.25;
  const LEVEL_TITLES = ['Sock drawer sergeant', 'Duty deputy', 'Chore cadet', 'Tidy titan', 'Household hero', 'Domestic dynamo', 'Grand vizier of vacuuming'];

  // pocketWeekly: £ target per week, scaled by that week's daily-habit
  // completion ratio (see weeklyRatioSoFar / rolloverIfNeeded). 0 = no allowance.
  const ROSTER = [
    { id:'matt', name:'Matt', role:'Parent', initial:'M', color:'#2fa9e5', birthday:{ month:3, day:21 }, pocketWeekly:0,
      habits:[
        { id:'vitamins', name:'Take vitamins', freq:'daily' },
        { id:'exercise', name:'Exercise 20 min', freq:'weekly', target:3 },
        { id:'winddown', name:'Screen-free wind down', freq:'daily' },
      ] },
    { id:'jemma', name:'Jemma', role:'Parent', initial:'J', color:'#9b6bf0', birthday:{ month:8, day:13 }, pocketWeekly:0,
      habits:[
        { id:'vitamins', name:'Take vitamins', freq:'daily' },
        { id:'exercise', name:'Exercise 20 min', freq:'weekly', target:3 },
        { id:'tidy', name:'Tidy your space', freq:'daily' },
      ] },
    { id:'henry', name:'Henry', role:'Kid', initial:'H', color:'#3dbe72', birthday:{ month:9, day:19 }, pocketWeekly:5,
      habits:[
        { id:'vitamins', name:'Take vitamins', freq:'daily' },
        { id:'brush', name:'Brush teeth', freq:'daily' },
        { id:'read', name:'Read 20 minutes', freq:'daily' },
        { id:'room', name:'Tidy your room', freq:'daily' },
      ] },
    { id:'ted', name:'Ted', role:'Kid', initial:'T', color:'#ff6b5b', birthday:{ month:3, day:2 }, pocketWeekly:5,
      habits:[
        { id:'vitamins', name:'Take vitamins', freq:'daily' },
        { id:'brush', name:'Brush teeth', freq:'daily' },
        { id:'read', name:'Read 20 minutes', freq:'daily' },
      ] },
    { id:'lorraine', name:'Lorraine', role:'Grandma', initial:'L', color:'#ffc93c', birthday:{ month:6, day:28 }, pocketWeekly:0,
      habits:[
        { id:'walk', name:'Afternoon walk', freq:'weekly', target:5 },
        { id:'call', name:'Call a grandchild', freq:'weekly', target:1 },
        { id:'puzzle', name:'Puzzle or crossword', freq:'daily' },
      ] },
  ];

  function pad2(n){ return n < 10 ? '0' + n : '' + n; }
  function dateKey(d){ return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
  function mondayKey(d){
    const dow = (d.getDay() + 6) % 7;
    const m = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow);
    return dateKey(m);
  }
  function addDaysKey(k, n){
    const [y, m, d] = k.split('-').map(Number);
    return dateKey(new Date(y, m - 1, d + n));
  }
  function roundMoney(n){ return Math.round(n * 100) / 100; }

  function defaultPersonState(){
    const today = new Date();
    return {
      bankedPoints: 0, // spendable currency — goes down when a reward is redeemed
      totalBanked: 0,  // lifetime points ever earned — never decreases; drives level + rank
      piggyReward: 0, // real money earned by redeeming a cash reward
      piggyPocket: 0, // real money earned via the weekly habit-ratio allowance
      dailyRatioHistory: {}, // dateKey -> that day's daily-habit completion ratio (0..1)
      rewardInventory: {}, // rewardId -> how many bought-but-not-yet-used are owned
      lastResetDate: dateKey(today),
      weekAnchor: mondayKey(today),
      bdayAwardedYear: null,
      habits: [],
    };
  }

  // A reward without `cash` is a privilege (points only); one with `cash`
  // also pays that amount into the redeemer's piggyReward balance.
  const REWARDS = [
    { id:'r_dinner', name:'Choose Friday dinner', cost:50 },
    { id:'r_screen30', name:'Extra 30 min screen time', cost:30 },
    { id:'r_late15', name:'Stay up 15 min late', cost:25 },
    { id:'r_movie', name:'Pick the family movie', cost:40 },
    { id:'r_chorepass', name:'Skip one chore (free pass)', cost:60 },
    { id:'r_cash5', name:'£5 pocket money', cost:120, cash:5 },
  ];

  function habitDefOf(personId, habitId){
    const p = ROSTER.find((r) => r.id === personId);
    return p.habits.find((h) => h.id === habitId);
  }
  function habitStateOf(personId, habitId){
    return state.people[personId].habits.find((h) => h.id === habitId);
  }

  function loadState(){
    let saved = null;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) saved = JSON.parse(raw);
    } catch (e) { /* localStorage unavailable — fall through to fresh state */ }

    const s = { people:{}, selectedId:null };
    ROSTER.forEach((p) => {
      s.people[p.id] = (saved && saved.people && saved.people[p.id]) || defaultPersonState();
      if (typeof s.people[p.id].piggyReward !== 'number') s.people[p.id].piggyReward = 0;
      if (typeof s.people[p.id].piggyPocket !== 'number') s.people[p.id].piggyPocket = 0;
      if (typeof s.people[p.id].totalBanked !== 'number') s.people[p.id].totalBanked = s.people[p.id].bankedPoints;
      if (!s.people[p.id].rewardInventory || typeof s.people[p.id].rewardInventory !== 'object') s.people[p.id].rewardInventory = {};
      if (!s.people[p.id].dailyRatioHistory || typeof s.people[p.id].dailyRatioHistory !== 'object') s.people[p.id].dailyRatioHistory = {};
      p.habits.forEach((h) => {
        if (!s.people[p.id].habits.find((x) => x.id === h.id)) {
          s.people[p.id].habits.push({ id:h.id, done:false, count:0, streak:0 });
        }
      });
    });
    s.selectedId = (saved && saved.selectedId && ROSTER.some((p) => p.id === saved.selectedId))
      ? saved.selectedId
      : ROSTER[0].id;
    return s;
  }

  function saveState(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  let state = loadState();

  function nextBirthdayInfo(month, day, today){
    const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    let target = new Date(todayMid.getFullYear(), month - 1, day);
    if (target < todayMid) target = new Date(todayMid.getFullYear() + 1, month - 1, day);
    const diffDays = Math.round((target - todayMid) / 86400000);
    if (diffDays === 0) return { today:true, diffDays:0 };
    if (diffDays < 30) return { today:false, mode:'days', diffDays };
    let months = (target.getFullYear() - todayMid.getFullYear()) * 12 + (target.getMonth() - todayMid.getMonth());
    if (target.getDate() < todayMid.getDate()) months--;
    const afterMonths = new Date(todayMid.getFullYear(), todayMid.getMonth() + months, todayMid.getDate());
    const weeks = Math.floor(Math.round((target - afterMonths) / 86400000) / 7);
    return { today:false, mode:'months', months, weeks, diffDays };
  }

  function formatBirthday(info){
    if (info.today) return `Birthday today! +${BIRTHDAY_BONUS} pts`;
    if (info.mode === 'days') return `${info.diffDays} day${info.diffDays === 1 ? '' : 's'} to go`;
    const parts = [];
    if (info.months > 0) parts.push(`${info.months} month${info.months === 1 ? '' : 's'}`);
    if (info.weeks > 0) parts.push(`${info.weeks} week${info.weeks === 1 ? '' : 's'}`);
    return parts.join(', ');
  }

  function computeLevel(points){
    let lvl = 1, into = points, span = LEVEL_BASE_PTS;
    while (into >= span) { into -= span; lvl++; span = Math.round(span * LEVEL_GROWTH); }
    return { level:lvl, into, span };
  }

  function tint(hex, alpha){
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
  }

  function ringGradient(percent, color){
    if (percent <= 0) return '#eef0f3';
    if (percent >= 100) return color;
    return `conic-gradient(${color} 0% ${percent}%, #eef0f3 ${percent}% 100%)`;
  }

  // Whatever's checked off right now but hasn't rolled over into a banked
  // total yet — contributes equally to both the spendable and lifetime pools.
  function liveContribution(personId){
    const p = ROSTER.find((r) => r.id === personId);
    let live = 0;
    p.habits.forEach((h) => {
      const hs = habitStateOf(personId, h.id);
      if (h.freq === 'daily') { if (hs.done) live += HABIT_POINTS; }
      else { live += hs.count * HABIT_POINTS; }
    });
    return live;
  }

  // Spendable currency: goes up when habits are ticked, down when a reward
  // is redeemed. This is what "can they afford it" checks against.
  function computeSpendablePoints(personId){
    return state.people[personId].bankedPoints + liveContribution(personId);
  }

  // Lifetime total: never decreases, even when points are spent. Drives
  // level/rank so redeeming a reward doesn't undo someone's progress.
  function computeTotalPoints(personId){
    return state.people[personId].totalBanked + liveContribution(personId);
  }

  // Credits an amount to both pools at once — the only way points are earned,
  // so the two totals can never drift apart.
  function awardPoints(ps, amount){
    ps.bankedPoints += amount;
    ps.totalBanked += amount;
  }

  // Weekly pocket money, adapted from the original prototype: each day
  // contributes at most 1/7th of the week's allowance, so it builds up
  // gradually rather than all-or-nothing. Only daily habits count toward the
  // ratio — a weekly-target habit isn't a "today" concept, so it earns its
  // own points but doesn't feed this. Past days come from the archived
  // history; today is read live so the estimate updates as habits are ticked;
  // future days in the week simply haven't contributed yet.
  function weeklyRatioSoFar(personId){
    const ps = state.people[personId];
    const p = ROSTER.find((r) => r.id === personId);
    const dailyDefs = p.habits.filter((h) => h.freq === 'daily');
    const todayKeyStr = dateKey(new Date());
    let sum = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDaysKey(ps.weekAnchor, i);
      if (d === todayKeyStr) {
        sum += dailyDefs.length ? dailyDefs.filter((h) => habitStateOf(personId, h.id).done).length / dailyDefs.length : 0;
      } else if (d < todayKeyStr) {
        sum += ps.dailyRatioHistory[d] || 0;
      }
    }
    return sum / 7;
  }

  // Live "building" estimate for the week in progress — shown on the profile
  // card. Not yet banked; only paid into piggyPocket at the week's rollover.
  function weeklyEstimate(personId){
    const p = ROSTER.find((r) => r.id === personId);
    return roundMoney(p.pocketWeekly * weeklyRatioSoFar(personId));
  }

  // Combined real-money balance: the weekly ratio-based allowance plus
  // whatever's been separately cashed out by redeeming a points reward.
  function piggyTotal(personId){
    const ps = state.people[personId];
    return roundMoney(ps.piggyPocket + ps.piggyReward);
  }

  // Rolls yesterday's daily ticks and last week's weekly counts into banked
  // points + streaks, then clears them for the new day/week. Also awards the
  // once-a-year birthday bonus. Runs on load and again at local midnight.
  function rolloverIfNeeded(){
    const today = new Date();
    const todayKey = dateKey(today);
    const thisMonday = mondayKey(today);
    let changed = false;

    ROSTER.forEach((p) => {
      const ps = state.people[p.id];

      if (ps.lastResetDate !== todayKey) {
        const dailyDefs = p.habits.filter((h) => h.freq === 'daily');
        if (dailyDefs.length) {
          const doneCount = dailyDefs.filter((h) => habitStateOf(p.id, h.id).done).length;
          ps.dailyRatioHistory[ps.lastResetDate] = doneCount / dailyDefs.length;
        }
        dailyDefs.forEach((h) => {
          const hs = habitStateOf(p.id, h.id);
          if (hs.done) { awardPoints(ps, HABIT_POINTS); hs.streak += 1; }
          else { hs.streak = 0; }
          hs.done = false;
        });
        // Keep ~9 weeks of ratio history — plenty for the payout calc below,
        // bounded so it doesn't grow forever.
        const cutoff = addDaysKey(todayKey, -63);
        Object.keys(ps.dailyRatioHistory).forEach((k) => { if (k < cutoff) delete ps.dailyRatioHistory[k]; });
        ps.lastResetDate = todayKey;
        changed = true;
      }

      if (ps.weekAnchor !== thisMonday) {
        p.habits.filter((h) => h.freq === 'weekly').forEach((h) => {
          const hs = habitStateOf(p.id, h.id);
          awardPoints(ps, hs.count * HABIT_POINTS);
          hs.streak = hs.count >= h.target ? hs.streak + 1 : 0;
          hs.count = 0;
        });
        if (p.pocketWeekly > 0) {
          let sum = 0;
          for (let i = 0; i < 7; i++) sum += ps.dailyRatioHistory[addDaysKey(ps.weekAnchor, i)] || 0;
          ps.piggyPocket = roundMoney(ps.piggyPocket + roundMoney(p.pocketWeekly * (sum / 7)));
        }
        ps.weekAnchor = thisMonday;
        changed = true;
      }

      const bday = nextBirthdayInfo(p.birthday.month, p.birthday.day, today);
      if (bday.today) {
        const year = today.getFullYear();
        if (ps.bdayAwardedYear !== year) {
          awardPoints(ps, BIRTHDAY_BONUS);
          ps.bdayAwardedYear = year;
          changed = true;
        }
      }
    });

    if (changed) saveState();
  }

  function toggleHabit(personId, habitId){
    const def = habitDefOf(personId, habitId);
    const hs = habitStateOf(personId, habitId);
    if (def.freq === 'daily') hs.done = !hs.done;
    else hs.count = (hs.count + 1) % (def.target + 1);
    saveState();
    render();
  }

  function selectPerson(id){
    state.selectedId = id;
    saveState();
    render();
  }

  let toastTimer = null;
  function showToast(msg, tone){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (tone ? ' ' + tone : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.classList.remove('show'); }, 2200);
  }

  function redeemReward(rewardId){
    const personId = state.selectedId;
    const reward = REWARDS.find((r) => r.id === rewardId);
    const p = ROSTER.find((r) => r.id === personId);
    const points = computeSpendablePoints(personId);
    if (points < reward.cost) {
      showToast(`${p.name} needs ${reward.cost - points} more points for that.`, 'danger');
      return;
    }
    const ps = state.people[personId];
    ps.bankedPoints -= reward.cost;
    if (reward.cash) ps.piggyReward += reward.cash;
    ps.rewardInventory[rewardId] = (ps.rewardInventory[rewardId] || 0) + 1;
    saveState();
    render();
    showToast(`${reward.name} redeemed for ${p.name}!`, 'success');
  }

  // Redeeming buys a token with points; using it later is free and just
  // marks that one copy as claimed/cashed in — the two are separate actions
  // so "bought it" and "actually took the screen time" aren't conflated.
  function useReward(rewardId){
    const personId = state.selectedId;
    const reward = REWARDS.find((r) => r.id === rewardId);
    const p = ROSTER.find((r) => r.id === personId);
    const ps = state.people[personId];
    const owned = ps.rewardInventory[rewardId] || 0;
    if (owned <= 0) return;
    ps.rewardInventory[rewardId] = owned - 1;
    saveState();
    render();
    showToast(`${p.name} used ${reward.name}.`, 'success');
  }

  function switchTab(pageId){
    document.querySelectorAll('.page').forEach((el) => el.classList.toggle('active', el.id === pageId));
    document.querySelectorAll('.tab-btn').forEach((el) => el.classList.toggle('active', el.dataset.page === pageId));
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  function cakeSvg(){
    return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/>'
      + '<path d="M4 16s.5-1 2-1 2.5 1.5 4 1.5S12.5 15 14 15s2.5 1.5 4 1.5 2-1 2-1"/>'
      + '<path d="M2 21h20"/><path d="M7 8v3M12 8v3M17 8v3"/><path d="M7 4h.01M12 3h.01M17 4h.01"/></svg>';
  }
  function starSvg(){
    return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
  }
  function medalSvg(){
    return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.5 13.5 17 22l-5-3-5 3 1.5-8.5"/></svg>';
  }
  function checkSvg(){
    return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  }
  function flameSvg(){
    return '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 17a2.5 2.5 0 0 0 2.5-2.5c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7.5 7.5 0 1 1-15 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>';
  }
  function giftSvg(size){
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">`
      + '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/>'
      + '<path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/>'
      + '<path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8"/><path d="M16.5 8a2.5 2.5 0 0 0 0-5C13 3 12 8 12 8"/></svg>';
  }
  function circleCheckSvg(size){
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 12 2 2 4-4"/></svg>`;
  }
  function banknoteSvg(){
    return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/></svg>';
  }
  function piggyBankSvg(){
    return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="M19 5c-1.5 0-2.8 1.1-3 2.5-3.6-1.4-11-.2-11 5 0 1.7.2 2.9 2 4.2V20h4v-1.5h3V20h4v-4c1-.4 1.7-1 2-2h2v-4h-2c-.2-1-.6-1.7-1-2z"/>'
      + '<circle cx="16.5" cy="10.5" r=".6" fill="currentColor"/><path d="M2 10.5v1.2h2.3"/></svg>';
  }
  function trophySvg(size){
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">`
      + '<path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10"/><path d="M17 4v6a5 5 0 0 1-10 0V4"/>'
      + '<path d="M7 4H4.5a2.5 2.5 0 0 0 0 5H7"/><path d="M17 4h2.5a2.5 2.5 0 0 1 0 5H17"/></svg>';
  }

  function renderCard(p){
    const totalPoints = computeTotalPoints(p.id);
    const spendablePoints = computeSpendablePoints(p.id);
    const lv = computeLevel(totalPoints);
    const levelTitle = LEVEL_TITLES[Math.min(lv.level, LEVEL_TITLES.length) - 1];
    const ranked = [...ROSTER].sort((a, b) => computeTotalPoints(b.id) - computeTotalPoints(a.id));
    const rank = ranked.findIndex((r) => r.id === p.id) + 1;

    const dailyDefs = p.habits.filter((h) => h.freq === 'daily');
    const dailyDone = dailyDefs.filter((h) => habitStateOf(p.id, h.id).done).length;
    const dailyTotal = dailyDefs.length;
    const dailyPercent = dailyTotal ? Math.round((dailyDone / dailyTotal) * 100) : 0;

    const bday = nextBirthdayInfo(p.birthday.month, p.birthday.day, new Date());
    const showBday = bday.today || bday.diffDays <= SHOW_BDAY_WITHIN_DAYS;
    const bdayBg = bday.today ? '#ffc93c' : '#e9f6fe';
    const bdayColor = bday.today ? '#22262b' : '#146590';

    const rankBg = rank === 1 ? '#ffc93c' : '#eef0f3';
    const rankColor = rank === 1 ? '#22262b' : '#3d434b';
    const levelBg = tint(p.color, 0.14);
    const showPiggy = p.pocketWeekly > 0;
    const piggyEstimate = showPiggy ? weeklyEstimate(p.id) : 0;

    const habitsHtml = p.habits.map((h) => {
      const hs = habitStateOf(p.id, h.id);
      const isWeekly = h.freq === 'weekly';
      const filled = isWeekly ? hs.count >= h.target : hs.done;
      const indicator = isWeekly
        ? `<div class="habit-indicator habit-indicator--weekly" style="background:${filled ? p.color : '#eef0f3'};color:${filled ? '#ffffff' : '#3d434b'};">${hs.count}/${h.target}</div>`
        : `<div class="habit-indicator" style="background:${filled ? p.color : 'transparent'};border-color:${filled ? 'transparent' : '#a8afb8'};">${filled ? checkSvg() : ''}</div>`;
      return `<div class="habit-row" data-person="${p.id}" data-habit="${h.id}">`
        + indicator
        + `<div class="habit-name" style="text-decoration:${filled && !isWeekly ? 'line-through' : 'none'};opacity:${filled ? 0.6 : 1};">${escapeHtml(h.name)}</div>`
        + `<div class="habit-streak">${flameSvg()}${hs.streak}${isWeekly ? 'w' : 'd'}</div>`
        + `</div>`;
    }).join('');

    return `<div class="card ${p.id === state.selectedId ? 'is-selected' : ''}" data-person="${p.id}">`
      + `<div class="card-header">`
      +   `<div class="card-header-left">`
      +     `<div class="avatar" style="background:${p.color};">${p.initial}</div>`
      +     `<div><div class="person-name">${escapeHtml(p.name)}</div><div class="person-role">${escapeHtml(p.role)}</div></div>`
      +   `</div>`
      +   `<div class="card-header-right">`
      +     `<div class="rank-badge" style="background:${rankBg};color:${rankColor};">#${rank}</div>`
      +     `<div class="points-stat">Total <b>${totalPoints}</b></div>`
      +     `<div class="points-stat">Now <b>${spendablePoints}</b></div>`
      +   `</div>`
      + `</div>`
      + (showBday ? `<div class="bday-chip" style="background:${bdayBg};color:${bdayColor};">${cakeSvg()}${formatBirthday(bday)}</div>` : '')
      + (showPiggy ? `<div class="piggy-chip">${piggyBankSvg()}&pound;${piggyEstimate.toFixed(2)} this week</div>` : '')
      + `<div class="level-block">`
      +   `<div class="level-badge" style="background:${levelBg};color:${p.color};">${lv.level >= 3 ? medalSvg() : starSvg()}${escapeHtml(levelTitle)}</div>`
      +   `<div class="level-bar-row">`
      +     `<div class="level-track"><div class="level-fill" style="width:${Math.round((lv.into / lv.span) * 100)}%;background:${p.color};"></div></div>`
      +     `<div class="level-caption">${lv.into}/${lv.span}</div>`
      +   `</div>`
      + `</div>`
      + `<div class="ring-holder"><div class="ring-wrap">`
      +   `<div class="ring-outer" style="background:${ringGradient(dailyPercent, p.color)};"></div>`
      +   `<div class="ring-inner"><div class="ring-value">${dailyDone}/${dailyTotal}</div><div class="ring-label">today</div></div>`
      + `</div></div>`
      + `<div class="habit-list">${habitsHtml}</div>`
      + `</div>`;
  }

  function renderSwitcher(){
    return ROSTER.map((p) => {
      const active = p.id === state.selectedId;
      return `<div class="switcher-pill" data-person="${p.id}">`
        + `<div class="switcher-avatar ${active ? 'is-active' : ''}" style="background:${p.color};--ring-color:${p.color};">${p.initial}</div>`
        + `<div class="switcher-label ${active ? 'is-active' : ''}">${escapeHtml(p.name)}</div>`
        + `</div>`;
    }).join('');
  }

  function renderRewardRow(reward){
    const points = computeSpendablePoints(state.selectedId);
    const affordable = points >= reward.cost;
    return `<div class="reward-row">`
      + `<div class="reward-row-info">`
      +   `<div class="reward-row-name">${escapeHtml(reward.name)}</div>`
      +   `<div class="reward-row-costs">`
      +     `<div class="reward-cost">${starSvg()}${reward.cost} pts</div>`
      +     (reward.cash ? `<div class="reward-cash">${banknoteSvg()}+&pound;${reward.cash}</div>` : '')
      +   `</div>`
      + `</div>`
      + `<button class="reward-row-btn" data-reward="${reward.id}" ${affordable ? '' : 'disabled'}>Redeem</button>`
      + `</div>`;
  }

  // "How much can I spend right now" — points for the shop below, plus
  // real money saved (weekly allowance + any cashed-out rewards) if any.
  function renderPageStats(){
    const pts = computeSpendablePoints(state.selectedId);
    const saved = piggyTotal(state.selectedId);
    return `<div class="page-stats">`
      + `<div class="pts-available"><b>${pts}</b> pts to spend</div>`
      + (saved > 0 ? `<div class="piggy-saved">&pound;${saved.toFixed(2)} saved</div>` : '')
      + `</div>`;
  }

  // Only appears once the selected person owns at least one un-used reward —
  // buying (Redeem, in the shop below) and claiming (Use, here) are separate
  // actions, so this stays empty most of the time instead of showing dead
  // controls for everything that hasn't been bought yet.
  function renderWalletStrip(){
    const inventory = state.people[state.selectedId].rewardInventory;
    const owned = REWARDS.filter((r) => (inventory[r.id] || 0) > 0);
    if (!owned.length) return '';
    const chips = owned.map((r) => `<div class="wallet-chip">`
      + `<div class="wallet-chip-name">${escapeHtml(r.name)} &times;${inventory[r.id]}</div>`
      + `<button class="wallet-use-btn" data-reward="${r.id}">Use 1</button>`
      + `</div>`).join('');
    return `<div class="wallet-strip">`
      + `<div class="wallet-label">Ready to use</div>`
      + `<div class="wallet-list">${chips}</div>`
      + `</div>`;
  }

  function renderLeaderboard(){
    const ranked = [...ROSTER].sort((a, b) => computeTotalPoints(b.id) - computeTotalPoints(a.id));
    const maxTotal = Math.max(1, ...ranked.map((p) => computeTotalPoints(p.id)));
    return ranked.map((p, i) => {
      const total = computeTotalPoints(p.id);
      const now = computeSpendablePoints(p.id);
      const rank = i + 1;
      const barPct = Math.round((total / maxTotal) * 100);
      const lv = computeLevel(total);
      const levelTitle = LEVEL_TITLES[Math.min(lv.level, LEVEL_TITLES.length) - 1];
      const levelBg = tint(p.color, 0.14);
      return `<div class="lb-row">`
        + `<div class="lb-rank ${rank === 1 ? 'first' : ''}">#${rank}</div>`
        + `<div class="avatar" style="background:${p.color};">${p.initial}</div>`
        + `<div class="lb-info">`
        +   `<div class="lb-name-row">`
        +     `<div class="lb-name">${escapeHtml(p.name)}</div>`
        +     `<div class="lb-level-num">Lvl ${lv.level}</div>`
        +   `</div>`
        +   `<div class="level-badge" style="background:${levelBg};color:${p.color};">${lv.level >= 3 ? medalSvg() : starSvg()}${escapeHtml(levelTitle)}</div>`
        +   `<div class="lb-bar-track"><div class="lb-bar-fill" style="width:${barPct}%;background:${p.color};"></div></div>`
        + `</div>`
        + `<div class="lb-points">`
        +   `<div class="lb-total">${total}</div>`
        +   `<div class="lb-now">${now} now</div>`
        + `</div>`
        + `</div>`;
    }).join('');
  }

  // The mobile top bar (header + switcher) is fixed, so page content needs
  // padding-top matching its real rendered height — measured rather than
  // guessed, since it varies with font metrics and the safe-area inset.
  function syncTopBarHeight(){
    if (!window.matchMedia('(max-width:767px)').matches) return;
    const h = document.getElementById('topBar').offsetHeight;
    document.documentElement.style.setProperty('--mobile-top-h', h + 'px');
  }

  function render(){
    document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
    document.getElementById('switcher').innerHTML = renderSwitcher();
    document.getElementById('cards').innerHTML = ROSTER.map((p) => renderCard(p)).join('');
    document.getElementById('pageStats').innerHTML = renderPageStats();
    document.getElementById('walletSection').innerHTML = renderWalletStrip();
    document.getElementById('rewardList').innerHTML = REWARDS.map((r) => renderRewardRow(r)).join('');
    document.getElementById('lbList').innerHTML = renderLeaderboard();
    document.getElementById('tabHabits').innerHTML = circleCheckSvg(20) + '<span>Habits</span>';
    document.getElementById('tabRewards').innerHTML = giftSvg(20) + '<span>Rewards</span>';
    document.getElementById('tabLeaderboard').innerHTML = trophySvg(20) + '<span>Ranking</span>';
    syncTopBarHeight();
  }

  document.addEventListener('click', (e) => {
    const habitRow = e.target.closest('.habit-row');
    if (habitRow) { toggleHabit(habitRow.dataset.person, habitRow.dataset.habit); return; }
    const pill = e.target.closest('.switcher-pill');
    if (pill) { selectPerson(pill.dataset.person); return; }
    const redeemBtn = e.target.closest('.reward-row-btn');
    if (redeemBtn && !redeemBtn.disabled) { redeemReward(redeemBtn.dataset.reward); return; }
    const useBtn = e.target.closest('.wallet-use-btn');
    if (useBtn) { useReward(useBtn.dataset.reward); return; }
    const tabBtn = e.target.closest('.tab-btn');
    if (tabBtn) { switchTab(tabBtn.dataset.page); }
  });

  let touchStartX = null;
  const cardsEl = document.getElementById('cards');
  cardsEl.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, { passive:true });
  cardsEl.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    touchStartX = null;
    if (Math.abs(dx) < 50) return;
    const idx = ROSTER.findIndex((p) => p.id === state.selectedId);
    const nextIdx = dx < 0 ? (idx + 1) % ROSTER.length : (idx - 1 + ROSTER.length) % ROSTER.length;
    selectPerson(ROSTER[nextIdx].id);
  }, { passive:true });

  rolloverIfNeeded();
  render();

  window.addEventListener('resize', syncTopBarHeight);

  // Catch a midnight/Monday rollover if the page is left open across it.
  setInterval(() => { rolloverIfNeeded(); render(); }, 5 * 60 * 1000);
})();
</script>
</body>
</html>
