<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family HQ">
<meta name="theme-color" content="#ffc93c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffc93c'/%3E%3Cpath d='M32 14 L52 32 h-6 v18 H18 V32 h-6 Z' fill='%2322262b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Family HQ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');

  :root{
    --paper:#fffdf8;
    --ink:#22262b;
    --ink-secondary:#6b7280;
    --ink-faint:#a8afb8;
    --surface-card:#ffffff;
    --surface-sunken:#fef5e2;
    --track:#eef0f3;
    --shadow-card:0 2px 8px rgba(34,38,43,0.06), 0 8px 24px rgba(34,38,43,0.06);
  }
  *{
    box-sizing:border-box; -webkit-tap-highlight-color:transparent;
    user-select:none; -webkit-user-select:none;
  }
  html{ -webkit-touch-callout:none; }
  input, textarea{ user-select:text; -webkit-user-select:text; }
  body{
    margin:0; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background:var(--paper); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;
    padding-bottom:88px; /* clears the fixed bottom tab bar */
  }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 20px 48px; }
  .page{ display:none; }
  .page.active{ display:block; }

  .top-bar{ max-width:1180px; margin:0 auto; padding:24px 20px 0; }
  header.top{ display:flex; flex-direction:column; gap:2px; margin-bottom:16px; }
  .eyebrow{ font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); }
  .eyebrow-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .app-meta{ display:flex; align-items:center; gap:6px; cursor:pointer; padding:2px; }
  .app-version{ font-size:10.5px; font-weight:700; color:var(--ink-faint); }
  .today{ font-size:16px; font-weight:600; color:var(--ink-secondary); }

  .switcher{ display:none; gap:8px; overflow-x:auto; padding:10px 6px 14px; }
  /* Habits shows every person at once in its card grid on wider screens, so
     the switcher there only needs to appear on mobile's single-card view.
     Every other page (Rewards, Wallet, Ranking, Settings) always operates
     on one selected/filtered person with no equivalent grid, so it needs
     the switcher visible at any width — otherwise there's no way to pick
     who you're looking at once the mobile-only breakpoint no longer applies. */
  body.show-switcher .switcher{ display:flex; }
  /* flex:1 on the pills (rather than a fixed avatar size) is what makes this
     row adapt to available width — five pills always share the row evenly,
     shrinking together on a narrow phone and capping out at max-width on a
     wide one, instead of overflowing into a horizontal scroll. */
  .switcher-pill{ display:flex; flex-direction:column; align-items:center; gap:5px; flex:1 1 0; min-width:0; cursor:pointer; }
  .switcher-avatar{
    width:100%; max-width:52px; aspect-ratio:1; border-radius:999px; color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:19px;
    transform:scale(0.8333); transition:transform .15s ease, box-shadow .15s ease;
  }
  .switcher-avatar.is-active{ transform:scale(1); box-shadow:0 0 0 3px var(--paper), 0 0 0 6px var(--ring-color); }
  .switcher-label{
    font-size:10px; font-weight:700; color:var(--ink-faint);
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .switcher-label.is-active{ color:var(--ink); }

  /* flex-wrap (not grid) so a short last row centers itself too, instead of
     sitting flush left with dead space to its right — grid shares column
     tracks across every row, which can't do that on its own. Capping width
     keeps cards a comfortable size instead of stretching to fill whatever's
     left on a wide screen. */
  .cards{ display:flex; flex-wrap:wrap; justify-content:center; gap:18px; }
  .card{
    display:flex; flex-direction:column; gap:14px; flex:1 1 210px; max-width:260px;
    background:var(--surface-card); border-radius:20px; padding:20px; box-shadow:var(--shadow-card);
  }

  .card-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .card-header-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .avatar{
    width:44px; height:44px; border-radius:999px; color:#fff; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px;
  }
  .person-name{ font-size:14.5px; font-weight:800; letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .person-role{ font-size:11px; font-weight:600; color:var(--ink-faint); }
  .card-header-right{ display:flex; flex-direction:column; align-items:flex-end; gap:2px; flex-shrink:0; }
  .rank-badge{
    display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:20px;
    padding:0 7px; border-radius:999px; font-size:11px; font-weight:800;
  }
  .points-stat{ font-size:9.5px; font-weight:600; color:var(--ink-faint); white-space:nowrap; }
  .points-stat b{ color:var(--ink-secondary); font-weight:800; }

  /* Birthday chip gets its own full-width row, right under the header --
     it no longer shares a row with the level badge. */
  .bday-row{ display:flex; }

  .bday-chip, .level-badge{
    display:inline-flex; align-items:center; gap:5px; align-self:flex-start;
    border-radius:999px; padding:4px 10px 4px 7px; font-size:10.5px; font-weight:700;
    max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .bday-chip svg, .level-badge svg{ flex-shrink:0; }
  /* Always render the birthday chip, just made invisible (visibility:hidden,
     not removed) when the person has no birthday coming up, so every card
     reserves the same space here and the level/ring rows below always start
     at the same height regardless of who has what. */
  .chip-placeholder{ visibility:hidden; }

  /* Level name + level number share a line, same baseline pairing as the
     Ranking page's existing name + "Lvl N" pattern -- center (not baseline)
     aligned so the number sits centered against the badge pill, not low on
     its text baseline. */
  .level-row{ display:flex; align-items:center; gap:7px; }
  .level-row .level-badge{ min-width:0; }
  .level-num{ font-size:11px; font-weight:700; color:var(--ink-faint); flex-shrink:0; white-space:nowrap; }

  .level-block{ display:flex; flex-direction:column; gap:5px; }
  .level-bar-row{ display:flex; align-items:center; gap:8px; }
  .level-track{ flex:1; height:6px; background:var(--track); border-radius:999px; overflow:hidden; }
  .level-fill{ height:100%; border-radius:999px; transition:width .3s ease; }
  .level-caption{ font-size:9px; font-weight:700; color:var(--ink-faint); flex-shrink:0; white-space:nowrap; }

  .ring-holder{ display:flex; align-items:center; justify-content:center; gap:14px; }
  /* flex+max-width (not a fixed width) so the rings can shrink together
     rather than overflow a narrow card -- same shrink-to-fit pattern as
     the card grid and calendar cells. */
  .ring-wrap{ position:relative; flex:1 1 76px; max-width:76px; aspect-ratio:1; min-width:0; }
  .ring-outer{ width:100%; height:100%; border-radius:999px; transform:rotate(-90deg); }
  .ring-inner{
    position:absolute; inset:6px; border-radius:999px; background:var(--surface-card);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .ring-value{ font-size:13px; font-weight:800; line-height:1; }
  .ring-label{ font-size:7px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); margin-top:2px; }
  /* Today's pocket money -- a small value in the gap between the two
     rings, not a ring of its own: it's a supporting figure, not another
     thing competing with "today" and "this week" for attention. Keeps
     the old piggy-chip's green so it still always reads as "money".
     flex-shrink:0 so it's the rings that give way on a narrow card, never
     this text getting squeezed illegibly. */
  .ring-gap-money{ font-size:11px; font-weight:800; color:#1f7643; white-space:nowrap; flex-shrink:0; }

  .habit-list{ display:flex; flex-direction:column; gap:6px; }
  .habit-group-label{ font-size:11px; font-weight:700; color:var(--ink-secondary); text-transform:uppercase; letter-spacing:0.05em; margin-top:8px; }
  .habit-list > .habit-group-label:first-child{ margin-top:0; }
  .habit-row{ display:flex; align-items:center; gap:8px; background:var(--surface-sunken); border-radius:11px; padding:7px 9px; cursor:pointer; }
  .habit-indicator{
    width:18px; height:18px; border-radius:6px; flex-shrink:0; border:2px solid transparent;
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .habit-indicator--weekly{ width:auto; min-width:18px; padding:0 5px; font-size:9px; font-weight:800; }
  .habit-name{ flex:1; min-width:0; font-size:11.5px; font-weight:600; line-height:1.3; }
  .habit-streak{ display:inline-flex; align-items:center; gap:2px; flex-shrink:0; font-size:9.5px; font-weight:700; color:#a67800; }

  .cal{ margin-top:6px; }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .cal-title{ font-size:12px; font-weight:700; color:var(--ink-secondary); }
  .cal-streak{
    display:inline-flex; align-items:center; gap:4px; background:var(--surface-sunken);
    border-radius:999px; padding:3px 9px 3px 7px; font-size:10.5px; font-weight:700; color:#a67800;
  }
  .cal-dow{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:8px; }
  .cal-dow.has-weekly, .cal-week.has-weekly{ grid-template-columns:repeat(7,1fr) 4px 1fr; }
  .cal-dow-label{ text-align:center; font-size:9px; font-weight:800; color:var(--ink-faint); text-transform:uppercase; }
  .cal-weeks{ display:flex; flex-direction:column; gap:8px; }
  .cal-week{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; align-items:center; }
  .cal-week-divider{ width:1px; height:22px; background:var(--track); justify-self:center; align-self:center; }
  /* min-width:0 lets each grid column actually shrink below the cell's own
     size — without it a fixed-size circle forces its whole column (and the
     rest of the row after it) wider than the card, spilling into the next
     card on layouts with several narrower cards side by side (iPad-width
     grids in particular). width:100%+max-width+aspect-ratio then lets the
     circle itself shrink to fit whatever width it's actually given. */
  .cal-cell-wrap{ display:flex; justify-content:center; position:relative; min-width:0; }
  .cal-month-tag{
    position:absolute; top:-8px; left:50%; transform:translateX(-50%); line-height:1;
    font-size:7px; font-weight:800; color:var(--ink-faint);
    text-transform:uppercase; letter-spacing:0.02em; white-space:nowrap;
  }
  .cal-cell{ position:relative; width:100%; max-width:28px; aspect-ratio:1; border-radius:999px; }
  .cal-cell.clickable{ cursor:pointer; }
  .cal-cell-ring{ width:100%; height:100%; border-radius:999px; transform:rotate(-90deg); }
  .cal-cell-num{
    position:absolute; inset:3px; border-radius:999px; background:var(--surface-card);
    display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700;
  }

  .cal-day-panel{
    margin-top:12px; padding-top:14px; border-top:1px solid var(--track);
    display:flex; flex-direction:column; gap:8px;
  }
  .cal-day-panel-head{ display:flex; align-items:center; justify-content:space-between; }
  .cal-day-panel-title{ font-size:13px; font-weight:800; color:var(--ink); }
  .cal-day-panel-close{
    width:26px; height:26px; border:none; background:var(--surface-sunken); border-radius:999px;
    display:flex; align-items:center; justify-content:center; color:var(--ink-secondary); cursor:pointer;
  }
  .cal-day-note{ font-size:11.5px; color:var(--ink-faint); font-style:italic; }
  .cal-day-row{
    display:flex; align-items:center; gap:10px; background:var(--surface-sunken);
    border-radius:11px; padding:9px 12px; cursor:pointer;
  }
  .cal-day-check{
    width:20px; height:20px; border-radius:6px; flex-shrink:0; border:2px solid transparent;
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .cal-day-name{ flex:1; font-size:13px; font-weight:600; color:var(--ink); }

  .page-sub{ font-size:13.5px; color:var(--ink-secondary); margin:0 0 18px; }

  .settings-section{ border-bottom:1px solid var(--track); padding-bottom:16px; margin-bottom:16px; }
  .settings-section:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
  .settings-section-toggle{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    width:100%; text-align:left; font-family:inherit; background:none; border:none; padding:0; cursor:pointer;
  }
  .settings-section-heading-group{ display:flex; align-items:center; gap:9px; min-width:0; }
  .settings-section-icon{ flex-shrink:0; display:flex; color:var(--ink); }
  .settings-section-heading{ font-size:15px; font-weight:800; color:var(--ink); }
  .settings-section-chevron{ flex-shrink:0; color:var(--ink-faint); display:flex; }
  .settings-section-body{ margin-top:14px; }

  .page-stats{ margin-bottom:18px; }
  .pts-available{ font-size:14px; font-weight:700; color:var(--ink); }
  .pts-available b{ font-weight:800; }
  /* Bank-account style balance hero, in the person's own accent color
     (same idea as their avatar/rings already carrying that color) instead
     of a plain "£X saved" text line -- the big number is the point. */
  .wallet-hero{
    position:relative; overflow:hidden; border-radius:20px; padding:22px 22px 20px; margin-bottom:18px;
    box-shadow:var(--shadow-card); color:#fff;
  }
  .wallet-hero-icon{ position:absolute; right:-14px; top:-16px; opacity:0.16; transform:rotate(8deg); }
  .wallet-hero-label{ font-size:12.5px; font-weight:700; opacity:0.85; }
  .wallet-hero-balance{ font-size:40px; font-weight:800; letter-spacing:-0.02em; line-height:1.1; margin-top:4px; }
  .wallet-hero-earned{ font-size:12px; font-weight:600; opacity:0.85; margin-top:6px; }
  .wallet-expected{
    display:inline-flex; align-items:center; gap:6px;
    background:#eaf9ef; color:#1f7643; border-radius:999px; padding:6px 14px 6px 10px;
    font-size:12px; font-weight:700; margin-bottom:18px;
  }
  .wallet-expected svg{ flex-shrink:0; }

  .wallet-strip{ display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
  .wallet-label{ font-size:11.5px; font-weight:700; color:var(--ink-secondary); text-transform:uppercase; letter-spacing:0.04em; }
  .wallet-list{ display:flex; flex-direction:column; gap:8px; }
  .wallet-chip{
    display:flex; align-items:center; gap:10px;
    background:#eaf9ef; border-radius:999px; padding:8px 8px 8px 16px;
  }
  .wallet-chip-name{ flex:1; min-width:0; font-size:13px; font-weight:700; color:#1f7643; }
  .wallet-use-btn{
    flex-shrink:0; font-family:inherit; font-size:12px; font-weight:800; color:#fff;
    background:#2a9c58; border:none; border-radius:999px; padding:8px 14px; cursor:pointer;
    transition:transform .12s ease;
  }
  .wallet-use-btn:active{ transform:scale(.96); }

  .reward-list{ display:flex; flex-direction:column; gap:8px; }
  .reward-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface-sunken); border-radius:14px; padding:12px 14px;
  }
  .reward-row-info{ display:flex; flex-direction:column; gap:5px; min-width:0; }
  .reward-row-name{ font-size:14px; font-weight:700; }
  .reward-row-costs{ display:flex; gap:6px; flex-wrap:wrap; }
  .reward-cost{
    display:inline-flex; align-items:center; gap:5px; background:var(--surface-card); color:#a67800;
    border-radius:999px; padding:4px 11px 4px 8px; font-size:12px; font-weight:700;
  }
  .reward-cash{
    display:inline-flex; align-items:center; gap:5px; background:#eaf9ef; color:#1f7643;
    border-radius:999px; padding:4px 11px 4px 8px; font-size:12px; font-weight:700;
  }

  .reward-row-btn{
    flex-shrink:0; font-family:inherit; font-size:12.5px; font-weight:700; color:var(--ink);
    background:#ffc93c; border:none; border-radius:999px; padding:10px 16px; cursor:pointer;
    transition:transform .12s ease;
  }
  .reward-row-btn:active{ transform:scale(.96); }
  .reward-row-btn:disabled{ opacity:.4; cursor:not-allowed; }

  .piggy-section{ margin-top:0; }

  /* Withdraw / Add money sit as two buttons, not an always-open form --
     the form only appears once you've picked one, so the page reads as a
     bank account (balance, two actions) rather than a form with a list
     bolted underneath it. */
  .wallet-actions{ display:flex; gap:10px; margin-bottom:18px; }
  .wallet-action-btn{
    flex:1; font-family:inherit; font-size:13px; font-weight:700;
    border:none; border-radius:999px; padding:13px 18px; cursor:pointer; text-align:center;
    transition:transform .12s ease;
  }
  .wallet-action-btn:active{ transform:scale(.96); }
  .wallet-action-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .wallet-action-btn.is-withdraw{ color:#fff; background:#2a9c58; }
  .wallet-action-btn.is-add{
    position:relative; color:var(--ink); background:#fff; border:1.5px solid var(--track);
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .wallet-action-btn.is-add svg{ flex-shrink:0; }
  /* Only shown while this device hasn't unlocked the family PIN yet this
     session -- once it has (same unlock Settings uses), Add money just
     opens, so the lock badge would be misleading if it stuck around. */
  .wallet-action-lock{
    position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:999px;
    background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 2px var(--paper);
  }

  .wallet-form-card{
    margin-bottom:18px; background:var(--surface-card); border-radius:20px; box-shadow:var(--shadow-card);
    padding:18px 20px 20px;
  }
  .wallet-form-title{ display:flex; align-items:center; gap:7px; font-size:14px; font-weight:800; margin-bottom:14px; }
  .wallet-form-title.is-money{ color:#1f7643; }
  .wallet-form-close{
    margin-left:auto; background:none; border:none; cursor:pointer; color:var(--ink-faint);
    display:flex; padding:2px;
  }
  .wallet-form-card .withdraw-row{ margin-bottom:0; }
  /* Same pin-gate anatomy the Settings lock screen uses, just inside a
     card instead of filling the page, so it reads as the same lock. */
  .pin-gate-card{
    margin-bottom:18px; background:var(--surface-card); border-radius:20px; box-shadow:var(--shadow-card);
    padding:20px 20px 22px;
  }

  .withdraw-row{ display:flex; gap:8px; margin-bottom:18px; }
  .withdraw-input, .withdraw-note{
    font-family:inherit; color:var(--ink); border:1.5px solid var(--track); border-radius:999px;
    background:#fff; padding:10px 14px;
  }
  .withdraw-input{ width:84px; flex-shrink:0; font-size:13px; font-weight:700; }
  .withdraw-input:disabled, .withdraw-note:disabled{ opacity:.5; }
  .withdraw-note{ flex:1; min-width:0; font-size:13px; font-weight:500; }
  .withdraw-btn{
    flex-shrink:0; font-family:inherit; font-size:12.5px; font-weight:700; color:#fff;
    background:#2a9c58; border:none; border-radius:999px; padding:10px 18px; cursor:pointer;
    transition:transform .12s ease;
  }
  .withdraw-btn:active{ transform:scale(.96); }
  .withdraw-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .ledger-label{ font-size:11.5px; font-weight:700; color:var(--ink-secondary); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px; }
  .ledger-list{ display:flex; flex-direction:column; gap:2px; max-height:260px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .ledger-row{
    display:flex; align-items:center; gap:12px;
    padding:10px 2px; border-bottom:1px solid var(--track); font-size:12.5px;
  }
  .ledger-row:last-child{ border-bottom:none; }
  .ledger-icon{
    flex-shrink:0; width:32px; height:32px; border-radius:999px;
    display:flex; align-items:center; justify-content:center;
  }
  .ledger-icon.is-in{ background:#eaf9ef; color:#1f7643; }
  .ledger-icon.is-out{ background:#fdeceb; color:#c4402f; }
  .ledger-reason{ flex:1; min-width:0; font-weight:600; color:var(--ink); display:flex; flex-direction:column; gap:1px; }
  .ledger-date{ font-size:10.5px; font-weight:600; color:var(--ink-faint); }
  .ledger-amount{ flex-shrink:0; font-weight:800; white-space:nowrap; font-size:13.5px; }
  .ledger-in{ color:#2a9c58; }
  .ledger-out{ color:#e84e3d; }
  .ledger-toggle-btn, .activity-toggle-btn{
    width:100%; margin-top:10px; padding:9px; border-radius:999px; border:1.5px dashed #d8dbe0;
    background:transparent; font-family:inherit; font-size:12.5px; font-weight:700; color:var(--ink-secondary); cursor:pointer;
  }
  .ledger-capped-note{ font-size:10.5px; color:var(--ink-faint); text-align:center; margin-top:8px; }

  .pocket-editor{ display:flex; flex-direction:column; gap:8px; }
  .pocket-editor .withdraw-row{ margin-bottom:0; }
  .pocket-editor-note{ font-size:11.5px; color:var(--ink-faint); line-height:1.4; }

  .pin-gate{

<body>

<div class="top-bar" id="topBar">

</div>

  <div class="page" id="pageRewards">

<footer class="note">Saved on this device only &mdash; each phone or iPad keeps its own copy. Add to your Home Screen for one-tap access.</footer>

<nav class="tab-bar" id="tabBar">
  <button class="tab-btn active" data-page="pageHabits" id="tabHabits"></button>
  <button class="tab-btn" data-page="pageRewards" id="tabRewards"></button>
  <button class="tab-btn" data-page="pageWallet" id="tabWallet"></button>
  <button class="tab-btn" data-page="pageLeaderboard" id="tabLeaderboard"></button>
  <button class="tab-btn" data-page="pageSettings" id="tabSettings"></button>
</nav>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  const STORAGE_KEY = 'familyHQ_profile_v1';
  // Bump this by 1 on every change pushed to main — it's the only way to
  // confirm a device has actually picked up a new deploy, since there's no
  // build step to stamp a real version automatically. Shown top-right of
  // the header, next to the cloud sync dot.
  const APP_VERSION = 2;
  // Optional cross-device sync via Supabase. Paste your project's URL and
  // anon key here (Supabase dashboard: Settings > API) to turn it on. The
  // anon key is meant to be public — it's not a secret credential, access
  // is enforced by the table's Row Level Security policy, not by hiding
  // this — so it's safe to commit. Leave it null to run in local-only mode
  // (today's behavior: each device keeps its own copy, nothing leaves it).
  const supabaseConfig = {
    url: "https://qnxcwrgfhfzbbtxwmral.supabase.co",
    anonKey: "sb_publishable_9RLg2B6Y8NnvzgNQJF_Xnw_OS3sAk5q",
  };
  // Every family's data lives in one fixed row of this table — there's no
  // multi-tenant concept here, just "this app, this family".
  const SUPABASE_TABLE = 'family_state';
  const SUPABASE_ROW_ID = 'familyHQ';
  const HABIT_POINTS = 10;
  const BIRTHDAY_BONUS = 100;
  const SHOW_BDAY_WITHIN_DAYS = 60;
  const LEVEL_BASE_PTS = 150;
  const LEVEL_GROWTH = 1.25;
  const LEVEL_TITLES = ['Sock drawer sergeant', 'Duty deputy', 'Chore cadet', 'Tidy titan', 'Household hero', 'Domestic dynamo', 'Grand vizier of vacuuming'];
  const PAGE_IDS = ['pageHabits', 'pageRewards', 'pageWallet', 'pageLeaderboard', 'pageSettings'];

  // pocketWeekly: £ target per week, scaled by that week's daily-habit
  // completion ratio (see weeklyRatioSoFar / rolloverIfNeeded). 0 = no allowance.
  const ROSTER = [
    { id:'matt', name:'Matt', role:'Parent', initial:'M', color:'#2fa9e5', birthday:{ month:3, day:21 }, pocketWeekly:0,
      habits:[
        { id:'vitamins', name:'Take vitamins', freq:'daily' },
        { id:'exercise', name:'Exercise 20 min', freq:'weekly', target:3 },
        { id:'winddown', name:'Screen-free wind down', freq:'daily' },
      ] },
    { id:'jemma', name:'Jemma', role:'Parent', initial:'J', color:'#9b6bf0', birthday:{ month:8, day:13 }, pocketWeekly:0,
      habits:[
        { id:'vitamins', name:'Take vitamins', freq:'daily' },
        { id:'exercise', name:'Exercise 20 min', freq:'weekly', target:3 },
        { id:'tidy', name:'Tidy your space', freq:'daily' },
      ] },
    { id:'henry', name:'Henry', role:'Kid', initial:'H', color:'#3dbe72', birthday:{ month:9, day:19 }, pocketWeekly:5,
      habits:[
        { id:'vitamins', name:'Take vitamins', freq:'daily' },
        { id:'brush', name:'Brush teeth', freq:'daily' },
        { id:'read', name:'Read 20 minutes', freq:'daily' },
        { id:'room', name:'Tidy your room', freq:'daily' },
      ] },
    { id:'ted', name:'Ted', role:'Kid', initial:'T', color:'#ff6b5b', birthday:{ month:3, day:2 }, pocketWeekly:5,
      habits:[
        { id:'vitamins', name:'Take vitamins', freq:'daily' },
        { id:'brush', name:'Brush teeth', freq:'daily' },
        { id:'read', name:'Read 20 minutes', freq:'daily' },
      ] },
    { id:'lorraine', name:'Lorraine', role:'Grandma', initial:'L', color:'#ec6a9c', birthday:{ month:6, day:28 }, pocketWeekly:0,
      habits:[
        { id:'walk', name:'Afternoon walk', freq:'weekly', target:5 },
        { id:'call', name:'Call a grandchild', freq:'weekly', target:1 },
        { id:'puzzle', name:'Puzzle or crossword', freq:'daily' },
      ] },
  ];

  function pad2(n){ return n < 10 ? '0' + n : '' + n; }
  function dateKey(d){ return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
  function mondayKey(d){
    const dow = (d.getDay() + 6) % 7;
    const m = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow);
    return dateKey(m);
  }
  function addDaysKey(k, n){
    const [y, m, d] = k.split('-').map(Number);
    return dateKey(new Date(y, m - 1, d + n));
  }
  function roundMoney(n){ return Math.round(n * 100) / 100; }

  function defaultPersonState(){
    const today = new Date();
    return {
      bankedPoints: 0, // spendable currency — goes down when a reward is redeemed
      totalBanked: 0,  // lifetime points ever earned; never decreases from spending, but a
                        // retroactive correction to a past day (see setHabitDoneOnDay) can
                        // adjust it — that's fixing an error in the record, not spending.
      piggyLedger: [], // append-only real-money history: {id, delta, reason, at, dateKey} —
                        // current balance and lifetime-earned are both derived from this, see
                        // piggyBalance / piggyEarnedTotal.
      dailyRatioHistory: {}, // dateKey -> that day's daily-habit completion ratio (0..1)
      weeklyRatioHistory: {}, // Monday weekAnchor key -> that week's weekly-habit completion
                        // ratio (0..1), sum(count)/sum(target) across weekly habits, archived
                        // at week rollover. Feeds the calendar's weekly ring.
      habitDayLog: {}, // dateKey -> {habitId: done} — per-habit detail for past days, feeds
                        // the calendar and lets a past day be individually corrected.
      rewardInventory: {}, // rewardId -> how many bought-but-not-yet-used are owned
      lastResetDate: dateKey(today),
      weekAnchor: mondayKey(today),
      bdayAwardedYear: null,
      habits: [],
    };
  }

  // A reward without `cash` is a privilege (points only); one with `cash`
  // also credits that amount to the redeemer's piggy bank ledger.
  const REWARDS = [
    { id:'r_dinner', name:'Choose Friday dinner', cost:50 },
    { id:'r_screen30', name:'Extra 30 min screen time', cost:30 },
    { id:'r_late15', name:'Stay up 15 min late', cost:25 },
    { id:'r_movie', name:'Pick the family movie', cost:40 },
    { id:'r_chorepass', name:'Skip one chore (free pass)', cost:60 },
    { id:'r_cash5', name:'£5 pocket money', cost:120, cash:5 },
  ];

  function habitDefsOf(personId){
    return state.people[personId].habitDefs;
  }
  function habitDefOf(personId, habitId){
    return habitDefsOf(personId).find((h) => h.id === habitId);
  }
  function habitStateOf(personId, habitId){
    return state.people[personId].habits.find((h) => h.id === habitId);
  }
  function pocketWeeklyOf(personId){
    return state.people[personId].pocketWeekly;
  }

  function loadState(){
    let saved = null;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) saved = JSON.parse(raw);
    } catch (e) { /* localStorage unavailable — fall through to fresh state */ }

    const s = { people:{}, selectedId:null, activityLog:(saved && Array.isArray(saved.activityLog)) ? saved.activityLog : [] };
    ROSTER.forEach((p) => {
      s.people[p.id] = (saved && saved.people && saved.people[p.id]) || defaultPersonState();
      // Migrate saves from before the ledger existed: seed one opening entry per
      // non-zero legacy balance so nothing is lost, then the ledger drives everything.
      if (!Array.isArray(s.people[p.id].piggyLedger)) {
        const openingPocket = s.people[p.id].piggyPocket || 0;
        const openingReward = s.people[p.id].piggyReward || 0;
        s.people[p.id].piggyLedger = [];
        if (openingPocket) piggyLedgerAdd(s.people[p.id], openingPocket, 'Weekly allowance (migrated balance)', `opening:${p.id}:pocket`);
        if (openingReward) piggyLedgerAdd(s.people[p.id], openingReward, 'Reward cash-outs (migrated balance)', `opening:${p.id}:reward`);
        delete s.people[p.id].piggyPocket;
        delete s.people[p.id].piggyReward;
      }
      if (typeof s.people[p.id].bankedPoints !== 'number') s.people[p.id].bankedPoints = 0;
      if (typeof s.people[p.id].totalBanked !== 'number') s.people[p.id].totalBanked = s.people[p.id].bankedPoints;
      if (!s.people[p.id].rewardInventory || typeof s.people[p.id].rewardInventory !== 'object') s.people[p.id].rewardInventory = {};
      if (!s.people[p.id].dailyRatioHistory || typeof s.people[p.id].dailyRatioHistory !== 'object') s.people[p.id].dailyRatioHistory = {};
      if (!s.people[p.id].weeklyRatioHistory || typeof s.people[p.id].weeklyRatioHistory !== 'object') s.people[p.id].weeklyRatioHistory = {};
      if (!s.people[p.id].habitDayLog || typeof s.people[p.id].habitDayLog !== 'object') s.people[p.id].habitDayLog = {};
      // These three drive rolloverIfNeeded()'s daily/weekly/birthday logic —
      // a save missing any of them (an old backup predating one of these
      // fields, most likely) previously crashed the whole app on load,
      // since nothing backfilled them before rollover ran.
      if (typeof s.people[p.id].lastResetDate !== 'string') s.people[p.id].lastResetDate = dateKey(new Date());
      if (typeof s.people[p.id].weekAnchor !== 'string') s.people[p.id].weekAnchor = mondayKey(new Date());
      if (s.people[p.id].bdayAwardedYear === undefined) s.people[p.id].bdayAwardedYear = null;
      // Weekly pocket-money target used to be fixed in ROSTER; editable now
      // from Settings, so it lives in state — seeded once from ROSTER.
      if (typeof s.people[p.id].pocketWeekly !== 'number') s.people[p.id].pocketWeekly = p.pocketWeekly;
      // Habit *definitions* (name/frequency/target/points) used to be fixed
      // in ROSTER; they're editable now, so they live in state — seeded once
      // from ROSTER's list as that person's starting habits.
      if (!Array.isArray(s.people[p.id].habitDefs)) {
        s.people[p.id].habitDefs = p.habits.map((h) => ({ id:h.id, name:h.name, freq:h.freq, target:h.target || 1, points:HABIT_POINTS }));
      }
      if (!Array.isArray(s.people[p.id].habits)) s.people[p.id].habits = [];
      s.people[p.id].habitDefs.forEach((h) => {
        // A habit def saved before `points`/`target` were part of the shape
        // would otherwise feed NaN into every points/money calculation that
        // reads them directly.
        if (typeof h.points !== 'number') h.points = HABIT_POINTS;
        if (typeof h.target !== 'number') h.target = 1;
        if (!s.people[p.id].habits.find((x) => x.id === h.id)) {
          s.people[p.id].habits.push({ id:h.id, done:false, count:0, streak:0 });
        }
      });
    });
    s.selectedId = (saved && saved.selectedId && ROSTER.some((p) => p.id === saved.selectedId))
      ? saved.selectedId
      : ROSTER[0].id;
    // Independent of selectedId (which is "who am I acting as" on Habits/Rewards) —
    // this just filters the Settings activity feed. null = show everyone.
    s.settingsFilterId = (saved && saved.settingsFilterId && ROSTER.some((p) => p.id === saved.settingsFilterId))
      ? saved.settingsFilterId
      : null;
    // Family-wide PIN gating the Settings tab. null = no PIN set, page is open.
    s.settingsPin = (saved && typeof saved.settingsPin === 'string' && saved.settingsPin) ? saved.settingsPin : null;
    // ISO timestamp of the last JSON export, for the stale-backup nudge. null = never.
    s.lastExportAt = (saved && typeof saved.lastExportAt === 'string') ? saved.lastExportAt : null;
    // Which tab a reload should land back on. Per-device like selectedId/
    // settingsFilterId above (see applyRemoteState) — Dad's phone reopening
    // on Wallet shouldn't jump to whatever tab Mum's iPad last had open.
    s.currentPage = (saved && PAGE_IDS.includes(saved.currentPage)) ? saved.currentPage : 'pageHabits';
    return s;
  }

  function saveState(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
    scheduleSyncPush();
  }

  // --- Optional Supabase sync ---------------------------------------------
  // Everything in this block is inert when supabaseConfig is null. When
  // configured, this device's copy of `state` becomes a live mirror of one
  // shared row (id = SUPABASE_ROW_ID) in the family_state table: local
  // writes push to it (debounced, so a burst of habit-ticking sends one
  // write, not ten), and a Realtime subscription pulls in whatever any
  // other device just wrote. Last write wins if two devices change
  // something within the same debounce window — there's no merge, just
  // whichever push reaches Supabase last. Good enough for a family; not a
  // general-purpose multi-user sync engine. Supabase being unreachable, or
  // a wrong/missing config, must never break the app — it just keeps
  // running exactly as it does with no config at all (each device's own
  // local copy).
  let syncClient = null;
  let syncPushTimer = null;
  let syncApplyingRemote = false; // true while applying a just-received remote update, so it isn't immediately pushed straight back
  const SYNC_PUSH_DELAY_MS = 500;
  // Ephemeral, not persisted — this device's own live read of its Supabase
  // connection, surfaced in Settings > Backup so "is sync actually working"
  // doesn't require opening the browser console. One of: 'off' (not
  // configured), 'connecting', 'connected' (fully live), 'degraded' (data
  // reads/writes work but live updates aren't reaching this device — almost
  // always Realtime not enabled on the table), 'error' (unreachable or
  // misconfigured, running local-only).
  let cloudSyncStatus = supabaseConfig ? 'connecting' : 'off';
  // The actual error text for 'error'/'degraded', shown on-screen in
  // Settings > Backup — a phone with no way to plug into a computer has no
  // way to see the browser console, so this can't be console-only.
  let cloudSyncErrorDetail = '';

  function describeSyncError(e){
    if (!e) return '';
    const parts = [e.message || String(e)];
    if (e.code) parts.push(`code: ${e.code}`);
    if (e.hint) parts.push(`hint: ${e.hint}`);
    return parts.join(' — ');
  }

  function scheduleSyncPush(){
    if (!syncClient || syncApplyingRemote) return;
    clearTimeout(syncPushTimer);
    syncPushTimer = setTimeout(() => {
      syncClient.from(SUPABASE_TABLE).upsert({ id: SUPABASE_ROW_ID, data: state }).then(({ error }) => {
        if (error) console.warn('Family HQ: cloud sync push failed (will retry on the next change).', error);
      });
    }, SYNC_PUSH_DELAY_MS);
  }

  function applyRemoteState(newState){
    syncApplyingRemote = true;
    // currentPage/selectedId/settingsFilterId are "what is this device
    // looking at right now" — per-device UI state, not shared family data.
    // Take everything else from the incoming remote update, but keep this
    // device's own values for those three, so another device syncing in
    // doesn't yank you to a different tab or person mid-use.
    state = { ...newState, currentPage: state.currentPage, selectedId: state.selectedId, settingsFilterId: state.settingsFilterId };
    saveState();
    syncApplyingRemote = false;
    rolloverIfNeeded();
    render();
  }

  async function initSupabaseSync(){
    if (!supabaseConfig) return; // local-only mode, nothing to do
    try {
      const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
      const supabase = createClient(supabaseConfig.url, supabaseConfig.anonKey);

      let { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        const { error: authError } = await supabase.auth.signInAnonymously();
        if (authError) throw authError;
      }

      const { data: row, error: readError } = await supabase
        .from(SUPABASE_TABLE)
        .select('data')
        .eq('id', SUPABASE_ROW_ID)
        .maybeSingle();
      if (readError) throw readError;

      if (row) {
        // Supabase already holds the family's data — it becomes this
        // device's source of truth from here on.
        applyRemoteState(row.data);
      } else {
        // First device ever to connect this family to Supabase — whatever
        // is on this device right now becomes the shared starting point.
        const { error: seedError } = await supabase.from(SUPABASE_TABLE).insert({ id: SUPABASE_ROW_ID, data: state });
        if (seedError) throw seedError;
      }

      syncClient = supabase;

      supabase
        .channel('family_state_changes')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: SUPABASE_TABLE, filter: `id=eq.${SUPABASE_ROW_ID}` }, (payload) => {
          applyRemoteState(payload.new.data);
        })
        .subscribe((status, err) => {
          // Reads/writes go over plain REST and work independently of this
          // — this only reports whether LIVE updates are actually flowing.
          // A failure here is almost always Realtime not being switched on
          // for the family_state table (Database > Replication in the
          // Supabase dashboard), not a problem with the data itself.
          if (status === 'SUBSCRIBED') {
            console.info('Family HQ: live cross-device sync connected.');
            cloudSyncStatus = 'connected';
            render();
          } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
            console.warn(`Family HQ: live sync subscription ${status.toLowerCase().replace('_', ' ')} — changes will only show up on reload until this reconnects. Check that Realtime is enabled for the family_state table.`, err || '');
            cloudSyncStatus = 'degraded';
            cloudSyncErrorDetail = `${status}${err ? ` — ${describeSyncError(err)}` : ''}`;
            render();
          }
        });
    } catch (e) {
      console.warn('Family HQ: cloud sync unavailable, continuing with local storage only.', e);
      cloudSyncStatus = 'error';
      cloudSyncErrorDetail = describeSyncError(e);
      render();
    }
  }

  let state = loadState();
  // loadState() can migrate an old/partial save in memory (backfilling a
  // missing field, converting legacy piggyPocket/piggyReward into ledger
  // entries, seeding habitDefs from ROSTER, ...) — flush that immediately
  // rather than leaving it to whatever happens to save next, so the
  // migrated shape survives even if the tab closes before any interaction.
  saveState();
  // Not persisted — a PIN unlocks Settings for the rest of this session only;
  // a fresh page load (or reload) re-locks it if a PIN is set.
  let settingsUnlocked = false;

  function nextBirthdayInfo(month, day, today){
    const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    let target = new Date(todayMid.getFullYear(), month - 1, day);
    if (target < todayMid) target = new Date(todayMid.getFullYear() + 1, month - 1, day);
    const diffDays = Math.round((target - todayMid) / 86400000);
    if (diffDays === 0) return { today:true, diffDays:0 };
    if (diffDays < 30) return { today:false, mode:'days', diffDays };
    let months = (target.getFullYear() - todayMid.getFullYear()) * 12 + (target.getMonth() - todayMid.getMonth());
    if (target.getDate() < todayMid.getDate()) months--;
    const afterMonths = new Date(todayMid.getFullYear(), todayMid.getMonth() + months, todayMid.getDate());
    const weeks = Math.floor(Math.round((target - afterMonths) / 86400000) / 7);
    return { today:false, mode:'months', months, weeks, diffDays };
  }

  function formatBirthday(info){
    if (info.today) return `Birthday today! +${BIRTHDAY_BONUS} pts`;
    if (info.mode === 'days') return `${info.diffDays} day${info.diffDays === 1 ? '' : 's'} to go`;
    const parts = [];
    if (info.months > 0) parts.push(`${info.months} month${info.months === 1 ? '' : 's'}`);
    if (info.weeks > 0) parts.push(`${info.weeks} week${info.weeks === 1 ? '' : 's'}`);
    return parts.join(', ');
  }

  function computeLevel(points){
    let lvl = 1, into = points, span = LEVEL_BASE_PTS;
    while (into >= span) { into -= span; lvl++; span = Math.round(span * LEVEL_GROWTH); }
    return { level:lvl, into, span };
  }

  function tint(hex, alpha){
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
  }

  function ringGradient(percent, color){
    if (percent <= 0) return '#eef0f3';
    if (percent >= 100) return color;
    return `conic-gradient(${color} 0% ${percent}%, #eef0f3 ${percent}% 100%)`;
  }

  // Whatever's checked off right now but hasn't rolled over into a banked
  // total yet — contributes equally to both the spendable and lifetime pools.
  function liveContribution(personId){
    let live = 0;
    habitDefsOf(personId).forEach((h) => {
      const hs = habitStateOf(personId, h.id);
      if (h.freq === 'daily') { if (hs.done) live += h.points; }
      else { live += hs.count * h.points; }
    });
    return live;
  }

  // Spendable currency: goes up when habits are ticked, down when a reward
  // is redeemed. This is what "can they afford it" checks against.
  function computeSpendablePoints(personId){
    return state.people[personId].bankedPoints + liveContribution(personId);
  }

  // Lifetime total: never decreases, even when points are spent. Drives
  // level/rank so redeeming a reward doesn't undo someone's progress.
  function computeTotalPoints(personId){
    return state.people[personId].totalBanked + liveContribution(personId);
  }

  // Credits an amount to both pools at once — the only way points are earned,
  // so the two totals can never drift apart.
  function awardPoints(ps, amount){
    ps.bankedPoints += amount;
    ps.totalBanked += amount;
  }

  const CALENDAR_WEEKS_BACK = 4;
  const CALENDAR_WEEKS_FORWARD = 1;

  // { done, total } of daily habits for one day. Today is read live off
  // current habit state (it's still changing); a past day comes from the
  // per-habit log where one exists. A day whose log predates this feature
  // (only the old aggregate ratio survives) falls back to that ratio against
  // today's habit count — close enough for display, but not editable, since
  // there's no per-habit detail to show or correct.
  function dayCompletion(personId, dateKeyStr){
    const ps = state.people[personId];
    const dailyDefs = habitDefsOf(personId).filter((h) => h.freq === 'daily');
    const total = dailyDefs.length;
    if (dateKeyStr === ps.lastResetDate) {
      const done = dailyDefs.filter((h) => habitStateOf(personId, h.id).done).length;
      return { done, total, editable: true };
    }
    const log = ps.habitDayLog[dateKeyStr];
    if (log) {
      const done = dailyDefs.filter((h) => log[h.id]).length;
      return { done, total, editable: true };
    }
    if (dateKeyStr in ps.dailyRatioHistory) {
      const ratio = ps.dailyRatioHistory[dateKeyStr];
      return { done: Math.round(ratio * total), total, editable: false };
    }
    return { done: null, total, editable: false }; // no record at all
  }

  // Same idea as dayCompletion but for a whole Monday-anchored week: the
  // live in-progress week reads straight off current habit counts, a past
  // week reads its archived ratio (reinterpreted against today's weekly
  // habit list, same accepted approximation dayCompletion makes), and a
  // week with neither has no record. Not editable — no per-habit weekly
  // detail is kept, only the aggregate.
  function weekCompletion(personId, weekAnchorKeyStr){
    const ps = state.people[personId];
    const weeklyDefs = habitDefsOf(personId).filter((h) => h.freq === 'weekly');
    const total = weeklyDefs.reduce((sum, h) => sum + h.target, 0);
    if (weekAnchorKeyStr === ps.weekAnchor) {
      const done = weeklyDefs.reduce((sum, h) => sum + habitStateOf(personId, h.id).count, 0);
      return { done, total };
    }
    if (weekAnchorKeyStr in ps.weeklyRatioHistory) {
      const ratio = ps.weeklyRatioHistory[weekAnchorKeyStr];
      return { done: Math.round(ratio * total), total };
    }
    return { done: null, total }; // no record at all
  }

  // Walks backward from a day, counting consecutive done days — used to
  // resync a habit's stored streak after a past day is corrected, since the
  // normal incremental +1/reset-to-0 only runs forward at daily rollover.
  function recomputeHabitStreak(personId, habitId, fromDateKeyExclusive){
    const ps = state.people[personId];
    let streak = 0;
    let cursor = addDaysKey(fromDateKeyExclusive, -1);
    while (true) {
      const log = ps.habitDayLog[cursor];
      if (!log || !log[habitId]) break;
      streak++;
      cursor = addDaysKey(cursor, -1);
    }
    return streak;
  }

  // Corrects a single habit's done state on a past day. Adjusts points by
  // exactly the delta (a correction, not a spend — see totalBanked's note)
  // and re-derives the habit's streak from history rather than nudging the
  // stored counter, since the edit can land anywhere in the run.
  function setHabitDoneOnDay(personId, habitId, dateKeyStr, newDone){
    const ps = state.people[personId];
    const def = habitDefOf(personId, habitId);
    if (!def || def.freq !== 'daily') return;
    if (dateKeyStr >= ps.lastResetDate) return; // today+ isn't edited this way

    if (!ps.habitDayLog[dateKeyStr]) ps.habitDayLog[dateKeyStr] = {};
    const dayLog = ps.habitDayLog[dateKeyStr];
    const oldDone = !!dayLog[habitId];
    if (oldDone === newDone) return;
    dayLog[habitId] = newDone;

    awardPoints(ps, (newDone ? 1 : -1) * def.points);
    ps.bankedPoints = Math.max(0, ps.bankedPoints);
    ps.totalBanked = Math.max(0, ps.totalBanked);

    const dailyDefs = habitDefsOf(personId).filter((h) => h.freq === 'daily');
    if (dailyDefs.length) {
      const doneCount = dailyDefs.filter((h) => dayLog[h.id]).length;
      ps.dailyRatioHistory[dateKeyStr] = doneCount / dailyDefs.length;
    }

    const hs = habitStateOf(personId, habitId);
    hs.streak = recomputeHabitStreak(personId, habitId, ps.lastResetDate);

    const dateLabel = parseDateKeyToDate(dateKeyStr).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
    logActivity(personId, `corrected ${dateLabel}: ${newDone ? 'marked' : 'unmarked'} <b>${escapeHtml(def.name)}</b>`);
  }

  function parseDateKeyToDate(k){
    const [y, m, d] = k.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  // Weekly pocket money, adapted from the original prototype: each day
  // contributes at most 1/7th of the week's allowance, so it builds up
  // gradually rather than all-or-nothing. Only daily habits count toward the
  // ratio — a weekly-target habit isn't a "today" concept, so it earns its
  // own points but doesn't feed this. Past days come from the archived
  // history; today is read live so the estimate updates as habits are ticked;
  // future days in the week simply haven't contributed yet.
  function weeklyRatioSoFar(personId){
    const ps = state.people[personId];
    const dailyDefs = habitDefsOf(personId).filter((h) => h.freq === 'daily');
    const todayKeyStr = dateKey(new Date());
    let sum = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDaysKey(ps.weekAnchor, i);
      if (d === todayKeyStr) {
        sum += dailyDefs.length ? dailyDefs.filter((h) => habitStateOf(personId, h.id).done).length / dailyDefs.length : 0;
      } else if (d < todayKeyStr) {
        sum += ps.dailyRatioHistory[d] || 0;
      }
    }
    return sum / 7;
  }

  // Live "building" estimate for the week in progress — shown on the profile
  // card. Not yet banked; only credited to the ledger at the week's rollover.
  function weeklyEstimate(personId){
    return roundMoney(pocketWeeklyOf(personId) * weeklyRatioSoFar(personId));
  }

  const MAX_ACTIVITY_LOG = 150;
  const LEDGER_DEFAULT_ROWS = 10;
  const LEDGER_MAX_ROWS = 100;
  // Ephemeral, not persisted — which person's piggy ledger is expanded past
  // the default 10 rows. Resets to collapsed on reload.
  let ledgerExpanded = {};
  // Ephemeral, not persisted — whether the family activity log (on Settings)
  // is expanded past the default 10 rows.
  let activityExpanded = false;
  // Ephemeral, not persisted — which Settings sections (pocket money, habit
  // editor, activity log, security) are expanded. Each starts collapsed so
  // the page opens tidy, with its heading always visible as the toggle.
  let settingsSectionOpen = {};
  // Ephemeral, not persisted — which panel is open below the Withdraw/Add
  // money buttons on the Wallet page: null (just the two buttons),
  // 'withdraw', 'addPin' (family PIN prompt), or 'addForm' (deposit form,
  // PIN already verified this session). Reset whenever the selected person
  // or page changes so a stale panel never carries over onto someone else's
  // wallet or lingers after navigating away.
  let walletAction = null;
  // Family-wide, not per-person — the settings-page ledger of everything
  // that's happened. Newest first; trimmed so storage doesn't grow forever.
  function logActivity(personId, msg){
    state.activityLog.unshift({ personId, msg, at: new Date().toISOString() });
    if (state.activityLog.length > MAX_ACTIVITY_LOG) state.activityLog.length = MAX_ACTIVITY_LOG;
  }

  // Writing the same id again *replaces* that entry rather than duplicating —
  // makes system-generated entries (a weekly payout) safe to re-apply, since a
  // retried or re-run payout corrects in place instead of double-paying.
  // Manual entries (redemptions, withdrawals) get a random id, each its own event.
  function piggyLedgerAdd(ps, delta, reason, id, entryDateKey){
    delta = roundMoney(delta);
    if (delta === 0 && id == null) return;
    const entry = {
      id: id || `piggy_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
      delta, reason, at: new Date().toISOString(), dateKey: entryDateKey || dateKey(new Date()),
    };
    const idx = ps.piggyLedger.findIndex((e) => e.id === entry.id);
    if (idx !== -1) ps.piggyLedger[idx] = entry; else ps.piggyLedger.push(entry);
  }

  // Current spendable balance — goes up on a payout/redemption, down on a
  // withdrawal. Just the ledger summed.
  function piggyBalance(personId){
    return roundMoney((state.people[personId].piggyLedger || []).reduce((a, e) => a + e.delta, 0));
  }

  // Lifetime total ever earned — sums only the credits, so withdrawing money
  // never reduces it. This is the "total earned" figure.
  function piggyEarnedTotal(personId){
    return roundMoney((state.people[personId].piggyLedger || []).filter((e) => e.delta > 0).reduce((a, e) => a + e.delta, 0));
  }

  // Whether the piggy bank is worth showing at all for this person: either
  // they're eligible for a weekly allowance (even at £0.00 so far), or
  // they've earned money some other way (redeeming a cash reward).
  function piggyEligible(personId){
    return pocketWeeklyOf(personId) > 0 || piggyEarnedTotal(personId) > 0;
  }

  function drawDownPiggy(amount, note){
    const personId = state.selectedId;
    const p = ROSTER.find((r) => r.id === personId);
    const ps = state.people[personId];
    const balance = piggyBalance(personId);
    if (!(amount > 0) || amount > balance + 0.001) {
      showToast(`Enter an amount up to £${balance.toFixed(2)}.`, 'danger');
      return;
    }
    const cleanNote = (note || '').trim();
    piggyLedgerAdd(ps, -amount, cleanNote || 'Withdrawn', null, dateKey(new Date()));
    logActivity(personId, `withdrew &pound;${amount.toFixed(2)} from the piggy bank${cleanNote ? ` (${escapeHtml(cleanNote)})` : ''}`);
    saveState();
    walletAction = null;
    render();
    showToast(`£${amount.toFixed(2)} withdrawn for ${p.name}.`, 'success');
  }

  // Manual deposit — a parent logging a birthday gift, chore top-up, etc.
  // straight into the ledger. Gated behind the family's existing Settings
  // PIN (see openWalletAction/submitWalletPin) so a kid can't credit their
  // own wallet; reuses settingsUnlocked rather than its own flag so
  // unlocking once (from here or from Settings) covers both while you stay
  // on Settings/Wallet. Relocks itself right after one successful deposit
  // (below), on top of switchTab's relock-on-leaving — one PIN entry
  // authorizes exactly one payment, not an open-ended unlocked session.
  function addMoneyToPiggy(amount, note){
    const personId = state.selectedId;
    const p = ROSTER.find((r) => r.id === personId);
    const ps = state.people[personId];
    if (!(amount > 0)) {
      showToast('Enter an amount to add.', 'danger');
      return;
    }
    const cleanNote = (note || '').trim();
    piggyLedgerAdd(ps, amount, cleanNote || 'Added by a parent', null, dateKey(new Date()));
    logActivity(personId, `added &pound;${amount.toFixed(2)} to the piggy bank${cleanNote ? ` (${escapeHtml(cleanNote)})` : ''}`);
    saveState();
    settingsUnlocked = false;
    walletAction = null;
    render();
    showToast(`£${amount.toFixed(2)} added for ${p.name}.`, 'success');
  }

  // Withdraw always opens straight to its form. Add money opens straight to
  // its form too, UNLESS a family PIN is set and this session hasn't
  // unlocked it yet — then it opens the PIN prompt first.
  function openWalletAction(action){
    if (walletAction === action || (action === 'add' && (walletAction === 'addPin' || walletAction === 'addForm'))) {
      walletAction = null;
    } else if (action === 'add') {
      walletAction = (!state.settingsPin || settingsUnlocked) ? 'addForm' : 'addPin';
    } else {
      walletAction = action;
    }
    render();
  }

  function submitWalletPin(){
    const input = document.getElementById('walletPinInput');
    const val = (input.value || '').trim();
    if (val && val === state.settingsPin) {
      settingsUnlocked = true;
      walletAction = 'addForm';
      render();
    } else {
      showToast('Wrong PIN.', 'danger');
      if (input) { input.value = ''; input.focus(); }
    }
  }

  function closeWalletAction(){
    walletAction = null;
    render();
  }

  // Rolls yesterday's daily ticks and last week's weekly counts into banked
  // points + streaks, then clears them for the new day/week. Also awards the
  // once-a-year birthday bonus. Runs on load and again at local midnight.
  function rolloverIfNeeded(){
    const today = new Date();
    const todayKey = dateKey(today);
    const thisMonday = mondayKey(today);
    let changed = false;

    ROSTER.forEach((p) => {
      const ps = state.people[p.id];
      const defs = habitDefsOf(p.id);

      if (ps.lastResetDate !== todayKey) {
        const dailyDefs = defs.filter((h) => h.freq === 'daily');
        if (dailyDefs.length) {
          const doneCount = dailyDefs.filter((h) => habitStateOf(p.id, h.id).done).length;
          ps.dailyRatioHistory[ps.lastResetDate] = doneCount / dailyDefs.length;
        }
        const dayLog = {};
        dailyDefs.forEach((h) => {
          const hs = habitStateOf(p.id, h.id);
          dayLog[h.id] = hs.done;
          if (hs.done) { awardPoints(ps, h.points); hs.streak += 1; }
          else { hs.streak = 0; }
          hs.done = false;
        });
        ps.habitDayLog[ps.lastResetDate] = dayLog;
        // Keep ~9 weeks of history — plenty for the payout calc below and for
        // the calendar's 4-weeks-back view, bounded so it doesn't grow forever.
        const cutoff = addDaysKey(todayKey, -63);
        Object.keys(ps.dailyRatioHistory).forEach((k) => { if (k < cutoff) delete ps.dailyRatioHistory[k]; });
        Object.keys(ps.habitDayLog).forEach((k) => { if (k < cutoff) delete ps.habitDayLog[k]; });
        ps.lastResetDate = todayKey;
        changed = true;
      }

      if (ps.weekAnchor !== thisMonday) {
        const weeklyDefs = defs.filter((h) => h.freq === 'weekly');
        if (weeklyDefs.length) {
          const doneSum = weeklyDefs.reduce((sum, h) => sum + habitStateOf(p.id, h.id).count, 0);
          const targetSum = weeklyDefs.reduce((sum, h) => sum + h.target, 0);
          ps.weeklyRatioHistory[ps.weekAnchor] = targetSum ? doneSum / targetSum : 0;
        }
        weeklyDefs.forEach((h) => {
          const hs = habitStateOf(p.id, h.id);
          awardPoints(ps, hs.count * h.points);
          hs.streak = hs.count >= h.target ? hs.streak + 1 : 0;
          hs.count = 0;
        });
        const weeklyCutoff = addDaysKey(thisMonday, -63);
        Object.keys(ps.weeklyRatioHistory).forEach((k) => { if (k < weeklyCutoff) delete ps.weeklyRatioHistory[k]; });
        if (pocketWeeklyOf(p.id) > 0) {
          let sum = 0;
          for (let i = 0; i < 7; i++) sum += ps.dailyRatioHistory[addDaysKey(ps.weekAnchor, i)] || 0;
          const payout = roundMoney(pocketWeeklyOf(p.id) * (sum / 7));
          const pct = Math.round((sum / 7) * 100);
          piggyLedgerAdd(ps, payout, `Weekly allowance (${pct}% of habits done)`, `payout:${p.id}:${ps.weekAnchor}`, ps.weekAnchor);
          if (payout > 0) logActivity(p.id, `earned &pound;${payout.toFixed(2)} weekly allowance (${pct}% of habits done)`);
        }
        ps.weekAnchor = thisMonday;
        changed = true;
      }

      const bday = nextBirthdayInfo(p.birthday.month, p.birthday.day, today);
      if (bday.today) {
        const year = today.getFullYear();
        if (ps.bdayAwardedYear !== year) {
          awardPoints(ps, BIRTHDAY_BONUS);
          ps.bdayAwardedYear = year;
          logActivity(p.id, `earned +${BIRTHDAY_BONUS} pts birthday bonus`);
          changed = true;
        }
      }
    });

    if (changed) saveState();
  }

  function toggleHabit(personId, habitId){
    const def = habitDefOf(personId, habitId);
    const hs = habitStateOf(personId, habitId);
    if (def.freq === 'daily') {
      hs.done = !hs.done;
      logActivity(personId, hs.done ? `marked <b>${escapeHtml(def.name)}</b> done` : `unmarked <b>${escapeHtml(def.name)}</b>`);
    } else {
      hs.count = (hs.count + 1) % (def.target + 1);
      logActivity(personId, `logged <b>${escapeHtml(def.name)}</b> (${hs.count}/${def.target} this week)`);

    saveState();
    render();

  // A daily/automatic export isn't really possible from a static, server-less
  // page — there's no background process to run one, and iOS Safari can't
  // silently write files. So instead: a manual export/import, plus a quiet
  // nudge (a tab badge, not a popup) once it's been a while since the last one.
  const STALE_BACKUP_DAYS = 7;
  function daysSinceLastExport(){
    if (!state.lastExportAt) return Infinity;
    return (Date.now() - new Date(state.lastExportAt).getTime()) / 86400000;
  }
  // Don't nag a brand-new profile that has nothing worth backing up yet.
  function backupIsStale(){
    return state.activityLog.length > 0 && daysSinceLastExport() >= STALE_BACKUP_DAYS;
  }
  function lastExportLabel(){
    if (!state.lastExportAt) return 'Never backed up';
    const days = Math.floor(daysSinceLastExport());
    if (days <= 0) return 'Backed up today';
    if (days === 1) return 'Backed up 1 day ago';
    return `Backed up ${days} days ago`;
  }

  function exportBackup(){
    const payload = JSON.parse(JSON.stringify(state));
    payload.settingsPin = null; // don't let a shared/uploaded backup carry this device's PIN
    const json = JSON.stringify(payload, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `family-hq-backup-${dateKey(new Date())}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    state.lastExportAt = new Date().toISOString();
    saveState();
    render();
    showToast('Backup downloaded.', 'success');
  }

  // Writes the raw file into localStorage and reloads, rather than swapping
  // the in-memory state object directly, so loadState()'s existing per-field
  // migration/backfill logic runs on whatever the file actually contains —
  // same as it would for any other stored save, old format or new.
  function importBackupFile(file){
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); } catch (e) {
        showToast("That file isn't valid JSON.", 'danger');
        return;
      }
      const looksValid = parsed && typeof parsed === 'object'
        && parsed.people && typeof parsed.people === 'object'
        && ROSTER.every((p) => parsed.people[p.id]);
      if (!looksValid) {
        showToast("That doesn't look like a Family HQ backup.", 'danger');
        return;
      }
      if (!confirm('Replace all current data on this device with this backup? This cannot be undone.')) return;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed)); } catch (e) { /* ignore */ }
      location.reload();
    };
    reader.readAsText(file);
  }

  // Wipes everything back to a fresh install — for switching from testing to
  // real use. Export first is on the user; this doesn't force it.
  function resetAllData(){
    if (!confirm('Reset all data on this device back to zero? Points, streaks, history and settings for everyone will be lost. This cannot be undone.')) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
    location.reload();
  }

  // Habit-editor UI state — which habit (or 'new') is expanded for editing,
  // and its working copy of fields. Ephemeral, not persisted: always starts
  // closed on load.
  let habitEditingId = null;
  let habitDraft = null;

  function startHabitEdit(habitId){
    const h = habitDefOf(state.settingsFilterId, habitId);
    if (!h) return;
    habitEditingId = habitId;
    habitDraft = { name: h.name, freq: h.freq, target: h.target, points: h.points };
    render();
  }
  function startHabitAdd(){
    habitEditingId = 'new';
    habitDraft = { name: '', freq: 'daily', target: 1, points: 10 };
    render();
  }
  function cancelHabitEdit(){
    habitEditingId = null;
    habitDraft = null;
    render();
  }
  function saveHabitEdit(){
    const personId = state.settingsFilterId;
    if (!personId || !habitDraft) { cancelHabitEdit(); return; }
    const name = (habitDraft.name || '').trim();
    if (!name) { cancelHabitEdit(); return; }
    const defs = habitDefsOf(personId);
    if (habitEditingId === 'new') {
      const id = 'h_' + Date.now().toString(36);
      defs.push({ id, name, freq: habitDraft.freq, target: habitDraft.target, points: habitDraft.points });
      state.people[personId].habits.push({ id, done:false, count:0, streak:0 });
      logActivity(personId, `added a new habit: <b>${escapeHtml(name)}</b>`);
    } else {
      const h = defs.find((x) => x.id === habitEditingId);
      if (h) {
        h.name = name; h.freq = habitDraft.freq; h.target = habitDraft.target; h.points = habitDraft.points;
        logActivity(personId, `updated the habit: <b>${escapeHtml(name)}</b>`);
      }
    }
    habitEditingId = null;
    habitDraft = null;
    saveState();
    render();
  }
  function moveHabitDef(habitId, dir){
    const personId = state.settingsFilterId;
    const defs = habitDefsOf(personId);
    const idx = defs.findIndex((h) => h.id === habitId);
    const newIdx = idx + dir;
    if (idx === -1 || newIdx < 0 || newIdx >= defs.length) return;
    [defs[idx], defs[newIdx]] = [defs[newIdx], defs[idx]];
    saveState();
    render();
  }
  function deleteHabitDef(habitId){
    const personId = state.settingsFilterId;
    const defs = habitDefsOf(personId);
    const h = defs.find((x) => x.id === habitId);
    state.people[personId].habitDefs = defs.filter((x) => x.id !== habitId);
    state.people[personId].habits = state.people[personId].habits.filter((x) => x.id !== habitId);
    if (habitEditingId === habitId) { habitEditingId = null; habitDraft = null; }
    if (h) logActivity(personId, `removed the habit: <b>${escapeHtml(h.name)}</b>`);
    saveState();
    render();
  }
  function setHabitDraftFreq(freq){
    habitDraft = { ...habitDraft, freq };
    render();
  }
  function stepHabitDraft(field, delta){
    const current = habitDraft[field] != null ? habitDraft[field] : (field === 'target' ? 1 : 10);
    const val = current + delta;
    habitDraft = { ...habitDraft, [field]: field === 'target' ? Math.max(1, Math.min(7, val)) : Math.max(5, Math.min(50, val)) };
    render();
  }

    const t = document.getElementById('toast');
    t.textContent = msg;

  function redeemReward(rewardId){
    const personId = state.selectedId;
    const reward = REWARDS.find((r) => r.id === rewardId);
    const p = ROSTER.find((r) => r.id === personId);
    const points = computeSpendablePoints(personId);
    if (points < reward.cost) {
      showToast(`${p.name} needs ${reward.cost - points} more points for that.`, 'danger');
      return;
    }
    const ps = state.people[personId];
    ps.bankedPoints -= reward.cost;
    if (reward.cash) {
      piggyLedgerAdd(ps, reward.cash, `Redeemed: ${reward.name}`, null, dateKey(new Date()));
    } else {
      ps.rewardInventory[rewardId] = (ps.rewardInventory[rewardId] || 0) + 1;
    }
    logActivity(personId, `redeemed <b>${escapeHtml(reward.name)}</b> for ${reward.cost} pts`);
    saveState();
    render();
    showToast(`${reward.name} redeemed for ${p.name}!`, 'success');
  }

  // Redeeming buys a token with points; using it later is free and just
  // marks that one copy as claimed/cashed in — the two are separate actions
  // so "bought it" and "actually took the screen time" aren't conflated.
  function useReward(rewardId){
    const personId = state.selectedId;
    const reward = REWARDS.find((r) => r.id === rewardId);
    const p = ROSTER.find((r) => r.id === personId);
    const ps = state.people[personId];
    const owned = ps.rewardInventory[rewardId] || 0;
    if (owned <= 0) return;
    ps.rewardInventory[rewardId] = owned - 1;
    logActivity(personId, `used <b>${escapeHtml(reward.name)}</b>`);
    saveState();
    render();
    showToast(`${p.name} used ${reward.name}.`, 'success');
  }
