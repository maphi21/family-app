<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family HQ">
<meta name="theme-color" content="#ffc93c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffc93c'/%3E%3Cpath d='M32 14 L52 32 h-6 v18 H18 V32 h-6 Z' fill='%2322262b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Family HQ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');

  :root{
    --paper:#fffdf8;
    --ink:#22262b;
    --ink-secondary:#6b7280;
    --ink-faint:#a8afb8;
    --surface-card:#ffffff;
    --surface-sunken:#fef5e2;
    --track:#eef0f3;
    --shadow-card:0 2px 8px rgba(34,38,43,0.06), 0 8px 24px rgba(34,38,43,0.06);
  }
  *{
    box-sizing:border-box; -webkit-tap-highlight-color:transparent;
    user-select:none; -webkit-user-select:none;
  }
  html{ -webkit-touch-callout:none; }
  input, textarea{ user-select:text; -webkit-user-select:text; }
  body{
    margin:0; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background:var(--paper); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;
    padding-bottom:88px; /* clears the fixed bottom tab bar */
  }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 20px 48px; }
  .page{ display:none; }
  .page.active{ display:block; }

  .top-bar{ max-width:1180px; margin:0 auto; padding:24px 20px 0; }
  header.top{ display:flex; flex-direction:column; gap:2px; margin-bottom:16px; }
  .eyebrow{ font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); }
  .today{ font-size:16px; font-weight:600; color:var(--ink-secondary); }

  .switcher{ display:none; gap:14px; overflow-x:auto; padding:10px 6px 14px; }
  /* On Settings the switcher also drives who's being filtered/edited, so it
     stays visible there even on desktop, where Habits/Rewards hide it
     because the card grid already shows everyone. */
  body.is-settings .switcher{ display:flex; }
  .switcher-pill{ display:flex; flex-direction:column; align-items:center; gap:6px; flex-shrink:0; cursor:pointer; }
  .switcher-avatar{
    width:50px; height:50px; border-radius:999px; color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px;
    transition:all .15s;
  }
  .switcher-avatar.is-active{ width:60px; height:60px; font-size:22px; box-shadow:0 0 0 3px var(--paper), 0 0 0 6px var(--ring-color); }
  .switcher-label{ font-size:11px; font-weight:700; color:var(--ink-faint); }
  .switcher-label.is-active{ color:var(--ink); }

  .cards{ display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:18px; }
  .card{
    display:flex; flex-direction:column; gap:14px;
    background:var(--surface-card); border-radius:20px; padding:20px; box-shadow:var(--shadow-card);
  }

  .card-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .card-header-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .avatar{
    width:44px; height:44px; border-radius:999px; color:#fff; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px;
  }
  .person-name{ font-size:14.5px; font-weight:800; letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .person-role{ font-size:11px; font-weight:600; color:var(--ink-faint); }
  .card-header-right{ display:flex; flex-direction:column; align-items:flex-end; gap:2px; flex-shrink:0; }
  .rank-badge{
    display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:20px;
    padding:0 7px; border-radius:999px; font-size:11px; font-weight:800;
  }
  .points-stat{ font-size:9.5px; font-weight:600; color:var(--ink-faint); white-space:nowrap; }
  .points-stat b{ color:var(--ink-secondary); font-weight:800; }

  .bday-chip, .level-badge, .piggy-chip{
    display:inline-flex; align-items:center; gap:5px; align-self:flex-start;
    border-radius:999px; padding:4px 10px 4px 7px; font-size:10.5px; font-weight:700;
    max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .bday-chip svg, .level-badge svg, .piggy-chip svg{ flex-shrink:0; }
  .piggy-chip{ background:#eaf9ef; color:#1f7643; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }

  .level-block{ display:flex; flex-direction:column; gap:5px; }
  .level-bar-row{ display:flex; align-items:center; gap:8px; }
  .level-track{ flex:1; height:6px; background:var(--track); border-radius:999px; overflow:hidden; }
  .level-fill{ height:100%; border-radius:999px; transition:width .3s ease; }
  .level-caption{ font-size:9px; font-weight:700; color:var(--ink-faint); flex-shrink:0; white-space:nowrap; }

  .ring-holder{ display:flex; justify-content:center; }
  .ring-wrap{ position:relative; width:92px; height:92px; }
  .ring-outer{ width:100%; height:100%; border-radius:999px; transform:rotate(-90deg); }
  .ring-inner{
    position:absolute; inset:8px; border-radius:999px; background:var(--surface-card);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .ring-value{ font-size:17px; font-weight:800; line-height:1; }
  .ring-label{ font-size:8px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); margin-top:2px; }

  .habit-list{ display:flex; flex-direction:column; gap:6px; }
  .habit-row{ display:flex; align-items:center; gap:8px; background:var(--surface-sunken); border-radius:11px; padding:7px 9px; cursor:pointer; }
  .habit-indicator{
    width:18px; height:18px; border-radius:6px; flex-shrink:0; border:2px solid transparent;
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .habit-indicator--weekly{ width:auto; min-width:18px; padding:0 5px; font-size:9px; font-weight:800; }
  .habit-name{ flex:1; min-width:0; font-size:11.5px; font-weight:600; line-height:1.3; }
  .habit-streak{ display:inline-flex; align-items:center; gap:2px; flex-shrink:0; font-size:9.5px; font-weight:700; color:#a67800; }

  .cal{ margin-top:6px; }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .cal-title{ font-size:12px; font-weight:700; color:var(--ink-secondary); }
  .cal-streak{
    display:inline-flex; align-items:center; gap:4px; background:var(--surface-sunken);
    border-radius:999px; padding:3px 9px 3px 7px; font-size:10.5px; font-weight:700; color:#a67800;
  }
  .cal-dow{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:8px; }
  .cal-dow-label{ text-align:center; font-size:9px; font-weight:800; color:var(--ink-faint); text-transform:uppercase; }
  .cal-weeks{ display:flex; flex-direction:column; gap:8px; }
  .cal-week{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-cell-wrap{ display:flex; justify-content:center; position:relative; }
  .cal-month-tag{
    position:absolute; top:-8px; left:50%; transform:translateX(-50%); line-height:1;
    font-size:7px; font-weight:800; color:var(--ink-faint);
    text-transform:uppercase; letter-spacing:0.02em; white-space:nowrap;
  }
  .cal-cell{ position:relative; width:28px; height:28px; border-radius:999px; }
  .cal-cell.clickable{ cursor:pointer; }
  .cal-cell-ring{ width:100%; height:100%; border-radius:999px; transform:rotate(-90deg); }
  .cal-cell-num{
    position:absolute; inset:3px; border-radius:999px; background:var(--surface-card);
    display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700;
  }

  .cal-day-panel{
    margin-top:12px; padding-top:14px; border-top:1px solid var(--track);
    display:flex; flex-direction:column; gap:8px;
  }
  .cal-day-panel-head{ display:flex; align-items:center; justify-content:space-between; }
  .cal-day-panel-title{ font-size:13px; font-weight:800; color:var(--ink); }
  .cal-day-panel-close{
    width:26px; height:26px; border:none; background:var(--surface-sunken); border-radius:999px;
    display:flex; align-items:center; justify-content:center; color:var(--ink-secondary); cursor:pointer;
  }
  .cal-day-note{ font-size:11.5px; color:var(--ink-faint); font-style:italic; }
  .cal-day-row{
    display:flex; align-items:center; gap:10px; background:var(--surface-sunken);
    border-radius:11px; padding:9px 12px; cursor:pointer;
  }
  .cal-day-check{
    width:20px; height:20px; border-radius:6px; flex-shrink:0; border:2px solid transparent;
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .cal-day-name{ flex:1; font-size:13px; font-weight:600; color:var(--ink); }

  .page-sub{ font-size:13.5px; color:var(--ink-secondary); margin:0 0 18px; }
  .settings-sub-toggle{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    width:100%; text-align:left; font-family:inherit; background:none; border:none; padding:0; cursor:pointer;
  }
  .settings-sub-chevron{ flex-shrink:0; color:var(--ink-faint); display:flex; }

  .page-stats{ margin-bottom:18px; }
  .pts-available{ font-size:14px; font-weight:700; color:var(--ink); }
  .pts-available b{ font-weight:800; }
  .piggy-stats-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:4px; }
  .piggy-saved{ font-size:12.5px; font-weight:700; color:#1f7643; }
  .piggy-earned-tag{
    display:inline-flex; align-items:center; gap:5px;
    background:#eaf9ef; color:#1f7643; border-radius:999px; padding:3px 10px 3px 7px;
    font-size:10.5px; font-weight:700;
  }
  .piggy-earned-tag svg{ flex-shrink:0; }

  .wallet-strip{ display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
  .wallet-label{ font-size:11.5px; font-weight:700; color:var(--ink-secondary); text-transform:uppercase; letter-spacing:0.04em; }
  .wallet-list{ display:flex; flex-direction:column; gap:8px; }
  .wallet-chip{
    display:flex; align-items:center; gap:10px;
    background:#eaf9ef; border-radius:999px; padding:8px 8px 8px 16px;
  }
  .wallet-chip-name{ flex:1; min-width:0; font-size:13px; font-weight:700; color:#1f7643; }
  .wallet-use-btn{
    flex-shrink:0; font-family:inherit; font-size:12px; font-weight:800; color:#fff;
    background:#2a9c58; border:none; border-radius:999px; padding:8px 14px; cursor:pointer;
    transition:transform .12s ease;
  }
  .wallet-use-btn:active{ transform:scale(.96); }

  .reward-list{ display:flex; flex-direction:column; gap:8px; }
  .reward-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface-sunken); border-radius:14px; padding:12px 14px;
  }
  .reward-row-info{ display:flex; flex-direction:column; gap:5px; min-width:0; }
  .reward-row-name{ font-size:14px; font-weight:700; }
  .reward-row-costs{ display:flex; gap:6px; flex-wrap:wrap; }
  .reward-cost{
    display:inline-flex; align-items:center; gap:5px; background:var(--surface-card); color:#a67800;
    border-radius:999px; padding:4px 11px 4px 8px; font-size:12px; font-weight:700;
  }
  .reward-cash{
    display:inline-flex; align-items:center; gap:5px; background:#eaf9ef; color:#1f7643;
    border-radius:999px; padding:4px 11px 4px 8px; font-size:12px; font-weight:700;
  }

  .reward-row-btn{
    flex-shrink:0; font-family:inherit; font-size:12.5px; font-weight:700; color:var(--ink);
    background:#ffc93c; border:none; border-radius:999px; padding:10px 16px; cursor:pointer;
    transition:transform .12s ease;
  }
  .reward-row-btn:active{ transform:scale(.96); }
  .reward-row-btn:disabled{ opacity:.4; cursor:not-allowed; }

  .piggy-section{ margin-top:24px; padding-top:20px; border-top:1px solid var(--track); }
  .piggy-section-label{ font-size:15px; font-weight:800; margin-bottom:12px; }
  .withdraw-row{ display:flex; gap:8px; margin-bottom:18px; }
  .withdraw-input, .withdraw-note{
    font-family:inherit; color:var(--ink); border:1.5px solid var(--track); border-radius:999px;
    background:#fff; padding:10px 14px;
  }
  .withdraw-input{ width:84px; flex-shrink:0; font-size:13px; font-weight:700; }
  .withdraw-input:disabled, .withdraw-note:disabled{ opacity:.5; }
  .withdraw-note{ flex:1; min-width:0; font-size:13px; font-weight:500; }
  .withdraw-btn{
    flex-shrink:0; font-family:inherit; font-size:12.5px; font-weight:700; color:#fff;
    background:#2a9c58; border:none; border-radius:999px; padding:10px 18px; cursor:pointer;
    transition:transform .12s ease;
  }
  .withdraw-btn:active{ transform:scale(.96); }
  .withdraw-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .ledger-label{ font-size:11.5px; font-weight:700; color:var(--ink-secondary); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px; }
  .ledger-list{ display:flex; flex-direction:column; gap:2px; max-height:260px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .ledger-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:9px 2px; border-bottom:1px solid var(--track); font-size:12.5px;
  }
  .ledger-row:last-child{ border-bottom:none; }
  .ledger-reason{ flex:1; min-width:0; font-weight:600; color:var(--ink); display:flex; flex-direction:column; gap:1px; }
  .ledger-date{ font-size:10.5px; font-weight:600; color:var(--ink-faint); }
  .ledger-amount{ flex-shrink:0; font-weight:800; white-space:nowrap; }
  .ledger-in{ color:#2a9c58; }
  .ledger-out{ color:#e84e3d; }
  .ledger-toggle-btn{
    width:100%; margin-top:10px; padding:9px; border-radius:999px; border:1.5px dashed #d8dbe0;
    background:transparent; font-family:inherit; font-size:12.5px; font-weight:700; color:var(--ink-secondary); cursor:pointer;
  }
  .ledger-capped-note{ font-size:10.5px; color:var(--ink-faint); text-align:center; margin-top:8px; }

  .pocket-editor{ display:flex; flex-direction:column; gap:8px; margin-bottom:24px; padding-bottom:24px; border-bottom:1px solid var(--track); }
  .pocket-editor .withdraw-row{ margin-bottom:0; }
  .pocket-editor-note{ font-size:11.5px; color:var(--ink-faint); line-height:1.4; }

  .pin-gate{
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px;
    padding:8px 20px 20px;
  }
  .pin-gate-icon{
    width:48px; height:48px; border-radius:999px; background:var(--surface-sunken);
    display:flex; align-items:center; justify-content:center; color:#a67800; margin-bottom:2px;
  }
  .pin-gate-title{ font-size:16px; font-weight:800; color:var(--ink); }
  .pin-gate-sub{ font-size:13px; color:var(--ink-faint); margin-bottom:8px; }
  .pin-input{
    width:140px; text-align:center; letter-spacing:0.3em; font-size:18px; font-weight:800;
    font-family:inherit; color:var(--ink); border:1.5px solid var(--track); border-radius:999px;
    background:#fff; padding:12px 14px; outline:none;
  }
  .pin-unlock-btn{
    font-family:inherit; font-size:13px; font-weight:700; color:#fff; background:var(--ink);
    border:none; border-radius:999px; padding:11px 22px; cursor:pointer; transition:transform .12s ease;
  }
  .pin-unlock-btn:active{ transform:scale(.96); }

  .security-section{ margin-top:24px; padding-top:20px; border-top:1px solid var(--track); }
  .security-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .security-note{ font-size:12.5px; font-weight:600; color:var(--ink-secondary); }
  .security-btn{
    flex-shrink:0; font-family:inherit; font-size:12px; font-weight:700; color:#e84e3d;
    background:var(--surface-sunken); border:none; border-radius:999px; padding:9px 16px; cursor:pointer;
  }

  .activity-list{
    display:flex; flex-direction:column;
    background:var(--surface-card); border-radius:16px; padding:4px 16px; box-shadow:var(--shadow-card);
  }
  .activity-row{
    display:flex; align-items:flex-start; gap:12px;
    padding:12px 0; border-bottom:1px solid var(--track);
  }
  .activity-row:last-child{ border-bottom:none; }
  .activity-avatar{ width:28px; height:28px; font-size:11px; flex-shrink:0; margin-top:1px; }
  .activity-body{ flex:1; min-width:0; }
  .activity-msg{ font-size:13px; font-weight:600; color:var(--ink); line-height:1.4; }
  .activity-msg b{ font-weight:800; }
  .activity-time{ font-size:11px; font-weight:600; color:var(--ink-faint); margin-top:2px; }
  .activity-empty{ font-size:13px; color:var(--ink-faint); text-align:center; padding:32px 0; }

  .lb-list{ display:flex; flex-direction:column; gap:10px; }
  .lb-row{
    display:flex; align-items:center; gap:14px;
    background:var(--surface-card); border-radius:16px; padding:14px 16px; box-shadow:var(--shadow-card);
  }
  .lb-rank{
    width:28px; height:28px; border-radius:999px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800; background:var(--track); color:var(--ink-secondary);
  }
  .lb-rank.first{ background:#ffc93c; color:#22262b; }
  .lb-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .lb-info .level-badge{ white-space:normal; line-height:1.3; align-items:flex-start; }
  .lb-info .level-badge svg{ margin-top:2px; }
  .lb-name-row{ display:flex; align-items:baseline; gap:7px; }
  .lb-name{ font-size:14.5px; font-weight:800; letter-spacing:-0.01em; }
  .lb-level-num{ font-size:11px; font-weight:700; color:var(--ink-faint); }
  .lb-bar-track{ height:7px; background:var(--track); border-radius:999px; overflow:hidden; }
  .lb-bar-fill{ height:100%; border-radius:999px; transition:width .3s ease; }
  .lb-points{ display:flex; flex-direction:column; align-items:flex-end; gap:1px; flex-shrink:0; }
  .lb-total{ font-size:16px; font-weight:800; color:var(--ink); white-space:nowrap; }
  .lb-now{ font-size:10.5px; font-weight:600; color:var(--ink-faint); white-space:nowrap; }

  .habit-editor{ display:flex; flex-direction:column; gap:14px; margin-bottom:24px; padding-bottom:24px; border-bottom:1px solid var(--track); }
  .habit-editor-heading{ font-size:15px; font-weight:800; color:var(--ink); }
  .habit-editor-list{ display:flex; flex-direction:column; gap:8px; }
  .habit-editor-row{
    display:flex; align-items:center; gap:10px;
    background:var(--surface-sunken); border-radius:14px; padding:10px 10px 10px 8px;
  }
  .habit-editor-reorder{ display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
  .habit-move-btn{
    width:24px; height:20px; border:none; background:var(--surface-card); border-radius:6px;
    display:flex; align-items:center; justify-content:center; color:var(--ink-secondary); cursor:pointer;
  }
  .habit-move-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .habit-editor-info{ flex:1; min-width:0; }
  .habit-editor-name{ font-size:15px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .habit-editor-meta{ font-size:12px; font-weight:600; color:var(--ink-secondary); margin-top:2px; }
  .habit-edit-btn, .habit-delete-btn{
    width:32px; height:32px; border:none; background:var(--surface-card); border-radius:999px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .habit-edit-btn{ color:#3d434b; }
  .habit-delete-btn{ color:#e84e3d; }
  .habit-add-btn{
    padding:13px; border-radius:14px; border:1.5px dashed #d8dbe0; background:transparent;
    font-family:inherit; font-size:13.5px; font-weight:700; color:var(--ink-secondary); cursor:pointer;
  }
  .habit-form{
    display:flex; flex-direction:column; gap:14px;
    background:var(--surface-card); border-radius:16px; padding:18px; box-shadow:var(--shadow-card);
  }
  .habit-form-label{ font-size:11px; font-weight:700; color:var(--ink-secondary); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px; }
  .habit-form-input{
    width:100%; font-family:inherit; font-size:14px; font-weight:600; color:var(--ink);
    padding:10px 14px; border-radius:12px; border:1.5px solid var(--track); background:var(--paper); outline:none;
  }
  .habit-form-toggle{ display:flex; gap:8px; }
  .habit-freq-btn{
    flex:1; padding:9px; border-radius:999px; border:none; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer;

<body>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  const STORAGE_KEY = 'familyHQ_profile_v1';
  const HABIT_POINTS = 10;
  const BIRTHDAY_BONUS = 100;
  const SHOW_BDAY_WITHIN_DAYS = 60;
  const LEVEL_BASE_PTS = 150;
  const LEVEL_GROWTH = 1.25;
  const LEVEL_TITLES = ['Sock drawer sergeant', 'Duty deputy', 'Chore cadet', 'Tidy titan', 'Household hero', 'Domestic dynamo', 'Grand vizier of vacuuming'];

  // pocketWeekly: £ target per week, scaled by that week's daily-habit
  // completion ratio (see weeklyRatioSoFar / rolloverIfNeeded). 0 = no allowance.
  const ROSTER = [
    { id:'matt', name:'Matt', role:'Parent', initial:'M', color:'#2fa9e5', birthday:{ month:3, day:21 }, pocketWeekly:0,
      habits:[
        { id:'vitamins', name:'Take vitamins', freq:'daily' },
        { id:'exercise', name:'Exercise 20 min', freq:'weekly', target:3 },
        { id:'winddown', name:'Screen-free wind down', freq:'daily' },
      ] },
    { id:'jemma', name:'Jemma', role:'Parent', initial:'J', color:'#9b6bf0', birthday:{ month:8, day:13 }, pocketWeekly:0,
      habits:[
        { id:'vitamins', name:'Take vitamins', freq:'daily' },
        { id:'exercise', name:'Exercise 20 min', freq:'weekly', target:3 },
        { id:'tidy', name:'Tidy your space', freq:'daily' },
      ] },
    { id:'henry', name:'Henry', role:'Kid', initial:'H', color:'#3dbe72', birthday:{ month:9, day:19 }, pocketWeekly:5,
      habits:[
        { id:'vitamins', name:'Take vitamins', freq:'daily' },
        { id:'brush', name:'Brush teeth', freq:'daily' },
        { id:'read', name:'Read 20 minutes', freq:'daily' },
        { id:'room', name:'Tidy your room', freq:'daily' },
      ] },
    { id:'ted', name:'Ted', role:'Kid', initial:'T', color:'#ff6b5b', birthday:{ month:3, day:2 }, pocketWeekly:5,
      habits:[
        { id:'vitamins', name:'Take vitamins', freq:'daily' },
        { id:'brush', name:'Brush teeth', freq:'daily' },
        { id:'read', name:'Read 20 minutes', freq:'daily' },
      ] },
    { id:'lorraine', name:'Lorraine', role:'Grandma', initial:'L', color:'#ec6a9c', birthday:{ month:6, day:28 }, pocketWeekly:0,
      habits:[
        { id:'walk', name:'Afternoon walk', freq:'weekly', target:5 },
        { id:'call', name:'Call a grandchild', freq:'weekly', target:1 },
        { id:'puzzle', name:'Puzzle or crossword', freq:'daily' },
      ] },
  ];

  function pad2(n){ return n < 10 ? '0' + n : '' + n; }
  function dateKey(d){ return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
  function mondayKey(d){
    const dow = (d.getDay() + 6) % 7;
    const m = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow);
    return dateKey(m);
  }
  function addDaysKey(k, n){
    const [y, m, d] = k.split('-').map(Number);
    return dateKey(new Date(y, m - 1, d + n));
  }
  function roundMoney(n){ return Math.round(n * 100) / 100; }

  function defaultPersonState(){
    const today = new Date();
    return {
      bankedPoints: 0, // spendable currency — goes down when a reward is redeemed
      totalBanked: 0,  // lifetime points ever earned; never decreases from spending, but a
                        // retroactive correction to a past day (see setHabitDoneOnDay) can
                        // adjust it — that's fixing an error in the record, not spending.
      piggyLedger: [], // append-only real-money history: {id, delta, reason, at, dateKey} —
                        // current balance and lifetime-earned are both derived from this, see
                        // piggyBalance / piggyEarnedTotal.
      dailyRatioHistory: {}, // dateKey -> that day's daily-habit completion ratio (0..1)
      habitDayLog: {}, // dateKey -> {habitId: done} — per-habit detail for past days, feeds
                        // the calendar and lets a past day be individually corrected.
      rewardInventory: {}, // rewardId -> how many bought-but-not-yet-used are owned
      lastResetDate: dateKey(today),
      weekAnchor: mondayKey(today),
      bdayAwardedYear: null,
      habits: [],
    };
  }

  // A reward without `cash` is a privilege (points only); one with `cash`
  // also credits that amount to the redeemer's piggy bank ledger.
  const REWARDS = [
    { id:'r_dinner', name:'Choose Friday dinner', cost:50 },
    { id:'r_screen30', name:'Extra 30 min screen time', cost:30 },
    { id:'r_late15', name:'Stay up 15 min late', cost:25 },
    { id:'r_movie', name:'Pick the family movie', cost:40 },
    { id:'r_chorepass', name:'Skip one chore (free pass)', cost:60 },
    { id:'r_cash5', name:'£5 pocket money', cost:120, cash:5 },
  ];

  function habitDefsOf(personId){
    return state.people[personId].habitDefs;
  }
  function habitDefOf(personId, habitId){
    return habitDefsOf(personId).find((h) => h.id === habitId);
  }
  function habitStateOf(personId, habitId){
    return state.people[personId].habits.find((h) => h.id === habitId);
  }
  function pocketWeeklyOf(personId){
    return state.people[personId].pocketWeekly;
  }

  function loadState(){
    let saved = null;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) saved = JSON.parse(raw);
    } catch (e) { /* localStorage unavailable — fall through to fresh state */ }

    const s = { people:{}, selectedId:null, activityLog:(saved && Array.isArray(saved.activityLog)) ? saved.activityLog : [] };
    ROSTER.forEach((p) => {
      s.people[p.id] = (saved && saved.people && saved.people[p.id]) || defaultPersonState();
      // Migrate saves from before the ledger existed: seed one opening entry per
      // non-zero legacy balance so nothing is lost, then the ledger drives everything.
      if (!Array.isArray(s.people[p.id].piggyLedger)) {
        const openingPocket = s.people[p.id].piggyPocket || 0;
        const openingReward = s.people[p.id].piggyReward || 0;
        s.people[p.id].piggyLedger = [];
        if (openingPocket) piggyLedgerAdd(s.people[p.id], openingPocket, 'Weekly allowance (migrated balance)', `opening:${p.id}:pocket`);
        if (openingReward) piggyLedgerAdd(s.people[p.id], openingReward, 'Reward cash-outs (migrated balance)', `opening:${p.id}:reward`);
        delete s.people[p.id].piggyPocket;
        delete s.people[p.id].piggyReward;
      }
      if (typeof s.people[p.id].totalBanked !== 'number') s.people[p.id].totalBanked = s.people[p.id].bankedPoints;
      if (!s.people[p.id].rewardInventory || typeof s.people[p.id].rewardInventory !== 'object') s.people[p.id].rewardInventory = {};
      if (!s.people[p.id].dailyRatioHistory || typeof s.people[p.id].dailyRatioHistory !== 'object') s.people[p.id].dailyRatioHistory = {};
      if (!s.people[p.id].habitDayLog || typeof s.people[p.id].habitDayLog !== 'object') s.people[p.id].habitDayLog = {};
      // Weekly pocket-money target used to be fixed in ROSTER; editable now
      // from Settings, so it lives in state — seeded once from ROSTER.
      if (typeof s.people[p.id].pocketWeekly !== 'number') s.people[p.id].pocketWeekly = p.pocketWeekly;
      // Habit *definitions* (name/frequency/target/points) used to be fixed
      // in ROSTER; they're editable now, so they live in state — seeded once
      // from ROSTER's list as that person's starting habits.
      if (!Array.isArray(s.people[p.id].habitDefs)) {
        s.people[p.id].habitDefs = p.habits.map((h) => ({ id:h.id, name:h.name, freq:h.freq, target:h.target || 1, points:HABIT_POINTS }));
      }
      s.people[p.id].habitDefs.forEach((h) => {
        if (!s.people[p.id].habits.find((x) => x.id === h.id)) {
          s.people[p.id].habits.push({ id:h.id, done:false, count:0, streak:0 });
        }
      });
    });
    s.selectedId = (saved && saved.selectedId && ROSTER.some((p) => p.id === saved.selectedId))
      ? saved.selectedId
      : ROSTER[0].id;
    // Independent of selectedId (which is "who am I acting as" on Habits/Rewards) —
    // this just filters the Settings activity feed. null = show everyone.
    s.settingsFilterId = (saved && saved.settingsFilterId && ROSTER.some((p) => p.id === saved.settingsFilterId))
      ? saved.settingsFilterId
      : null;
    // Family-wide PIN gating the Settings tab. null = no PIN set, page is open.
    s.settingsPin = (saved && typeof saved.settingsPin === 'string' && saved.settingsPin) ? saved.settingsPin : null;
    return s;
  }

  function saveState(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  let state = loadState();
  // Not persisted — a PIN unlocks Settings for the rest of this session only;
  // a fresh page load (or reload) re-locks it if a PIN is set.
  let settingsUnlocked = false;

  function nextBirthdayInfo(month, day, today){
    const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    let target = new Date(todayMid.getFullYear(), month - 1, day);
    if (target < todayMid) target = new Date(todayMid.getFullYear() + 1, month - 1, day);
    const diffDays = Math.round((target - todayMid) / 86400000);
    if (diffDays === 0) return { today:true, diffDays:0 };
    if (diffDays < 30) return { today:false, mode:'days', diffDays };
    let months = (target.getFullYear() - todayMid.getFullYear()) * 12 + (target.getMonth() - todayMid.getMonth());
    if (target.getDate() < todayMid.getDate()) months--;
    const afterMonths = new Date(todayMid.getFullYear(), todayMid.getMonth() + months, todayMid.getDate());
    const weeks = Math.floor(Math.round((target - afterMonths) / 86400000) / 7);
    return { today:false, mode:'months', months, weeks, diffDays };
  }

  function formatBirthday(info){
    if (info.today) return `Birthday today! +${BIRTHDAY_BONUS} pts`;
    if (info.mode === 'days') return `${info.diffDays} day${info.diffDays === 1 ? '' : 's'} to go`;
    const parts = [];
    if (info.months > 0) parts.push(`${info.months} month${info.months === 1 ? '' : 's'}`);
    if (info.weeks > 0) parts.push(`${info.weeks} week${info.weeks === 1 ? '' : 's'}`);
    return parts.join(', ');
  }

  function computeLevel(points){
    let lvl = 1, into = points, span = LEVEL_BASE_PTS;
    while (into >= span) { into -= span; lvl++; span = Math.round(span * LEVEL_GROWTH); }
    return { level:lvl, into, span };
  }

  function tint(hex, alpha){
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
  }

  function ringGradient(percent, color){
    if (percent <= 0) return '#eef0f3';
    if (percent >= 100) return color;
    return `conic-gradient(${color} 0% ${percent}%, #eef0f3 ${percent}% 100%)`;
  }

  // Whatever's checked off right now but hasn't rolled over into a banked
  // total yet — contributes equally to both the spendable and lifetime pools.
  function liveContribution(personId){
    let live = 0;
    habitDefsOf(personId).forEach((h) => {
      const hs = habitStateOf(personId, h.id);
      if (h.freq === 'daily') { if (hs.done) live += h.points; }
      else { live += hs.count * h.points; }
    });
    return live;
  }

  // Spendable currency: goes up when habits are ticked, down when a reward
  // is redeemed. This is what "can they afford it" checks against.
  function computeSpendablePoints(personId){
    return state.people[personId].bankedPoints + liveContribution(personId);
  }

  // Lifetime total: never decreases, even when points are spent. Drives
  // level/rank so redeeming a reward doesn't undo someone's progress.
  function computeTotalPoints(personId){
    return state.people[personId].totalBanked + liveContribution(personId);
  }

  // Credits an amount to both pools at once — the only way points are earned,
  // so the two totals can never drift apart.
  function awardPoints(ps, amount){
    ps.bankedPoints += amount;
    ps.totalBanked += amount;
  }

  const CALENDAR_WEEKS_BACK = 4;
  const CALENDAR_WEEKS_FORWARD = 1;

  // { done, total } of daily habits for one day. Today is read live off
  // current habit state (it's still changing); a past day comes from the
  // per-habit log where one exists. A day whose log predates this feature
  // (only the old aggregate ratio survives) falls back to that ratio against
  // today's habit count — close enough for display, but not editable, since
  // there's no per-habit detail to show or correct.
  function dayCompletion(personId, dateKeyStr){
    const ps = state.people[personId];
    const dailyDefs = habitDefsOf(personId).filter((h) => h.freq === 'daily');
    const total = dailyDefs.length;
    if (dateKeyStr === ps.lastResetDate) {
      const done = dailyDefs.filter((h) => habitStateOf(personId, h.id).done).length;
      return { done, total, editable: true };
    }
    const log = ps.habitDayLog[dateKeyStr];
    if (log) {
      const done = dailyDefs.filter((h) => log[h.id]).length;
      return { done, total, editable: true };
    }
    if (dateKeyStr in ps.dailyRatioHistory) {
      const ratio = ps.dailyRatioHistory[dateKeyStr];
      return { done: Math.round(ratio * total), total, editable: false };
    }
    return { done: null, total, editable: false }; // no record at all
  }

  // Walks backward from a day, counting consecutive done days — used to
  // resync a habit's stored streak after a past day is corrected, since the
  // normal incremental +1/reset-to-0 only runs forward at daily rollover.
  function recomputeHabitStreak(personId, habitId, fromDateKeyExclusive){
    const ps = state.people[personId];
    let streak = 0;
    let cursor = addDaysKey(fromDateKeyExclusive, -1);
    while (true) {
      const log = ps.habitDayLog[cursor];
      if (!log || !log[habitId]) break;
      streak++;
      cursor = addDaysKey(cursor, -1);
    }
    return streak;
  }

  // Corrects a single habit's done state on a past day. Adjusts points by
  // exactly the delta (a correction, not a spend — see totalBanked's note)
  // and re-derives the habit's streak from history rather than nudging the
  // stored counter, since the edit can land anywhere in the run.
  function setHabitDoneOnDay(personId, habitId, dateKeyStr, newDone){
    const ps = state.people[personId];
    const def = habitDefOf(personId, habitId);
    if (!def || def.freq !== 'daily') return;
    if (dateKeyStr >= ps.lastResetDate) return; // today+ isn't edited this way

    if (!ps.habitDayLog[dateKeyStr]) ps.habitDayLog[dateKeyStr] = {};
    const dayLog = ps.habitDayLog[dateKeyStr];
    const oldDone = !!dayLog[habitId];
    if (oldDone === newDone) return;
    dayLog[habitId] = newDone;

    awardPoints(ps, (newDone ? 1 : -1) * def.points);
    ps.bankedPoints = Math.max(0, ps.bankedPoints);
    ps.totalBanked = Math.max(0, ps.totalBanked);

    const dailyDefs = habitDefsOf(personId).filter((h) => h.freq === 'daily');
    if (dailyDefs.length) {
      const doneCount = dailyDefs.filter((h) => dayLog[h.id]).length;
      ps.dailyRatioHistory[dateKeyStr] = doneCount / dailyDefs.length;
    }

    const hs = habitStateOf(personId, habitId);
    hs.streak = recomputeHabitStreak(personId, habitId, ps.lastResetDate);

    const dateLabel = parseDateKeyToDate(dateKeyStr).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
    logActivity(personId, `corrected ${dateLabel}: ${newDone ? 'marked' : 'unmarked'} <b>${escapeHtml(def.name)}</b>`);
  }

  function parseDateKeyToDate(k){
    const [y, m, d] = k.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  // Weekly pocket money, adapted from the original prototype: each day
  // contributes at most 1/7th of the week's allowance, so it builds up
  // gradually rather than all-or-nothing. Only daily habits count toward the
  // ratio — a weekly-target habit isn't a "today" concept, so it earns its
  // own points but doesn't feed this. Past days come from the archived
  // history; today is read live so the estimate updates as habits are ticked;
  // future days in the week simply haven't contributed yet.
  function weeklyRatioSoFar(personId){
    const ps = state.people[personId];
    const dailyDefs = habitDefsOf(personId).filter((h) => h.freq === 'daily');
    const todayKeyStr = dateKey(new Date());
    let sum = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDaysKey(ps.weekAnchor, i);
      if (d === todayKeyStr) {
        sum += dailyDefs.length ? dailyDefs.filter((h) => habitStateOf(personId, h.id).done).length / dailyDefs.length : 0;
      } else if (d < todayKeyStr) {
        sum += ps.dailyRatioHistory[d] || 0;
      }
    }
    return sum / 7;
  }

  // Live "building" estimate for the week in progress — shown on the profile
  // card. Not yet banked; only credited to the ledger at the week's rollover.
  function weeklyEstimate(personId){
    return roundMoney(pocketWeeklyOf(personId) * weeklyRatioSoFar(personId));
  }

  const MAX_ACTIVITY_LOG = 150;
  const LEDGER_DEFAULT_ROWS = 10;
  const LEDGER_MAX_ROWS = 100;
  // Ephemeral, not persisted — which person's piggy ledger is expanded past
  // the default 10 rows. Resets to collapsed on reload.
  let ledgerExpanded = {};
  // Ephemeral, not persisted — whether the Settings body (everything below
  // the subheading) is expanded. Starts collapsed so the page opens tidy.
  let settingsBodyExpanded = false;
  // Family-wide, not per-person — the settings-page ledger of everything
  // that's happened. Newest first; trimmed so storage doesn't grow forever.
  function logActivity(personId, msg){
    state.activityLog.unshift({ personId, msg, at: new Date().toISOString() });
    if (state.activityLog.length > MAX_ACTIVITY_LOG) state.activityLog.length = MAX_ACTIVITY_LOG;
  }

  // Writing the same id again *replaces* that entry rather than duplicating —
  // makes system-generated entries (a weekly payout) safe to re-apply, since a
  // retried or re-run payout corrects in place instead of double-paying.
  // Manual entries (redemptions, withdrawals) get a random id, each its own event.
  function piggyLedgerAdd(ps, delta, reason, id, entryDateKey){
    delta = roundMoney(delta);
    if (delta === 0 && id == null) return;
    const entry = {
      id: id || `piggy_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
      delta, reason, at: new Date().toISOString(), dateKey: entryDateKey || dateKey(new Date()),
    };
    const idx = ps.piggyLedger.findIndex((e) => e.id === entry.id);
    if (idx !== -1) ps.piggyLedger[idx] = entry; else ps.piggyLedger.push(entry);
  }

  // Current spendable balance — goes up on a payout/redemption, down on a
  // withdrawal. Just the ledger summed.
  function piggyBalance(personId){
    return roundMoney((state.people[personId].piggyLedger || []).reduce((a, e) => a + e.delta, 0));
  }

  // Lifetime total ever earned — sums only the credits, so withdrawing money
  // never reduces it. This is the "total earned" figure.
  function piggyEarnedTotal(personId){
    return roundMoney((state.people[personId].piggyLedger || []).filter((e) => e.delta > 0).reduce((a, e) => a + e.delta, 0));
  }

  // Whether the piggy bank is worth showing at all for this person: either
  // they're eligible for a weekly allowance (even at £0.00 so far), or
  // they've earned money some other way (redeeming a cash reward).
  function piggyEligible(personId){
    return pocketWeeklyOf(personId) > 0 || piggyEarnedTotal(personId) > 0;
  }

  function drawDownPiggy(amount, note){
    const personId = state.selectedId;
    const p = ROSTER.find((r) => r.id === personId);
    const ps = state.people[personId];
    const balance = piggyBalance(personId);
    if (!(amount > 0) || amount > balance + 0.001) {
      showToast(`Enter an amount up to £${balance.toFixed(2)}.`, 'danger');
      return;
    }
    const cleanNote = (note || '').trim();
    piggyLedgerAdd(ps, -amount, cleanNote || 'Withdrawn', null, dateKey(new Date()));
    logActivity(personId, `withdrew &pound;${amount.toFixed(2)} from the piggy bank${cleanNote ? ` (${escapeHtml(cleanNote)})` : ''}`);
    saveState();
    render();
    showToast(`£${amount.toFixed(2)} withdrawn for ${p.name}.`, 'success');
  }

  // Rolls yesterday's daily ticks and last week's weekly counts into banked
  // points + streaks, then clears them for the new day/week. Also awards the
  // once-a-year birthday bonus. Runs on load and again at local midnight.
  function rolloverIfNeeded(){
    const today = new Date();
    const todayKey = dateKey(today);
    const thisMonday = mondayKey(today);
    let changed = false;

    ROSTER.forEach((p) => {
      const ps = state.people[p.id];
      const defs = habitDefsOf(p.id);

      if (ps.lastResetDate !== todayKey) {
        const dailyDefs = defs.filter((h) => h.freq === 'daily');
        if (dailyDefs.length) {
          const doneCount = dailyDefs.filter((h) => habitStateOf(p.id, h.id).done).length;
          ps.dailyRatioHistory[ps.lastResetDate] = doneCount / dailyDefs.length;
        }
        const dayLog = {};
        dailyDefs.forEach((h) => {
          const hs = habitStateOf(p.id, h.id);
          dayLog[h.id] = hs.done;
          if (hs.done) { awardPoints(ps, h.points); hs.streak += 1; }
          else { hs.streak = 0; }
          hs.done = false;
        });
        ps.habitDayLog[ps.lastResetDate] = dayLog;
        // Keep ~9 weeks of history — plenty for the payout calc below and for
        // the calendar's 4-weeks-back view, bounded so it doesn't grow forever.
        const cutoff = addDaysKey(todayKey, -63);
        Object.keys(ps.dailyRatioHistory).forEach((k) => { if (k < cutoff) delete ps.dailyRatioHistory[k]; });
        Object.keys(ps.habitDayLog).forEach((k) => { if (k < cutoff) delete ps.habitDayLog[k]; });
        ps.lastResetDate = todayKey;
        changed = true;
      }

      if (ps.weekAnchor !== thisMonday) {
        defs.filter((h) => h.freq === 'weekly').forEach((h) => {
          const hs = habitStateOf(p.id, h.id);
          awardPoints(ps, hs.count * h.points);
          hs.streak = hs.count >= h.target ? hs.streak + 1 : 0;
          hs.count = 0;
        });
        if (pocketWeeklyOf(p.id) > 0) {
          let sum = 0;
          for (let i = 0; i < 7; i++) sum += ps.dailyRatioHistory[addDaysKey(ps.weekAnchor, i)] || 0;
          const payout = roundMoney(pocketWeeklyOf(p.id) * (sum / 7));
          const pct = Math.round((sum / 7) * 100);
          piggyLedgerAdd(ps, payout, `Weekly allowance (${pct}% of habits done)`, `payout:${p.id}:${ps.weekAnchor}`, ps.weekAnchor);
          if (payout > 0) logActivity(p.id, `earned &pound;${payout.toFixed(2)} weekly allowance (${pct}% of habits done)`);
        }
        ps.weekAnchor = thisMonday;
        changed = true;
      }

      const bday = nextBirthdayInfo(p.birthday.month, p.birthday.day, today);
      if (bday.today) {
        const year = today.getFullYear();
        if (ps.bdayAwardedYear !== year) {
          awardPoints(ps, BIRTHDAY_BONUS);
          ps.bdayAwardedYear = year;
          logActivity(p.id, `earned +${BIRTHDAY_BONUS} pts birthday bonus`);
          changed = true;
        }
      }
    });

    if (changed) saveState();
  }

  function redeemReward(rewardId){
    const personId = state.selectedId;

    const points = computeSpendablePoints(personId);
    if (points < reward.cost) {

    ps.bankedPoints -= reward.cost;

  function useReward(rewardId){

  // dateKey the calendar is expanded to, per person — at most one open at a

  const expandedCalendarDay = {};

  function calendarRingGradient(percent, color){
    if (percent <= 0) return '#eef0f3';
    if (percent >= 100) return color;
    return `conic-gradient(${color} 0% ${percent}%, #eef0f3 ${percent}% 100%)`;

  function renderCalendar(p){
    const today = new Date();
    const todayKeyStr = dateKey(today);
    const gridStart = addDaysKey(mondayKey(today), -7 * CALENDAR_WEEKS_BACK);
    const totalDays = 7 * (CALENDAR_WEEKS_BACK + 1 + CALENDAR_WEEKS_FORWARD);

    // "Full days in a row" streak, walking back from yesterday (today's own
    // in-progress state is shown separately by the ring above) — bounded
    // only by how far back per-day records actually exist, not by the
    // visible 4-week grid, so it doesn't understate a longer real streak.
    let streak = 0;
    let cursor = addDaysKey(todayKeyStr, -1);
    while (true) {
      const c = dayCompletion(p.id, cursor);
      if (c.total === 0 || c.done === null || c.done !== c.total) break;
      streak++;
      cursor = addDaysKey(cursor, -1);
    }

    const dowHtml = ['M', 'T', 'W', 'T', 'F', 'S', 'S']
      .map((l) => `<div class="cal-dow-label">${l}</div>`).join('');

    let weeksHtml = '';
    for (let w = 0; w * 7 < totalDays; w++) {
      let rowHtml = '';
      for (let d = 0; d < 7; d++) {
        const off = w * 7 + d;
        const k = addDaysKey(gridStart, off);
        const date = parseDateKeyToDate(k);
        const isToday = k === todayKeyStr;
        const isFuture = k > todayKeyStr;
        const c = dayCompletion(p.id, k);
        const percent = c.total ? Math.round((c.done / c.total) * 100) : 0;
        const hasRecord = c.done !== null;
        // Today isn't editable here — it already has its own tap-to-toggle
        // checkboxes in the habit list above; this cell is display-only.
        const clickable = !isFuture && !isToday && hasRecord && c.total > 0;

        let ring = '#ffffff', border = 'none';
        if (isFuture) { border = '1.5px dashed #a8afb8'; }
        else if (!hasRecord) { border = '1.5px dotted #d8dbe0'; }
        else { ring = calendarRingGradient(percent, p.color); }

        const isMonthStart = date.getDate() === 1;
        const monthTag = isMonthStart
          ? `<div class="cal-month-tag">${date.toLocaleDateString('en-GB', { month:'short' })}</div>`
          : '';
        const todayShadow = isToday ? 'box-shadow:0 0 0 2px #22262b;' : '';
        const opacity = isFuture ? 'opacity:.55;' : '';

        rowHtml += `<div class="cal-cell-wrap">`
          + monthTag
          + `<div class="cal-cell ${clickable ? 'clickable' : ''}" data-person="${p.id}" data-date="${k}" style="${todayShadow}${opacity}">`
          +   `<div class="cal-cell-ring" style="background:${ring};border:${border};"></div>`
          +   `<div class="cal-cell-num">${date.getDate()}</div>`
          + `</div>`
          + `</div>`;
      }
      weeksHtml += `<div class="cal-week">${rowHtml}</div>`;
    }

    return `<div class="cal-head">`
      +   `<div class="cal-title">Last ${CALENDAR_WEEKS_BACK} weeks</div>`
      +   `<div class="cal-streak">${flameSvg()}${streak}d full</div>`
      + `</div>`
      + `<div class="cal-dow">${dowHtml}</div>`
      + `<div class="cal-weeks">${weeksHtml}</div>`;
  }

  // Shows only while a past/today day is expanded for this person — lets
  // each daily habit be corrected for that specific day.
  function renderCalendarDayPanel(p){
    const dateKeyStr = expandedCalendarDay[p.id];
    if (!dateKeyStr) return '';
    const c = dayCompletion(p.id, dateKeyStr);
    const date = parseDateKeyToDate(dateKeyStr);
    const label = date.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
    const dailyDefs = habitDefsOf(p.id).filter((h) => h.freq === 'daily');
    const log = state.people[p.id].habitDayLog[dateKeyStr];

    const rows = dailyDefs.map((h) => {
      const done = log ? !!log[h.id] : false;
      return `<div class="cal-day-row" data-person="${p.id}" data-date="${dateKeyStr}" data-habit="${h.id}">`
        + `<div class="cal-day-check" style="background:${done ? p.color : 'transparent'};border-color:${done ? 'transparent' : '#a8afb8'};">${done ? checkSvg() : ''}</div>`
        + `<div class="cal-day-name">${escapeHtml(h.name)}</div>`
        + `</div>`;
    }).join('');

    return `<div class="cal-day-panel">`
      + `<div class="cal-day-panel-head">`
      +   `<div class="cal-day-panel-title">${label}</div>`
      +   `<button class="cal-day-panel-close" data-person="${p.id}">${closeSvg()}</button>`
      + `</div>`
      + (!c.editable ? `<div class="cal-day-note">From before this device tracked which habits &mdash; edit to set it.</div>` : '')
      + rows
      + `</div>`;
  }

  function renderCard(p){
    const totalPoints = computeTotalPoints(p.id);
    const spendablePoints = computeSpendablePoints(p.id);
    const lv = computeLevel(totalPoints);
    const levelTitle = LEVEL_TITLES[Math.min(lv.level, LEVEL_TITLES.length) - 1];
    const ranked = [...ROSTER].sort((a, b) => computeTotalPoints(b.id) - computeTotalPoints(a.id));
    const rank = ranked.findIndex((r) => r.id === p.id) + 1;

    const defs = habitDefsOf(p.id);
    const dailyDefs = defs.filter((h) => h.freq === 'daily');
    const dailyDone = dailyDefs.filter((h) => habitStateOf(p.id, h.id).done).length;
    const dailyTotal = dailyDefs.length;
    const dailyPercent = dailyTotal ? Math.round((dailyDone / dailyTotal) * 100) : 0;

    const bday = nextBirthdayInfo(p.birthday.month, p.birthday.day, new Date());
    const showBday = bday.today || bday.diffDays <= SHOW_BDAY_WITHIN_DAYS;
    const bdayBg = bday.today ? '#ffc93c' : '#e9f6fe';
    const bdayColor = bday.today ? '#22262b' : '#146590';

    const rankBg = rank === 1 ? '#ffc93c' : '#eef0f3';
    const rankColor = rank === 1 ? '#22262b' : '#3d434b';
    const levelBg = tint(p.color, 0.14);
    const showPiggy = pocketWeeklyOf(p.id) > 0;
    const piggyEstimate = showPiggy ? weeklyEstimate(p.id) : 0;

    const habitsHtml = defs.map((h) => {
      const hs = habitStateOf(p.id, h.id);
      const isWeekly = h.freq === 'weekly';
      const filled = isWeekly ? hs.count >= h.target : hs.done;
      const indicator = isWeekly
        ? `<div class="habit-indicator habit-indicator--weekly" style="background:${filled ? p.color : '#eef0f3'};color:${filled ? '#ffffff' : '#3d434b'};">${hs.count}/${h.target}</div>`
        : `<div class="habit-indicator" style="background:${filled ? p.color : 'transparent'};border-color:${filled ? 'transparent' : '#a8afb8'};">${filled ? checkSvg() : ''}</div>`;
      return `<div class="habit-row" data-person="${p.id}" data-habit="${h.id}">`
        + indicator
        + `<div class="habit-name" style="text-decoration:${filled && !isWeekly ? 'line-through' : 'none'};opacity:${filled ? 0.6 : 1};">${escapeHtml(h.name)}</div>`
        + `<div class="habit-streak">${flameSvg()}${hs.streak}${isWeekly ? 'w' : 'd'}</div>`
        + `</div>`;
    }).join('');

    return `<div class="card ${p.id === state.selectedId ? 'is-selected' : ''}" data-person="${p.id}">`
      + `<div class="card-header">`
      +   `<div class="card-header-left">`
      +     `<div class="avatar" style="background:${p.color};">${p.initial}</div>`
      +     `<div><div class="person-name">${escapeHtml(p.name)}</div><div class="person-role">${escapeHtml(p.role)}</div></div>`
      +   `</div>`
      +   `<div class="card-header-right">`
      +     `<div class="rank-badge" style="background:${rankBg};color:${rankColor};">#${rank}</div>`
      +     `<div class="points-stat">Total <b>${totalPoints}</b></div>`
      +     `<div class="points-stat">Now <b>${spendablePoints}</b></div>`
      +   `</div>`
      + `</div>`
      + `<div class="chip-row">`
      +   (showBday ? `<div class="bday-chip" style="background:${bdayBg};color:${bdayColor};">${cakeSvg()}${formatBirthday(bday)}</div>` : '')
      +   `<div class="level-badge" style="background:${levelBg};color:${p.color};">${lv.level >= 3 ? medalSvg() : starSvg()}${escapeHtml(levelTitle)}</div>`
      + `</div>`
      + (showPiggy ? `<div class="piggy-chip">${piggyBankSvg()}&pound;${piggyEstimate.toFixed(2)} this week</div>` : '')
      + `<div class="level-block">`
      +   `<div class="level-bar-row">`
      +     `<div class="level-track"><div class="level-fill" style="width:${Math.round((lv.into / lv.span) * 100)}%;background:${p.color};"></div></div>`
      +     `<div class="level-caption">${lv.into}/${lv.span}</div>`
      +   `</div>`
      + `</div>`
      + `<div class="ring-holder"><div class="ring-wrap">`
      +   `<div class="ring-outer" style="background:${ringGradient(dailyPercent, p.color)};"></div>`
      +   `<div class="ring-inner"><div class="ring-value">${dailyDone}/${dailyTotal}</div><div class="ring-label">today</div></div>`
      + `</div></div>`
      + `<div class="habit-list">${habitsHtml}</div>`
      + `<div class="cal">${renderCalendar(p)}</div>`
      + renderCalendarDayPanel(p)
      + `</div>`;
  }

  function renderSwitcher(){
    return ROSTER.map((p) => {
      const active = currentPage === 'pageSettings' ? p.id === state.settingsFilterId : p.id === state.selectedId;
      return `<div class="switcher-pill" data-person="${p.id}">`
        + `<div class="switcher-avatar ${active ? 'is-active' : ''}" style="background:${p.color};--ring-color:${p.color};">${p.initial}</div>`
        + `<div class="switcher-label ${active ? 'is-active' : ''}">${escapeHtml(p.name)}</div>`
        + `</div>`;

  function renderRewardRow(reward){
    const points = computeSpendablePoints(state.selectedId);

    return `<div class="reward-row">`

  // "How much can I spend right now" — points for the shop below.
  function renderPageStats(){
    const personId = state.selectedId;
    const pts = computeSpendablePoints(personId);
    return `<div class="page-stats">`
      + `<div class="pts-available"><b>${pts}</b> pts to spend</div>`

  // Real money saved (weekly allowance + any cashed-out rewards), on the
  // Wallet tab. Earned total never drops even after a withdrawal; saved is
  // the live balance.
  function renderPiggyStats(){
    const personId = state.selectedId;
    if (!piggyEligible(personId)) return '';
    const saved = piggyBalance(personId);
    const earned = piggyEarnedTotal(personId);
    return `<div class="page-stats">`
      + `<div class="piggy-stats-row">`
      +   `<div class="piggy-saved">&pound;${saved.toFixed(2)} saved</div>`
      +   `<div class="piggy-earned-tag">${piggyBankSvg()}&pound;${earned.toFixed(2)} earned total</div>`
      + `</div>`
      + `</div>`;
  }

  // The withdraw form + ledger appear as soon as someone's eligible for the
  // piggy bank at all — at £0.00 to start, not just after their first payout —
  // so the feature is discoverable instead of invisible.
  function renderPiggySection(){
    const personId = state.selectedId;
    if (!piggyEligible(personId)) return '';
    const balance = piggyBalance(personId);
    const ledger = (state.people[personId].piggyLedger || []).slice().sort((a, b) => b.at.localeCompare(a.at));
    const expanded = !!ledgerExpanded[personId];
    const cappedTotal = Math.min(ledger.length, LEDGER_MAX_ROWS);
    const visible = ledger.slice(0, expanded ? LEDGER_MAX_ROWS : LEDGER_DEFAULT_ROWS);
    const rows = visible.map((e) => {
      const isCredit = e.delta >= 0;
      const d = new Date(e.at);
      const dateStr = Number.isNaN(d.getTime()) ? '' : d.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
      return `<div class="ledger-row">`
        + `<div class="ledger-reason">${escapeHtml(e.reason)}<span class="ledger-date">${dateStr}</span></div>`
        + `<div class="ledger-amount ${isCredit ? 'ledger-in' : 'ledger-out'}">${isCredit ? '+' : '&minus;'}&pound;${Math.abs(e.delta).toFixed(2)}</div>`
        + `</div>`;
    }).join('');
    const toggleHtml = ledger.length > LEDGER_DEFAULT_ROWS
      ? `<button class="ledger-toggle-btn" data-person="${personId}">${expanded ? 'Show less' : `Show more (${cappedTotal - LEDGER_DEFAULT_ROWS})`}</button>`
      : '';
    const cappedNote = (expanded && ledger.length > LEDGER_MAX_ROWS)
      ? `<div class="ledger-capped-note">Showing the most recent ${LEDGER_MAX_ROWS} of ${ledger.length}.</div>`
      : '';
    return `<div class="piggy-section">`
      + `<div class="piggy-section-label">Piggy bank</div>`
      + `<div class="withdraw-row">`
      +   `<input type="number" id="withdrawAmount" class="withdraw-input" placeholder="0.00" min="0.01" max="${balance}" step="0.01" ${balance > 0 ? '' : 'disabled'}>`
      +   `<input type="text" id="withdrawNote" class="withdraw-note" placeholder="What for? (optional)" maxlength="60" ${balance > 0 ? '' : 'disabled'}>`
      +   `<button class="withdraw-btn" id="withdrawBtn" ${balance > 0 ? '' : 'disabled'}>Withdraw</button>`
      + `</div>`
      + `<div class="ledger-label">History</div>`
      + `<div class="ledger-list">${rows}</div>`
      + toggleHtml
      + cappedNote
      + `</div>`;
  }

  // Only appears once the selected person owns at least one un-used reward —
  // buying (Redeem, in the shop below) and claiming (Use, here) are separate
  // actions, so this stays empty most of the time instead of showing dead
  // controls for everything that hasn't been bought yet.
  function renderWalletStrip(){
    const inventory = state.people[state.selectedId].rewardInventory;
    const owned = REWARDS.filter((r) => (inventory[r.id] || 0) > 0);
    if (!owned.length) return '';
    const chips = owned.map((r) => `<div class="wallet-chip">`
      + `<div class="wallet-chip-name">${escapeHtml(r.name)} &times;${inventory[r.id]}</div>`
      + `<button class="wallet-use-btn" data-reward="${r.id}">Use 1</button>`
      + `</div>`).join('');
    return `<div class="wallet-strip">`
      + `<div class="wallet-label">Ready to use</div>`
      + `<div class="wallet-list">${chips}</div>`
      + `</div>`;
  }

  function renderLeaderboard(){
    const ranked = [...ROSTER].sort((a, b) => computeTotalPoints(b.id) - computeTotalPoints(a.id));
    const maxTotal = Math.max(1, ...ranked.map((p) => computeTotalPoints(p.id)));
    return ranked.map((p, i) => {
      const total = computeTotalPoints(p.id);
      const now = computeSpendablePoints(p.id);
      const rank = i + 1;
      const barPct = Math.round((total / maxTotal) * 100);
      const lv = computeLevel(total);
      const levelTitle = LEVEL_TITLES[Math.min(lv.level, LEVEL_TITLES.length) - 1];
      const levelBg = tint(p.color, 0.14);
      return `<div class="lb-row">`
        + `<div class="lb-rank ${rank === 1 ? 'first' : ''}">#${rank}</div>`
        + `<div class="avatar" style="background:${p.color};">${p.initial}</div>`
        + `<div class="lb-info">`
        +   `<div class="lb-name-row">`
        +     `<div class="lb-name">${escapeHtml(p.name)}</div>`
        +     `<div class="lb-level-num">Lvl ${lv.level}</div>`
        +   `</div>`
        +   `<div class="level-badge" style="background:${levelBg};color:${p.color};">${lv.level >= 3 ? medalSvg() : starSvg()}${escapeHtml(levelTitle)}</div>`
        +   `<div class="lb-bar-track"><div class="lb-bar-fill" style="width:${barPct}%;background:${p.color};"></div></div>`
        + `</div>`
        + `<div class="lb-points">`
        +   `<div class="lb-total">${total}</div>`
        +   `<div class="lb-now">${now} now</div>`
        + `</div>`
        + `</div>`;
    }).join('');
  }

  function formatActivityTime(iso){
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return '';
    const now = new Date();
    const dKey = dateKey(d), todayKeyStr = dateKey(now), yestKeyStr = addDaysKey(todayKeyStr, -1);
    const time = d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    if (dKey === todayKeyStr) return `Today, ${time}`;
    if (dKey === yestKeyStr) return `Yesterday, ${time}`;
    return `${d.toLocaleDateString('en-GB', { day:'numeric', month:'short' })}, ${time}`;
  }

  function renderHabitForm(){
    const draft = habitDraft || {};
    const isDaily = draft.freq === 'daily';
    return `<div class="habit-form">`
      + `<div>`
      +   `<div class="habit-form-label">Habit name</div>`
      +   `<input type="text" id="habitNameInput" class="habit-form-input" value="${escapeHtml(draft.name || '')}" placeholder="e.g. Read 20 minutes" maxlength="60">`
      + `</div>`
      + `<div>`
      +   `<div class="habit-form-label">Frequency</div>`
      +   `<div class="habit-form-toggle">`
      +     `<button class="habit-freq-btn ${isDaily ? 'active' : ''}" data-freq="daily">Daily</button>`
      +     `<button class="habit-freq-btn ${!isDaily ? 'active' : ''}" data-freq="weekly">Weekly</button>`
      +   `</div>`
      + `</div>`
      + (!isDaily
          ? `<div>`
            + `<div class="habit-form-label">Times per week</div>`
            + `<div class="habit-stepper">`
            +   `<button class="habit-step-btn" data-field="target" data-delta="-1">&minus;</button>`
            +   `<div class="habit-step-value">${draft.target || 1}</div>`
            +   `<button class="habit-step-btn" data-field="target" data-delta="1">+</button>`
            + `</div>`
            + `</div>`
          : '')
      + `<div>`
      +   `<div class="habit-form-label">Points</div>`
      +   `<div class="habit-stepper">`
      +     `<button class="habit-step-btn" data-field="points" data-delta="-5">&minus;</button>`
      +     `<div class="habit-step-value">${draft.points || 10}</div>`
      +     `<button class="habit-step-btn" data-field="points" data-delta="5">+</button>`
      +   `</div>`
      + `</div>`
      + `<div class="habit-form-actions">`
      +   `<button class="habit-cancel-btn" id="habitCancelBtn">Cancel</button>`
      +   `<button class="habit-save-btn" id="habitSaveBtn">Save</button>`
      + `</div>`
      + `</div>`;
  }

  // Only shows once a specific person is focused via the switcher on
  // Settings — editing needs one person, so this stays empty for "everyone".
  function renderPocketEditor(){
    const personId = state.settingsFilterId;
    if (!personId) return '';
    const p = ROSTER.find((r) => r.id === personId);
    const current = pocketWeeklyOf(personId);
    return `<div class="pocket-editor">`
      + `<div class="habit-editor-heading">${escapeHtml(p.name)}&rsquo;s weekly pocket money</div>`

      +   `<input type="number" id="pocketWeeklyInput" class="withdraw-input" min="0" step="0.5" value="${current}">`
      +   `<button class="withdraw-btn" id="pocketWeeklySaveBtn">Save</button>`
      + `</div>`
      + `<div class="pocket-editor-note">Paid out at the end of each week, scaled by how many days&rsquo; habits were completed. &pound;0 turns the piggy bank off.</div>`

  function renderSettingsGate(){
    return `<div class="pin-gate">`
      + `<div class="pin-gate-icon">${lockSvg(24)}</div>`
      + `<div class="pin-gate-title">Settings locked</div>`
      + `<div class="pin-gate-sub">Enter the PIN to continue.</div>`
      + `<input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" class="pin-input" id="pinInput" placeholder="PIN" autocomplete="off" autofocus>`

  function renderSecuritySection(){
    if (state.settingsPin) {
      return `<div class="security-section">`
        + `<div class="ledger-label">Security</div>`
        + `<div class="security-row">`
        +   `<div class="security-note">This page is locked with a PIN.</div>`
        +   `<button class="security-btn" id="pinRemoveBtn">Remove PIN</button>`
        + `</div>`
        + `</div>`;
    }
    return `<div class="security-section">`

      +   `<button class="withdraw-btn" id="pinSetBtn">Lock with PIN</button>`
      + `</div>`
      + `</div>`;
  }

  function renderHabitEditor(){
    const personId = state.settingsFilterId;
    if (!personId) return '';
    const p = ROSTER.find((r) => r.id === personId);
    const defs = habitDefsOf(personId);

    const rows = defs.map((h, i) => {
      if (habitEditingId === h.id) return renderHabitForm();
      const freqLabel = h.freq === 'daily' ? 'Daily' : `Weekly &times;${h.target}`;
      return `<div class="habit-editor-row">`
        + `<div class="habit-editor-reorder">`
        +   `<button class="habit-move-btn" data-habit="${h.id}" data-dir="-1" ${i === 0 ? 'disabled' : ''}>${chevronUpSvg()}</button>`
        +   `<button class="habit-move-btn" data-habit="${h.id}" data-dir="1" ${i === defs.length - 1 ? 'disabled' : ''}>${chevronDownSvg()}</button>`
        + `</div>`
        + `<div class="habit-editor-info">`
        +   `<div class="habit-editor-name">${escapeHtml(h.name)}</div>`
        +   `<div class="habit-editor-meta">${freqLabel} &middot; ${h.points} pts</div>`
        + `</div>`
        + `<button class="habit-edit-btn" data-habit="${h.id}">${pencilSvg()}</button>`
        + `<button class="habit-delete-btn" data-habit="${h.id}">${trashSvg()}</button>`
        + `</div>`;
    }).join('');

    const addSection = habitEditingId === 'new' ? renderHabitForm() : `<button class="habit-add-btn" id="habitAddBtn">+ Add habit</button>`;

    return `<div class="habit-editor">`
      + `<div class="habit-editor-heading">Editing ${escapeHtml(p.name)}&rsquo;s habits</div>`
      + `<div class="habit-editor-list">${rows}</div>`
      + addSection
      + `</div>`;
  }

  function renderActivityLog(){
    const filterId = state.settingsFilterId;
    const entries = filterId ? state.activityLog.filter((e) => e.personId === filterId) : state.activityLog;
    if (!entries.length) {
      return filterId
        ? '<div class="activity-empty">Nothing from them yet.</div>'
        : '<div class="activity-empty">Nothing yet &mdash; habits, redemptions, and payouts will show up here.</div>';
    }
    return entries.map((e) => {
      const p = ROSTER.find((r) => r.id === e.personId);
      if (!p) return '';
      return `<div class="activity-row">`
        + `<div class="avatar activity-avatar" style="background:${p.color};">${p.initial}</div>`
        + `<div class="activity-body">`
        +   `<div class="activity-msg"><b>${escapeHtml(p.name)}</b> ${e.msg}</div>`
        +   `<div class="activity-time">${formatActivityTime(e.at)}</div>`
        + `</div>`
        + `</div>`;
    }).join('');
  }

  // The mobile top bar (header + switcher) is fixed, so page content needs
  // padding-top matching its real rendered height — measured rather than
  // guessed, since it varies with font metrics and the safe-area inset.
  function syncTopBarHeight(){
    if (!window.matchMedia('(max-width:767px)').matches) return;
    const h = document.getElementById('topBar').offsetHeight;
    document.documentElement.style.setProperty('--mobile-top-h', h + 'px');
  }

  function render(){
    document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
    document.getElementById('switcher').innerHTML = renderSwitcher();
    document.getElementById('cards').innerHTML = ROSTER.map((p) => renderCard(p)).join('');
    document.getElementById('pageStats').innerHTML = renderPageStats();
    document.getElementById('walletSection').innerHTML = renderWalletStrip();
    document.getElementById('rewardList').innerHTML = REWARDS.map((r) => renderRewardRow(r)).join('');
    document.getElementById('piggyStats').innerHTML = renderPiggyStats();
    document.getElementById('piggySection').innerHTML = renderPiggySection();
    document.getElementById('lbList').innerHTML = renderLeaderboard();
    const settingsLocked = !!state.settingsPin && !settingsUnlocked;
    document.getElementById('settingsGateSection').innerHTML = settingsLocked ? renderSettingsGate() : '';
    document.getElementById('settingsContent').style.display = settingsLocked ? 'none' : '';
    if (!settingsLocked) {
      document.getElementById('pocketEditorSection').innerHTML = renderPocketEditor();
      document.getElementById('habitEditorSection').innerHTML = renderHabitEditor();
      document.getElementById('activityList').innerHTML = renderActivityLog();
      document.getElementById('securitySection').innerHTML = renderSecuritySection();
      document.getElementById('settingsBody').style.display = settingsBodyExpanded ? '' : 'none';
      document.getElementById('settingsSubToggle').classList.toggle('expanded', settingsBodyExpanded);
      document.getElementById('settingsSubChevron').innerHTML = settingsBodyExpanded ? chevronUpSvg() : chevronDownSvg();
    }
    document.getElementById('tabHabits').innerHTML = circleCheckSvg(20) + '<span>Habits</span>';
    document.getElementById('tabRewards').innerHTML = giftSvg(20) + '<span>Rewards</span>';
    document.getElementById('tabWallet').innerHTML = piggyBankSvg(20) + '<span>Wallet</span>';
    document.getElementById('tabLeaderboard').innerHTML = trophySvg(20) + '<span>Ranking</span>';
    const settingsIcon = settingsLocked
      ? `<span class="tab-icon-wrap">${settingsSvg(20)}<span class="tab-lock-badge">${lockSvg(9)}</span></span>`
      : settingsSvg(20);
    document.getElementById('tabSettings').innerHTML = settingsIcon + '<span>Settings</span>';
    syncTopBarHeight();
  }

  document.addEventListener('click', (e) => {
    const habitRow = e.target.closest('.habit-row');
    if (habitRow) { toggleHabit(habitRow.dataset.person, habitRow.dataset.habit); return; }
    const calCell = e.target.closest('.cal-cell.clickable');
    if (calCell) {
      const pid = calCell.dataset.person, dk = calCell.dataset.date;
      expandedCalendarDay[pid] = expandedCalendarDay[pid] === dk ? null : dk;
      render();
      return;
    }
    const calClose = e.target.closest('.cal-day-panel-close');
    if (calClose) { expandedCalendarDay[calClose.dataset.person] = null; render(); return; }
    const calDayRow = e.target.closest('.cal-day-row');
    if (calDayRow) {
      const { person, date, habit } = calDayRow.dataset;
      const log = state.people[person].habitDayLog[date];
      const current = log ? !!log[habit] : false;
      setHabitDoneOnDay(person, habit, date, !current);
      saveState();
      render();
      return;
    }
    const pill = e.target.closest('.switcher-pill');
    if (pill) {
      if (currentPage === 'pageSettings') toggleSettingsFilter(pill.dataset.person);
      else selectPerson(pill.dataset.person);
      return;
    }
    const redeemBtn = e.target.closest('.reward-row-btn');
    if (redeemBtn && !redeemBtn.disabled) { redeemReward(redeemBtn.dataset.reward); return; }
    const useBtn = e.target.closest('.wallet-use-btn');
    if (useBtn) { useReward(useBtn.dataset.reward); return; }
    const withdrawBtn = e.target.closest('#withdrawBtn');
    if (withdrawBtn && !withdrawBtn.disabled) {
      const amountEl = document.getElementById('withdrawAmount');
      const noteEl = document.getElementById('withdrawNote');
      drawDownPiggy(parseFloat(amountEl.value), noteEl.value);
      return;
    }
    const ledgerToggleBtn = e.target.closest('.ledger-toggle-btn');
    if (ledgerToggleBtn) {
      const pid = ledgerToggleBtn.dataset.person;
      ledgerExpanded[pid] = !ledgerExpanded[pid];
      render();
      return;
    }
    const settingsSubToggle = e.target.closest('#settingsSubToggle');
    if (settingsSubToggle) {
      settingsBodyExpanded = !settingsBodyExpanded;
      render();
      return;
    }
    const moveBtn = e.target.closest('.habit-move-btn');
    if (moveBtn && !moveBtn.disabled) { moveHabitDef(moveBtn.dataset.habit, parseInt(moveBtn.dataset.dir, 10)); return; }
    const habitEditBtn = e.target.closest('.habit-edit-btn');
    if (habitEditBtn) { startHabitEdit(habitEditBtn.dataset.habit); return; }
    const habitDeleteBtn = e.target.closest('.habit-delete-btn');
    if (habitDeleteBtn) { deleteHabitDef(habitDeleteBtn.dataset.habit); return; }
    const habitAddBtn = e.target.closest('#habitAddBtn');
    if (habitAddBtn) { startHabitAdd(); return; }
    const habitFreqBtn = e.target.closest('.habit-freq-btn');
    if (habitFreqBtn) { setHabitDraftFreq(habitFreqBtn.dataset.freq); return; }
    const habitStepBtn = e.target.closest('.habit-step-btn');
    if (habitStepBtn) { stepHabitDraft(habitStepBtn.dataset.field, parseInt(habitStepBtn.dataset.delta, 10)); return; }
    const habitCancelBtn = e.target.closest('#habitCancelBtn');
    if (habitCancelBtn) { cancelHabitEdit(); return; }
    const habitSaveBtn = e.target.closest('#habitSaveBtn');
    if (habitSaveBtn) { saveHabitEdit(); return; }
    const tabBtn = e.target.closest('.tab-btn');
    if (tabBtn) { switchTab(tabBtn.dataset.page); return; }
    const pocketSaveBtn = e.target.closest('#pocketWeeklySaveBtn');
    if (pocketSaveBtn) { setPocketWeekly(); return; }
    const pinUnlockBtn = e.target.closest('#pinUnlockBtn');
    if (pinUnlockBtn) { submitSettingsPin(); return; }
    const pinSetBtn = e.target.closest('#pinSetBtn');
    if (pinSetBtn) { setSettingsPin(); return; }
    const pinRemoveBtn = e.target.closest('#pinRemoveBtn');
    if (pinRemoveBtn) { removeSettingsPin(); return; }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (e.target.id === 'pinInput') { submitSettingsPin(); }
    else if (e.target.id === 'pinNewInput') { setSettingsPin(); }
  });

  // Kept separate from the click handler and deliberately does NOT call
  // render(): re-rendering on every keystroke would rebuild the input and
  // drop focus/cursor position mid-type.
  document.addEventListener('input', (e) => {
    if (e.target.id === 'habitNameInput' && habitDraft) {
      habitDraft = { ...habitDraft, name: e.target.value };
    }
  });

  let touchStartX = null;
  const cardsEl = document.getElementById('cards');
  cardsEl.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, { passive:true });
  cardsEl.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    touchStartX = null;
    if (Math.abs(dx) < 50) return;
    const idx = ROSTER.findIndex((p) => p.id === state.selectedId);
    const nextIdx = dx < 0 ? (idx + 1) % ROSTER.length : (idx - 1 + ROSTER.length) % ROSTER.length;
    selectPerson(ROSTER[nextIdx].id);
  }, { passive:true });

  rolloverIfNeeded();
  render();

  window.addEventListener('resize', syncTopBarHeight);

  // Catch a midnight/Monday rollover if the page is left open across it.
  setInterval(() => { rolloverIfNeeded(); render(); }, 5 * 60 * 1000);
})();
</script>
</body>
</html>
